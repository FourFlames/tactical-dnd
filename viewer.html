<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battlemap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  :root {
    --sp: 1;
    --bg: #14130f;
    --panel: #1c1b16;
    --panel-2: #232118;
    --line: #34312a;
    --ink: #e9e3d3;
    --ink-dim: #9c9584;
    --ink-faint: #6b6557;
    --gold: #d8b45a;
    --party: #4fb3a4;
    --enemy: #cf6a4c;
    --neutral: #a59f8e;
    --secret: #a98bd6;
    --floor: #2b2922;
    --floor-line: #3a372e;
    --display: 'Cormorant SC', Georgia, serif;
    --sans: 'Inter', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 14px; }
  /* the map is the whole window; everything else floats over it */
  :root { --side-off: 372px; --panel-bg: rgba(28, 27, 22, .85); }
  body.side-closed { --side-off: 40px; }
  @media (max-width: 767px) { :root, body.side-closed { --side-off: 16px; } }
  .app { height: 100vh; overflow: hidden; }

  /* map side */
  .stage { display: block; }
  .topstack { position: fixed; top: 16px; left: 16px; z-index: 10; max-width: calc(100vw - var(--side-off) - 32px); pointer-events: none; }
  .topcol { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
  .topcol > * { pointer-events: auto; }
  .topbar { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 12px; padding: 7px 12px; background: var(--panel-bg); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 28px rgba(0, 0, 0, .35); }
  .topbar .title { min-width: 0; }
  .title { font-family: var(--display); font-size: 18px; letter-spacing: .04em; color: var(--gold); margin: 0; font-weight: 700; }
  .home { color: var(--ink-faint); text-decoration: none; font-size: 18px; align-self: center; }
  .home:hover { color: var(--gold); }
  .round { font-family: var(--mono); color: var(--ink-dim); font-size: 13px; }
  .spacer { display: none; }
  .toggle { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .toggle a { padding: 5px 14px; color: var(--ink-dim); text-decoration: none; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; }
  .toggle a.on { background: var(--panel-2); color: var(--ink); }
  .toggle a.dm.on { color: var(--secret); }
  .mapwrap { position: relative; flex: 1; display: flex; align-items: center; justify-content: center; }
  svg.map { position: absolute; inset: 72px 16px 16px; width: calc(100% - 32px); height: calc(100% - 88px); }
  .map3d { width: 100%; height: 100%; overflow: hidden; cursor: grab; }
  .map3d:active { cursor: grabbing; }
  .net { display: inline-flex; align-items: center; gap: 5px; font: 11px var(--mono); color: var(--ink-faint); cursor: default; }
  .net i { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-faint); }
  .net.ok i { background: #5fb36a; } .net.slow i { background: #e0a93b; } .net.bad i { background: #d9534f; }
  .net.lost { color: #d9534f; } .net.lost i { display: none; }
  .tools { display: flex; gap: 6px; }
  .tools button { background: none; border: 1px solid var(--line); border-radius: 999px; color: var(--ink-dim); font: 11px var(--sans); letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; cursor: pointer; }
  .tools button:hover, .tools button.on { background: var(--panel-2); color: var(--ink); }
  .hover { position: fixed; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 4; pointer-events: none; font-family: var(--mono); font-size: 12px; color: var(--ink-dim); text-shadow: 0 1px 4px #000; }
  .hover b { color: var(--ink); font-weight: 500; }

  .tok { transition: transform calc(.45s / var(--sp)) cubic-bezier(.3,.7,.3,1); cursor: pointer; }
  .tok .ring-turn { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .9 } 50% { opacity: .25 } }
  .burning { animation: flicker 0.9s steps(3) infinite; }
  @keyframes flicker { 0% { opacity: .55 } 50% { opacity: .85 } 100% { opacity: .65 } }
  .trail { stroke-dasharray: 2 5; animation: fade calc(2.4s / var(--sp)) forwards; }
  @keyframes fade { 0% { opacity: .9 } 100% { opacity: 0 } }

  /* sidebar */
  .side { position: fixed; top: 16px; right: 16px; bottom: 16px; width: 340px; z-index: 10; display: flex; flex-direction: column; min-height: 0; overflow: hidden;
    background: var(--panel-bg); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 28px rgba(0, 0, 0, .45); transition: transform .2s, opacity .2s; }
  body.side-closed .side { transform: translateX(calc(100% + 24px)); opacity: 0; visibility: hidden; pointer-events: none; transition: transform .2s, opacity .2s, visibility 0s .2s; }
  .sidetoggle { position: fixed; top: 16px; right: calc(var(--side-off) - 24px); z-index: 11; width: 24px; height: 32px; padding: 0; background: var(--panel-bg); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 8px; color: var(--ink-dim); font: 16px var(--sans); cursor: pointer; }
  .sidetoggle:hover { color: var(--gold); border-color: var(--gold); }
  @media (max-width: 767px) {
    .side { width: calc(100vw - 32px); }
    .sidetoggle { right: 24px; top: 22px; }
    body:not(.side-closed) .logtabs { padding-right: 44px; }
  }
  .section { padding: 14px 18px; border-bottom: 1px solid var(--line); }
  .label { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); margin-bottom: 8px; }
  .order { display: flex; flex-direction: column; gap: 4px; }
  .row { display: grid; grid-template-columns: 10px 1fr auto; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 6px; cursor: pointer; }
  .row:hover { background: var(--panel-2); }
  .row.cur { background: var(--panel-2); box-shadow: inset 2px 0 0 var(--gold); }
  .row.down { opacity: .4; }
  .dot { width: 10px; height: 10px; border-radius: 50%; }
  .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .nm small { color: var(--ink-faint); margin-left: 6px; font-family: var(--mono); font-size: 11px; }
  .hp { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); text-align: right; min-width: 70px; }
  .bar { height: 3px; background: var(--line); border-radius: 2px; margin-top: 3px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--party); }
  .card { font-size: 13px; color: var(--ink-dim); line-height: 1.5; }
  .card h3 { margin: 0 0 4px; font-family: var(--display); font-size: 20px; color: var(--ink); font-weight: 500; letter-spacing: .03em; }
  .card .stats { font-family: var(--mono); font-size: 12px; color: var(--ink); margin: 4px 0 8px; }
  .card .atk { font-family: var(--mono); font-size: 12px; }
  .chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--panel-2); border: 1px solid var(--line); margin: 2px 4px 0 0; color: var(--ink); }
  .log { flex: 1; overflow-y: auto; padding: 12px 18px 18px; min-height: 200px; }
  .entry { padding: 6px 0; border-bottom: 1px dashed #2c2a23; line-height: 1.45; font-size: 13px; }
  .entry .r { font-family: var(--mono); font-size: 10px; color: var(--ink-faint); margin-right: 6px; }
  .entry.narration, .entry.scene { font-family: 'Cormorant Garamond', Georgia, serif; font-weight: 500; font-size: 17px; color: var(--ink); line-height: 1.4; }
  .entry.scene { color: var(--gold); }
  .entry.ruling { color: var(--gold); }
  .entry.attack, .entry.damage, .entry.roll { color: var(--ink-dim); font-family: var(--mono); font-size: 12px; }
  .entry.turn { color: var(--ink); font-weight: 600; font-size: 12px; letter-spacing: .03em; padding-top: 12px; }
  .entry.secret { color: var(--secret); font-style: italic; }
  .entry.turn.lurk { color: var(--secret); font-weight: 500; font-style: italic; }
  .entry.move, .entry.terrain, .entry.condition, .entry.action, .entry.spawn, .entry.heal { color: var(--ink-dim); font-size: 12px; }
  .loggroup.linked { border-left: 2px solid var(--gold); padding-left: 10px; margin: 10px 0; background: var(--panel-2); border-radius: 0 4px 4px 0; }
  .loggroup.linked .entry { padding-right: 8px; }
  .loggroup.linked .entry:last-child { border-bottom: 0; }
  .loglink { display: flex; flex-wrap: wrap; gap: 5px 10px; align-items: center; padding: 7px 8px 2px 0; color: var(--ink-faint); font: 10px var(--sans); }
  .loglink button { background: none; border: 0; padding: 2px 0; color: var(--gold); font: inherit; text-decoration: underline; cursor: pointer; }
  .logtabs button:focus-visible, .loglink button:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  .logempty { color: var(--ink-faint); font: 13px/1.5 var(--sans); padding: 14px 0; }
  .mechanics { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .mechanics span { border: 1px solid var(--line); border-radius: 4px; padding: 2px 5px; color: var(--ink-dim); font: 10px var(--sans); }
  .storydetails { padding: 4px 8px 8px 0; }
  .storydetails summary { cursor: pointer; color: var(--gold); font: 11px var(--sans); padding: 5px 0; }
  .storydetails summary:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .actionstatus { min-width: 0; max-width: 100%; font: 12px/1.5 var(--sans); }
  .actionstatus > :not([hidden]), .pbctl { background: var(--panel-bg); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); border: 1px solid var(--line); border-radius: 8px; padding: 3px 10px; }
  .actionstatus > * + :not([hidden]) { margin-top: 4px; }
  .actionticker { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: var(--ink-dim); }
  .resolving { color: var(--gold); }
  .pbctl { display: flex; gap: 4px; align-items: center; font: 11px var(--sans); color: var(--ink-faint); }
  .pbctl button { background: none; border: 1px solid var(--line); border-radius: 4px; color: var(--ink-dim); padding: 1px 6px; font: inherit; cursor: pointer; }
  .pbctl button.on { color: var(--gold); border-color: var(--gold); }
  .pbctl .skip { margin-left: auto; color: var(--gold); }
  .empty { padding: 60px; text-align: center; color: var(--ink-dim); font-family: var(--display); font-size: 22px; }
  .entry.declare { color: var(--party); font-size: 13px; }
  .act textarea { width: 100%; min-height: 64px; resize: vertical; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font: 14px/1.4 var(--sans); }
  .act textarea:focus { outline: none; border-color: var(--gold); }
  .act .who { font-size: 13px; color: var(--ink-dim); margin-bottom: 8px; }
  .act .who b { color: var(--gold); font-weight: 600; }
  .act .bar2 { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .act #actSend { background: var(--gold); color: #1b1a15; border: 0; border-radius: 6px; padding: 7px 16px; font: 600 13px var(--sans); cursor: pointer; }
  .act #actSend:disabled { opacity: .5; cursor: default; }
  .act .err { color: var(--enemy); font-size: 12px; }
  .act .sent { margin-top: 10px; display: flex; flex-direction: column; gap: 4px; }
  .act .sent div { font-size: 12px; color: var(--ink-dim); }
  .act .sent span { font-family: var(--mono); font-size: 10px; margin-left: 6px; color: var(--ink-faint); }
  .act .sent .pend span { color: var(--gold); }
  .empty code { font-family: var(--mono); font-size: 13px; color: var(--gold); }
  .act .pres { font-size: 10px; letter-spacing: .1em; }
  .act .pres.on { color: #6fbf73; }
  .act .pres.off { color: var(--ink-faint); }
  .act .receipt { margin-top: 8px; font-size: 12px; color: var(--party); line-height: 1.4; }
  .act .pointing { margin-top: 6px; font-size: 12px; color: var(--ink-dim); }
  .act .pointing b { color: var(--gold); font-weight: 500; }
  .act .pointing a { color: var(--ink-faint); cursor: pointer; margin-left: 6px; }
  .act .msg { padding: 6px 0; border-top: 1px dashed #2c2a23; font-size: 12px; color: var(--ink-dim); }
  .act .msg .st { font-family: var(--mono); font-size: 10px; margin-left: 6px; color: var(--ink-faint); white-space: nowrap; }
  .act .msg .st.wait { color: var(--gold); }
  .act .msg .st.ok { color: #6fbf73; }
  .act .msg .q { color: var(--secret); font-family: var(--mono); font-size: 10px; margin-right: 4px; }
  .act .msg .rp { margin-top: 3px; color: var(--ink); font-size: 12px; }
  .act .msg .rp::before { content: 'DM '; font-family: var(--mono); font-size: 10px; color: var(--gold); }

  /* cursor + inspect */
  .curbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; }
  .seg button { background: none; border: 0; color: var(--ink-dim); font: 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; padding: 4px 11px; cursor: pointer; }
  .seg button.on { background: var(--panel-2); color: var(--ink); }
  .zctl { display: flex; align-items: center; gap: 3px; font-family: var(--mono); font-size: 12px; color: var(--ink-dim); }
  .zctl button, .ghost { background: none; border: 1px solid var(--line); color: var(--ink); border-radius: 6px; font: 12px var(--sans); cursor: pointer; padding: 3px 8px; }
  .zctl button:hover, .ghost:hover { background: var(--panel-2); }
  .zctl input { width: 44px; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; font: 12px var(--mono); padding: 3px 4px; text-align: right; }
  .look { margin-top: 8px; font-size: 13px; color: var(--ink-dim); line-height: 1.5; }
  .ecard { border-left: 3px solid var(--c, var(--line)); padding-left: 10px; }
  .ecard .eh { display: flex; align-items: center; gap: 8px; }
  .ecard h3 { margin: 0; flex: 1; min-width: 0; font-family: var(--display); font-size: 20px; color: var(--ink); font-weight: 500; letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ecard .es { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); }
  .ecard .es em { font-style: normal; color: var(--gold); }
  .ecard.pv h3, .ecard.pv .es { opacity: .65; }
  .hchip { font-size: 10px; letter-spacing: .08em; text-transform: uppercase; padding: 1px 8px; border-radius: 999px; border: 1px solid currentColor; white-space: nowrap; }
  .hchip.healthy { color: #6fbf73; } .hchip.bloodied { color: var(--gold); } .hchip.near-death { color: #d25b4a; } .hchip.down { color: var(--ink-faint); }
  .ehp { display: flex; align-items: center; gap: 8px; margin-top: 5px; font: 11px var(--mono); color: var(--ink-dim); }
  .ehp b { flex: 1; height: 4px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .ehp i { display: block; height: 100%; }
  .odds, .achips { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .odds span { font: 11px var(--mono); padding: 2px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel-2); color: var(--ink); }
  .odds span.no { color: var(--ink-faint); }
  .achips span { font: 11px var(--mono); padding: 2px 8px; border-radius: 999px; border: 1px solid; }
  .achips .y { color: #6fbf73; border-color: rgba(111, 191, 115, .45); background: rgba(111, 191, 115, .1); }
  .achips .m { color: var(--gold); border-color: rgba(216, 180, 90, .5); background: rgba(216, 180, 90, .1); }
  .achips .n { color: var(--ink-faint); border-color: var(--line); text-decoration: line-through; }
  .ecard .lns { margin-top: 8px; }
  .ecard .ln { margin: 2px 0; }
  .ecard .facts { margin-top: 8px; border-left: 2px solid var(--gold); padding-left: 8px; color: var(--ink); }
  .ecard .movebox { border-top: 0; margin-top: 8px; padding-top: 0; }
  .ecard .btn.gold { background: none; color: var(--gold); }
  .ecard .btn.gold small { color: var(--ink-faint); }
  .ref { cursor: pointer; border-bottom: 1px dotted var(--c, var(--ink-faint)); }
  .ref:hover { color: var(--gold); }
  .hovchip { position: absolute; z-index: 6; pointer-events: none; padding: 3px 9px; border: 1px solid var(--c, var(--line)); border-radius: 10px; background: rgba(28, 27, 22, .92); font: 11px/1.4 var(--mono); color: var(--ink); white-space: nowrap; box-shadow: 0 4px 14px rgba(0, 0, 0, .45); }
  .hovchip.faint { color: var(--ink-faint); }
  .hovchip small { display: block; font-size: 11px; color: var(--gold); }
  .look .acts { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
  .look .ask { display: flex; gap: 6px; margin-top: 8px; }
  .look .ask input { flex: 1; min-width: 0; background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: 13px var(--sans); }
  .look .ask input:focus { outline: none; border-color: var(--gold); }
  .hint { font-size: 11px; color: var(--ink-faint); margin-top: 8px; line-height: 1.5; }
  .hint kbd { font-family: var(--mono); font-size: 10px; border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; color: var(--ink-dim); }
  .ping { animation: ping 1s ease-out 3; transform-box: fill-box; transform-origin: center; }
  @keyframes ping { 0% { transform: scale(.3); opacity: 1 } 100% { transform: scale(1.7); opacity: 0 } }
  .pinglabel { animation: fade 3.2s forwards; }
  .ping.quiet { animation-iteration-count: 2; animation-duration: .8s; opacity: .7; }
  .soundhint { animation: fade 1.6s forwards; }

  /* floating panels over the map */
  .mapzone { position: fixed; inset: 0; display: flex; }
  .mapzone .mapwrap { flex: 1; }
  .float { position: absolute; z-index: 5; background: rgba(28, 27, 22, .9); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 28px rgba(0, 0, 0, .45); padding: 10px 12px; }
  .fhead { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .caret { background: none; border: 0; color: var(--ink-dim); font-size: 13px; width: 20px; height: 20px; padding: 0; cursor: pointer; border-radius: 4px; transition: transform .15s; }
  .caret:hover { color: var(--ink); background: var(--panel-2); }
  .float.closed .caret { transform: rotate(-90deg); }
  .lookfloat { top: calc(var(--top-h, 56px) + 8px); right: calc(var(--side-off) + 8px); width: 300px; max-width: calc(100vw - 32px); max-height: calc(100% - var(--top-h, 56px) - 24px); overflow-y: auto; }
  .lookfloat.closed .look { display: none; }
  .hud { left: 16px; bottom: 16px; width: min(360px, calc(100% - 32px)); max-height: calc(100vh - 120px); overflow-y: auto; transition: border-color .2s, box-shadow .2s; }
  .hud.mine { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold), 0 0 22px rgba(216, 180, 90, .22), 0 8px 28px rgba(0, 0, 0, .45); }
  .hud .hrow { display: flex; align-items: center; gap: 8px; }
  .hud .hring { position: relative; width: 46px; height: 46px; flex: none; }
  .hud .hring svg { display: block; transform: rotate(-90deg); }
  .hud .hring circle { fill: none; stroke-width: 4; }
  .hud #hpArc { stroke-linecap: round; transition: stroke-dashoffset .4s ease, stroke .4s; }
  .hud .hnum { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font: 600 13px/1 var(--mono); color: var(--ink); }
  .hud .hnum small { font-size: 8px; font-weight: 400; color: var(--ink-faint); margin-top: 1px; }
  .hud .hid { flex: 1; min-width: 0; }
  .hud .hname { font-family: var(--display); font-size: 19px; line-height: 1.1; color: var(--ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hud.mine .hname { color: var(--gold); }
  .hud .hcls { font-size: 11px; color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hud .hchips { display: flex; flex-wrap: wrap; align-items: center; }
  .hud .hchips .chip { font-size: 10px; margin-top: 3px; }
  .hud .hchips .ac { font-family: var(--mono); color: var(--ink-dim); }
  .hud .hside { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; align-self: flex-start; }
  .hud .hside .pres { font-size: 9px; letter-spacing: .08em; text-transform: uppercase; white-space: nowrap; }
  .hud .hside .xbtn { background: none; border: 0; color: var(--ink-dim); font-size: 14px; width: 22px; height: 22px; padding: 0; cursor: pointer; border-radius: 4px; }
  .hud .hside .xbtn:hover { color: var(--ink); background: var(--panel-2); }
  .hud .htabs { display: flex; gap: 4px; margin: 6px 0 0 28px; }
  .hud .htabs button { background: none; border: 1px solid var(--line); color: var(--ink-dim); border-radius: 999px; font: 10px var(--sans); padding: 1px 8px; cursor: pointer; }
  .hud .htabs button.on { color: var(--gold); border-color: var(--gold); }
  .hud .hwait { font-size: 11px; color: var(--ink-faint); margin-top: 6px; }
  .hud .hwait:empty { display: none; }
  .hud .hwait .hp1 { display: inline-flex; margin-left: 10px; vertical-align: middle; }
  .hud .hturn { margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); }
  .hud .hpips { display: flex; align-items: center; gap: 12px; }
  .hud .hp1 { display: flex; align-items: center; gap: 4px; font-size: 9px; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); transition: color .2s; }
  .hud .hp1 i { width: 10px; height: 10px; border-radius: 50%; background: var(--gold); border: 1px solid var(--gold); transition: background .2s, border-color .2s; }
  .hud .hp1.spent { color: var(--ink-faint); opacity: .7; }
  .hud .hp1.spent i { background: transparent; border-color: var(--line); }
  .hud .hatk { font-family: var(--mono); font-size: 10px; color: var(--ink-dim); margin-left: auto; }
  .hud .hmove { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
  .hud .sqs { display: flex; gap: 3px; flex-wrap: nowrap; min-width: 0; }
  .hud .sqs i { width: var(--sq, 12px); height: var(--sq, 12px); flex: none; border-radius: 2px; border: 1px solid var(--party); background: var(--party); transition: background .25s, border-color .25s; }
  .hud .sqs i.spent { background: transparent; border-color: var(--line); }
  .hud .mvtxt { white-space: nowrap; }
  .hud .hres { display: flex; flex-wrap: wrap; gap: 3px 12px; margin-top: 8px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 11px; color: var(--ink-dim); }
  .hud .hres:empty, .hud .hatks:empty { display: none; }
  .res { display: inline-flex; align-items: center; gap: 5px; }
  .res.zero { color: var(--ink-faint); }
  .res i { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--gold); border: 1px solid var(--gold); }
  .res i.o { background: transparent; border-color: var(--line); }
  .res b { font: 500 11px var(--mono); color: var(--gold); }
  .hud .hatks { margin-top: 6px; font-family: var(--mono); font-size: 10.5px; color: var(--ink-dim); line-height: 1.5; }
  .hud .hatks span { white-space: nowrap; }
  .hud .hatks span + span::before { content: '/'; margin: 0 6px; color: var(--line); }
  .hud .hatks em { color: var(--ink-faint); font-style: normal; }
  .hud .hmsgs { margin-top: 8px; padding-top: 6px; border-top: 1px dashed var(--line); }
  .hud .sent { max-height: 120px; overflow-y: auto; margin: 0; }
  .hud.closed .sent { display: none; }
  .hud .sent:empty { display: none; }
  .hud .compose { display: flex; gap: 6px; align-items: flex-end; margin-top: 6px; }
  .hud textarea { min-height: 0; height: 30px; max-height: 100px; flex: 1; resize: none; overflow-y: auto; padding: 5px 9px; font-size: 13px; line-height: 1.35; background: transparent; }
  .hud #actSend { padding: 5px 11px; font-size: 12px; background: var(--panel-2); color: var(--ink); border: 1px solid var(--line); height: 30px; }
  .hud #actSend:hover:not(:disabled) { border-color: var(--gold); color: var(--gold); }
  .hud .err:empty { display: none; }
  .hud .err { margin-top: 6px; }

  /* turn strip (inside the HUD) */
  .btns { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 8px; }
  .btn { background: var(--panel-2); border: 1px solid var(--line); color: var(--ink); border-radius: 6px; font: 12px var(--sans); padding: 4px 9px; cursor: pointer; }
  .btn:hover:not(:disabled) { border-color: var(--gold); }
  .btn:disabled { opacity: .4; cursor: default; }
  .btn.gold { background: var(--gold); color: #1b1a15; border-color: var(--gold); font-weight: 600; }
  .btn.warn { border-color: var(--enemy); color: #f0a08a; }
  .btn small { color: var(--ink-faint); margin-left: 3px; }
  .btn.gold small { color: #4a4027; }
  .tmsg { font-size: 12px; margin-top: 6px; color: var(--ink-dim); min-height: 0; }
  .mvtxt { font-family: var(--mono); font-size: 11px; color: var(--ink-dim); }
  .tmsg.err { color: var(--enemy); }
  .movebox { margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--line); font-size: 12px; }
  .movebox label { color: var(--ink-dim); margin-right: 10px; cursor: pointer; }
  .movebox .warn { color: #f0a08a; margin-top: 4px; }
  .movebox .dcs { color: var(--gold); margin-top: 4px; }
  .look select { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; font: 12px var(--sans); padding: 3px 4px; }

  /* dice + hits */
  .dicetray { position: absolute; top: 96px; left: 50%; transform: translateX(-50%); z-index: 6; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; }
  .roll { display: flex; align-items: center; gap: 10px; background: rgba(20, 19, 15, .92); border: 1px solid var(--line); border-radius: 12px; padding: 8px 14px 8px 8px; box-shadow: 0 10px 30px rgba(0, 0, 0, .5);
    animation: rollin calc(.25s / var(--sp)) cubic-bezier(.2, 1.4, .4, 1); }
  .roll.out { animation: rollout calc(.35s / var(--sp)) forwards; }
  @keyframes rollin { from { transform: translateY(-14px) scale(.9); opacity: 0 } }
  @keyframes rollout { to { transform: translateY(-10px); opacity: 0 } }
  .die { width: 46px; height: 46px; position: relative; display: grid; place-items: center; font: 700 19px var(--mono); color: #1b1a15; }
  .die svg { position: absolute; inset: 0; }
  .die span { position: relative; }
  .die.spin { animation: spin calc(.55s / var(--sp)) cubic-bezier(.3, .6, .4, 1); }
  @keyframes spin { 0% { transform: rotate(-200deg) scale(.6) } 70% { transform: rotate(15deg) scale(1.12) } 100% { transform: rotate(0) scale(1) } }
  .die.nat20 { filter: drop-shadow(0 0 8px #ffd56b); }
  .die.nat1 svg polygon { fill: #8a3b2e; }
  .roll .rt { font-size: 13px; color: var(--ink); line-height: 1.3; }
  .roll .rt small { display: block; color: var(--ink-dim); font-family: var(--mono); font-size: 11px; }
  .roll .res { font-weight: 700; letter-spacing: .06em; }
  .roll .res.hit { color: #f07b5f; } .roll .res.ok { color: #6fbf73; } .roll .res.miss { color: var(--ink-faint); } .roll .res.crit { color: #ffd56b; }
  .tok .inner { transform-box: fill-box; }
  .tok.flash .inner { animation: shake calc(.38s / var(--sp)); }
  .tok.flash circle:first-of-type + circle { stroke: #ff6b4f; }
  @keyframes shake { 0%, 100% { transform: translate(0, 0) } 20% { transform: translate(-4px, 1px) } 40% { transform: translate(4px, -1px) } 60% { transform: translate(-3px, 0) } 80% { transform: translate(2px, 1px) } }
  .dmgnum { font: 800 20px Inter, sans-serif; paint-order: stroke; stroke: #14130f; stroke-width: 4px; animation: rise calc(1.3s / var(--sp)) forwards; }
  .dmgnum.big { font-size: 28px; }
  @keyframes rise { 0% { transform: translateY(6px) scale(.6); opacity: 0 } 15% { transform: translateY(0) scale(1.15); opacity: 1 } 70% { opacity: 1 } 100% { transform: translateY(-26px); opacity: 0 } }
  .hitflash { animation: hf calc(.35s / var(--sp)) forwards; }
  @keyframes hf { from { opacity: .7 } to { opacity: 0 } }

  /* offer dialog */
  .offer { position: absolute; inset: 0; z-index: 8; display: grid; place-items: center; background: rgba(10, 9, 7, .45); }
  .offer .box { width: min(380px, calc(100% - 32px)); background: var(--panel); border: 1px solid var(--gold); border-radius: 12px; padding: 16px 18px; box-shadow: 0 16px 40px rgba(0, 0, 0, .6); }
  .offer h4 { margin: 0 0 6px; font-family: var(--display); font-size: 20px; color: var(--gold); font-weight: 500; }
  .offer p { margin: 0 0 10px; line-height: 1.45; color: var(--ink); }
  .offer .dc { font-family: var(--mono); font-size: 12px; color: var(--gold); margin-bottom: 12px; }

  /* Independent chronicle filters */
  .logtabs { display: flex; gap: 4px; padding: 12px 18px 0; border-bottom: 1px solid var(--line); }
  .logtabs button { background: none; border: 0; border-bottom: 2px solid transparent; color: var(--ink-faint); font: 11px var(--sans); letter-spacing: .12em; text-transform: uppercase; padding: 4px 8px 8px; cursor: pointer; position: relative; }
  .logtabs button.on { color: var(--ink); border-bottom-color: var(--gold); }
  .logtabs button i { display: none; position: absolute; top: 2px; right: -2px; width: 6px; height: 6px; border-radius: 50%; background: var(--gold); }
  .logtabs button.new i { display: block; }
  .logtabs button.sheetbtn { margin-left: auto; }
  .logtabs.sheeting button[data-filter].on { color: var(--ink-faint); border-bottom-color: transparent; }
  .sheet { flex: 1; overflow-y: auto; padding: 14px 18px 18px; min-height: 200px; font-size: 13px; color: var(--ink-dim); line-height: 1.5; }
  .sheet h3 { margin: 0; font-family: var(--display); font-size: 24px; color: var(--ink); font-weight: 500; letter-spacing: .03em; }
  .sheet .scls { font-size: 12px; color: var(--ink-dim); margin-bottom: 10px; }
  .sheet .big { display: flex; gap: 22px; margin: 6px 0 4px; }
  .sheet .big div { font: 600 26px/1 var(--mono); color: var(--ink); }
  .sheet .big small { display: block; margin-top: 3px; font: 10px var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); }
  .sheet h4 { margin: 14px 0 4px; font: 11px var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); font-weight: 400; }
  .sheet .res { display: flex; margin: 3px 0; font-size: 13px; color: var(--ink); }
  .sheet .res.zero { color: var(--ink-faint); }
  .sheet p { margin: 0 0 8px; }
  .sheet .atk { font: 12px var(--mono); color: var(--ink); }
  .hud .hatks em { margin-left: 10px; }
  .sheet .shlink { display: inline-block; margin-top: 12px; font-size: 12px; color: var(--gold); }

  /* initiative strip (top centre, Divinity-style): the current creature large, then the rest of the round */
  /* centred over the map, just under the top bar (--bar-h is measured) */
  .initbar { position: fixed; top: calc(var(--bar-h, 56px) + 6px); left: calc((100vw - var(--side-off)) / 2); transform: translateX(-50%); z-index: 9; max-width: min(60vw, calc(100vw - var(--side-off) - 32px), var(--init-max, 100vw)); pointer-events: none; display: flex; flex-direction: column; align-items: center; gap: 4px; min-height: 0; }
  .initbar > * { pointer-events: auto; }
  .initbar:empty { display: none; }
  .portraits { display: flex; align-items: flex-start; gap: 6px; max-width: 100%; overflow-x: auto; padding: 4px 6px 6px; scrollbar-width: thin; scrollbar-color: var(--line) transparent; }
  .por { flex: none; display: flex; flex-direction: column; align-items: center; gap: 4px; background: none; border: 0; padding: 0; cursor: pointer; color: var(--ink); }
  .por .face { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: #1b1a15; border: 2px solid var(--c, var(--neutral));
    font: 700 15px var(--display); letter-spacing: .02em; box-shadow: 0 3px 10px rgba(0, 0, 0, .45); transition: transform .15s; }
  .por:hover .face { transform: translateY(-2px); }
  .perc { display: inline-flex; align-items: center; vertical-align: middle; margin-right: 6px; cursor: default; }
  .perc .pface { width: 16px; height: 16px; border-radius: 50%; display: grid; place-items: center; background: #1b1a15; border: 1.5px solid var(--c, var(--neutral));
    font: 700 7px var(--display); font-style: normal; color: var(--ink); cursor: pointer; margin-left: -5px; box-sizing: border-box; }
  .perc .pface:first-child { margin-left: 0; }
  .perc .pface:hover { color: var(--gold); position: relative; z-index: 1; }
  .perc .sense { font-size: 10px; margin-left: 3px; opacity: .75; font-family: var(--mono); line-height: 1; }
  .cellchip { font-family: var(--mono); font-size: 10px; color: var(--ink-faint); }
  .por .hpb { width: 34px; height: 3px; border-radius: 2px; background: var(--line); overflow: hidden; }
  .por .hpb i { display: block; height: 100%; }
  .por.cur .face { width: 56px; height: 56px; font-size: 20px; border-width: 3px; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--gold), 0 6px 18px rgba(0, 0, 0, .55); }
  .por.cur .hpb { width: 48px; }
  .por.cur.pop .face { animation: porpop .45s cubic-bezier(.2, 1.4, .4, 1); }
  @keyframes porpop { from { transform: scale(.6); } }
  .por.down .face { opacity: .45; border-style: dashed; }
  .por.hid .face { border-style: dashed; }
  .por.mine .face { background: #1d2a27; }
  .por.unseen .face { border: 2px dashed var(--ink-faint); color: var(--ink-faint); background: #0f0e0b; font-family: var(--sans); font-size: 16px; }
  .por.unseen.cur .face { border-color: var(--secret); color: var(--secret); animation: lurk 1.4s ease-in-out infinite; }
  @keyframes lurk { 50% { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--secret), 0 0 22px rgba(169, 139, 214, .55); } }
  .rdiv { flex: none; align-self: center; margin: 0 4px 10px; font: 10px var(--mono); color: var(--ink-faint); border-left: 1px solid var(--line); padding-left: 8px; height: 30px; display: flex; align-items: center; }
  .initcap { font: 12px var(--sans); color: var(--ink-dim); letter-spacing: .04em; }
  .initcap b { color: var(--gold); font-weight: 600; }
  .initcap .lurk { color: var(--secret); }

  /* turn banner: a short call-out whenever the turn changes */
  .turnbanner { position: absolute; top: 34%; left: 50%; transform: translate(-50%, -50%); z-index: 7; pointer-events: none;
    font: 700 30px var(--display); letter-spacing: .06em; color: var(--gold); text-shadow: 0 2px 14px #000, 0 0 2px #000; white-space: nowrap;
    animation: banner 1.7s ease-out forwards; }
  .turnbanner.lurk { color: var(--secret); font-size: 24px; }
  @keyframes banner { 0% { opacity: 0; transform: translate(-50%, -30%) scale(.9) } 15% { opacity: 1; transform: translate(-50%, -50%) scale(1) } 75% { opacity: 1 } 100% { opacity: 0 } }

  /* 2D zoom controls */
  .zoombox { position: absolute; right: calc(var(--side-off) + 8px); bottom: 16px; z-index: 4; display: flex; gap: 4px; }
  .zoombox button { width: 30px; height: 30px; background: rgba(28, 27, 22, .9); border: 1px solid var(--line); color: var(--ink); border-radius: 6px; font: 15px var(--sans); cursor: pointer; }
  .zoombox button:hover { border-color: var(--gold); }
  .zoombox button.fit { width: auto; padding: 0 8px; font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
  .mapwrap.pannable { cursor: grab; touch-action: none; }
  .mapwrap.panning { cursor: grabbing; }
</style>
</head>
<body>
<div class="app">
  <main class="stage">
    <div class="topstack">
    <div class="topcol">
    <div class="topbar">
      <a class="home" href="/" title="Home: characters and games">&larr;</a>
      <h1 class="title" id="title">Battlemap</h1>
      <span class="round" id="round"></span>
      <span class="spacer"></span>
      <span class="net" id="net" role="status"><i></i><b></b></span>
      <div class="tools" id="tools3d" hidden>
        <button id="bFollow" class="on" aria-pressed="true" title="Follow the active visible creature">Follow turn</button>
        <button id="bWalls" title="Cut walls down so you can see inside">Low walls</button>
        <button id="bCam" title="Reset the camera">Reset view</button>
      </div>
      <div class="toggle">
        <a id="t2d">2D</a>
        <a id="t3d">3D</a>
      </div>
      <div class="toggle" id="toggle">
        <a id="tPlayer">Player</a>
        <a id="tDm" class="dm">DM</a>
      </div>
    </div>
    <div class="actionstatus">
      <div id="actionTicker" class="actionticker" role="status" aria-live="polite" aria-atomic="true" hidden></div>
      <div id="dmResolving" class="resolving" role="status" hidden>DM is resolving…</div>
    </div>
    <div class="pbctl" id="pbctl">Speed <span id="pbSpeeds"></span><button class="skip" id="pbSkip" hidden title="Finish the queued action and show where things are now">Skip to now</button></div>
    </div>
    </div>
    <div class="initbar" id="initbar"></div>
    <div class="mapzone">
      <div class="mapwrap" id="mapwrap"></div>
      <div class="zoombox" id="zoombox" hidden>
        <button id="zmIn" title="Zoom in (scroll wheel)">+</button><button id="zmOut" title="Zoom out">−</button><button class="fit" id="zmFit" title="Fit the whole map">Fit</button>
      </div>
      <!-- Floating over the map: the cursor card (top right) and the player's input (bottom left). -->
      <div class="float lookfloat" id="curSec" hidden>
        <div class="fhead">
          <button class="caret" id="lookCaret" title="Show / hide the card">▾</button>
          <div class="seg"><button id="mSquare" title="Point at a square (M)">Square</button><button id="mEntity" title="Point at a creature (M)">Entity</button></div>
          <div class="zctl" id="zctl" hidden title="Height of the cursor in feet ([ and ])">
            <button id="zDn">−</button><input id="zIn" type="number" step="5"><span>ft</span><button id="zUp">+</button><button id="zFloor" title="Back to the floor">floor</button>
          </div>
        </div>
        <div class="look" id="look"></div>
      </div>
      <div class="hovchip" id="hovchip" hidden></div>
      <div class="dicetray" id="dice"></div>
      <div class="offer" id="offerSec" hidden></div>
      <div class="float act hud" id="actSec" hidden>
        <div class="hrow">
          <button class="caret" id="actCaret" title="Show / hide your messages">▾</button>
          <div class="hring"><svg width="46" height="46" viewBox="0 0 46 46"><circle cx="23" cy="23" r="19" stroke="var(--line)"/><circle id="hpArc" cx="23" cy="23" r="19" stroke="#6fbf73" stroke-dasharray="119.38" stroke-dashoffset="0"/></svg><div class="hnum"><span id="hpNum"></span><small id="hpMax"></small></div></div>
          <div class="hid" id="hudHead"></div>
          <div class="hside"><span class="pres" id="pres"></span><button class="xbtn" id="hudSheet" title="Character sheet">⤢</button></div>
        </div>
        <div class="htabs" id="hudTabs" hidden></div>
        <div class="hwait" id="hudWait"></div>
        <div class="hturn" id="turnSec" hidden>
          <div class="hpips"><span class="hpips" id="tPips"></span><span class="hatk" id="tAtk"></span></div>
          <div class="hmove"><div class="sqs" id="tSq"></div><span class="mvtxt" id="tMv"></span></div>
          <div class="btns" id="tBtns"></div>
          <div class="tmsg" id="tMsg"></div>
        </div>
        <div class="hres" id="hudRes"></div>
        <div class="hatks" id="hudAtks"></div>
        <div class="hmsgs">
          <div class="sent" id="actSent"></div>
          <div class="receipt" id="actReceipt" hidden></div>
          <div class="pointing" id="actPoint" hidden></div>
          <div class="compose">
            <textarea id="actText" maxlength="600" rows="1" placeholder="Tell the DM…"></textarea>
            <button id="actSend" title="Send to the DM (Enter)">Send</button>

    <div class="hover" id="hover"></div>
  </main>
  <button class="sidetoggle" id="sideToggle" title="Show / hide the story panel" aria-controls="side">›</button>

      <button type="button" data-filter="story" aria-pressed="true">Story<i aria-hidden="true"></i></button>
      <button type="button" data-filter="combat" aria-pressed="false">Details<i aria-hidden="true"></i></button>
      <button type="button" class="sheetbtn" id="sheetTab" aria-pressed="false" hidden>Character</button>
    </div>
    <div class="log" id="log"></div>
    <div class="sheet" id="sheet" hidden></div>
  </aside>
</div>

<script src="/lib/rules.js"></script>
<script>
// Side panel: floats over the map; the open/closed choice is remembered (starts closed on narrow screens).
(() => {
  let saved = null; try { saved = localStorage.getItem('sideOpen'); } catch { /* private window */ }
  const btn = document.getElementById('sideToggle');
  const set = (open) => { document.body.classList.toggle('side-closed', !open); btn.textContent = open ? '›' : '‹'; btn.setAttribute('aria-expanded', String(open)); };
  set(saved ? saved === 'on' : innerWidth >= 768);
  btn.addEventListener('click', () => { const open = document.body.classList.contains('side-closed'); set(open); try { localStorage.setItem('sideOpen', open ? 'on' : 'off'); } catch { /* private window */ } });
})();
const params = new URLSearchParams(location.search);
const SEAT = params.get('seat');
const DM = !SEAT && params.has('dm');
const THREE_D = params.has('3d');
// Who this viewer acts as: a seat, or (on the DM's machine, player view) the local player.
const TOKEN = SEAT || (DM ? null : 'local');
// Seated players keep their seat when switching 2D/3D; they never get the DM toggle.
const href = (dm, td) => '/play' + [SEAT && 'seat=' + encodeURIComponent(SEAT), dm && 'dm', td && '3d'].filter(Boolean).join('&').replace(/^./, (c) => '?' + c);
document.getElementById('tPlayer').href = href(false, THREE_D);
document.getElementById('tDm').href = href(true, THREE_D);
document.getElementById('t2d').href = href(DM, false);
document.getElementById('t3d').href = href(DM, true);
document.getElementById(DM ? 'tDm' : 'tPlayer').classList.add('on');
document.getElementById(THREE_D ? 't3d' : 't2d').classList.add('on');
if (SEAT) document.getElementById('toggle').style.display = 'none';
let me = null;
const CELL = 48;
const TOUCH = matchMedia('(hover: none)').matches;
const NS = 'http://www.w3.org/2000/svg';
let state = null, disp = null, selected = null, svg = null, tokLayer = null, fxLayer = null;
let map3d = null, map3dLoading = null, map3dError = null;
let hoveredCreature = null;
let followTurn = (() => { try { return localStorage.getItem('followTurn') !== 'off'; } catch { return true; } })();

const SIDE_COLOR = { party: 'var(--party)', enemy: 'var(--enemy)', neutral: 'var(--neutral)' };
const el = (tag, attrs = {}, parent) => {
  const n = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
  if (parent) parent.appendChild(n);
  return n;
};
const parseCell = (id) => ({ x: id.charCodeAt(0) - 65, y: parseInt(id.slice(1), 10) - 1 });
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function terrainStyle(cell) {
  const t = cell.tags || [];
  if (t.includes('wall')) return { fill: '#1a1915', hatch: true };
  if (t.includes('chasm')) return { fill: '#080807', void: true };
  if (t.includes('bridge')) return { fill: '#5a4027', planks: true };
  if (t.includes('water')) return { fill: '#1f3a44' };
  if (cell.ch === 'o' || t.includes('slick')) return { fill: '#26241c', oil: true };
  const name = (cell.terrain || '').toLowerCase();
  if (/grass|meadow|lawn/.test(name)) return { fill: '#26301c' };
  if (/dirt|mud|earth|sand|path/.test(name)) return { fill: '#2f281d' };
  return { fill: 'var(--floor)' };
}

function buildSvg(v) {
  const W = v.width * CELL, H = v.height * CELL, pad = 22;
  const wrap = document.getElementById('mapwrap');
  wrap.innerHTML = '';
  svg = el('svg', { class: 'map', viewBox: `${-pad} ${-pad} ${W + pad + 4} ${H + pad + 4}` });
  const defs = el('defs', {}, svg);
  const hatch = el('pattern', { id: 'hatch', width: 8, height: 8, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, defs);
  el('line', { x1: 0, y1: 0, x2: 0, y2: 8, stroke: '#26241e', 'stroke-width': 3 }, hatch);
  const glow = el('radialGradient', { id: 'glow' }, defs);
  el('stop', { offset: '0%', 'stop-color': '#ffb347', 'stop-opacity': .95 }, glow);
  el('stop', { offset: '60%', 'stop-color': '#e0612b', 'stop-opacity': .5 }, glow);
  el('stop', { offset: '100%', 'stop-color': '#e0612b', 'stop-opacity': 0 }, glow);
  const sheen = el('linearGradient', { id: 'sheen', x1: 0, y1: 0, x2: 1, y2: 1 }, defs);
  el('stop', { offset: '0%', 'stop-color': '#3d3a2b' }, sheen);
  el('stop', { offset: '50%', 'stop-color': '#6b6440', 'stop-opacity': .55 }, sheen);
  el('stop', { offset: '100%', 'stop-color': '#2a281e' }, sheen);

  // coordinates
  for (let x = 0; x < v.width; x++) { const t = el('text', { x: x * CELL + CELL / 2, y: -8, 'text-anchor': 'middle', fill: 'var(--ink-faint)', 'font-family': 'IBM Plex Mono', 'font-size': 11 }, svg); t.textContent = String.fromCharCode(65 + x); }
  for (let y = 0; y < v.height; y++) { const t = el('text', { x: -9, y: y * CELL + CELL / 2 + 4, 'text-anchor': 'end', fill: 'var(--ink-faint)', 'font-family': 'IBM Plex Mono', 'font-size': 11 }, svg); t.textContent = y + 1; }

  el('g', { id: 'terrain' }, svg);
  fxLayer = el('g', { id: 'fx' }, svg);
  tokLayer = el('g', { id: 'tokens' }, svg);
  el('g', { id: 'fog' }, svg);
  el('g', { id: 'cursor', 'pointer-events': 'none' }, svg);
  el('g', { id: 'pings', 'pointer-events': 'none' }, svg);
  el('g', { id: 'pathfx', 'pointer-events': 'none' }, svg);
  el('g', { id: 'hitfx', 'pointer-events': 'none' }, svg);
  const cellAt = (e) => {
    const pt = svg.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    const p = pt.matrixTransform(svg.getScreenCTM().inverse());
    return { x: Math.floor(p.x / CELL), y: Math.floor(p.y / CELL) };
  };
  svg.addEventListener('mousemove', (e) => { const c = cellAt(e); hoverCell(c.x, c.y); });
  svg.addEventListener('click', (e) => { if (eatClick) return; const c = cellAt(e); if (c.x >= 0 && c.y >= 0 && c.x < state.width && c.y < state.height) clickRef(cellName(c.x, c.y), 'map', [c.x, c.y]); });
  svg.addEventListener('mouseleave', () => { document.getElementById('hover').textContent = ''; hoverPath(-1, -1); });
  wrap.appendChild(svg);
  view2d = { base: { x: -pad, y: -pad, w: W + pad + 4, h: H + pad + 4 } };
  view2d.vb = Object.assign({}, view2d.base);
  wirePanZoom(wrap);
}

// ---------- 2D zoom and pan ----------
// The wheel zooms toward the pointer; dragging pans once zoomed in. A drag never counts as a click.
let view2d = null;
function setViewBox(vb) {
  const b = view2d.base, w = Math.max(b.w / 10, Math.min(b.w, vb.w)), h = w * (b.h / b.w);
  const cx = Math.max(b.x, Math.min(b.x + b.w, vb.x + vb.w / 2)), cy = Math.max(b.y, Math.min(b.y + b.h, vb.y + vb.h / 2));
  view2d.vb = w >= b.w ? Object.assign({}, b) : { x: cx - w / 2, y: cy - h / 2, w, h };
  svg.setAttribute('viewBox', `${view2d.vb.x} ${view2d.vb.y} ${view2d.vb.w} ${view2d.vb.h}`);
  document.getElementById('mapwrap').classList.toggle('pannable', view2d.vb.w < b.w);
}
// Glide the view so a creature's or square's cell is centred, zooming in to a framing scaled by its size (14 cells wide for a
// square or Medium-or-smaller, 18 Large, 24 Huge, 30 Gargantuan) when the view is further out; a closer view stays put.
const FOCUS_CELLS = { large: 18, huge: 24, gargantuan: 30 };
let panAnim = 0;
function focusRef(ref) {
  const c = state && state.creatures[ref];
  if (THREE_D) { if (map3d && map3d.focus && (c || /^[A-Z]\d+$/.test(ref))) map3d.focus(ref); return; }
  const cell = c ? c.pos : /^[A-Z]\d+$/.test(ref) ? ref : null;
  if (!cell || !svg || !view2d) return;
  const p = parseCell(cell), from = Object.assign({}, view2d.vb), cx = (p.x + .5) * CELL, cy = (p.y + .5) * CELL, t0 = performance.now();
  const goal = (c ? FOCUS_CELLS[String(c.size || '').toLowerCase()] || 14 : 14) * CELL, w1 = from.w > goal * 1.3 ? goal : from.w;
  cancelAnimationFrame(panAnim);
  const step = (now) => {
    const k = Math.min(1, (now - t0) / 350), e = k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2;
    const w = from.w + (w1 - from.w) * e, h = w * from.h / from.w; // centre-based so pan and zoom glide together
    const mx = from.x + from.w / 2 + (cx - from.x - from.w / 2) * e, my = from.y + from.h / 2 + (cy - from.y - from.h / 2) * e;
    setViewBox({ x: mx - w / 2, y: my - h / 2, w, h });
    if (k < 1) panAnim = requestAnimationFrame(step);
  };
  panAnim = requestAnimationFrame(step);
}
// A seated player's view opens on their own creature (the active one if they hold the turn), framed like a double-click on
// it; spectators keep fit-all. Once per page load, as soon as both the seat and a drawn map exist.
let camInit = false;
function initialCamera() {
  if (camInit || !state || state.empty || state.error || !(THREE_D ? map3d : svg)) return;
  if (TOKEN && !me) return; // seat not loaded yet
  camInit = true;
  const mine = (me && me.creatures) || [], id = mine.includes(state.current) ? state.current : mine.find((i) => state.creatures[i] && state.creatures[i].pos);
  if (id && state.creatures[id] && state.creatures[id].pos) focusRef(id);
}
// One shared click rule for portraits, log chips, 2D tokens/cells and 3D: the first click acts at once (selects; on the map a
// seated player's wheel opens); a second click on the same ref within 400 ms is a double and adds focusRef on top, leaving
// the selection as the first click made it. Timed by hand because the first click often redraws what was clicked.
let lastTap = {};
function tap(ref) {
  const now = performance.now(), dbl = lastTap.ref === ref && now - lastTap.t < 400;
  lastTap = dbl ? {} : { ref, t: now };
  return dbl;
}
// ref: creature id or cell id. src 'map' also opens the wheel for a seated player. cellXY: the 2D/3D cell click, which selects via pointCell.
function clickRef(ref, src, cellXY) {
  const dbl = tap(ref), isCreature = !!(state && state.creatures[ref]);
  if (dbl) { closeWheel(); focusRef(ref); return; } // the wheel folds back into the token while the camera glides there
  if (cellXY) pointCell(cellXY[0], cellXY[1]); else if (isCreature) pointCreature(ref, src !== 'map'); else pointSquare(ref);

// preventDefault: a chip inside a <summary> would otherwise toggle its details and shift the log under a double-click
document.addEventListener('click', (e) => { const r = e.target.closest && e.target.closest('[data-ref]'); if (r) { e.preventDefault(); clickRef(r.dataset.ref, 'ref'); } });
function zoomBy(f, clientX, clientY) {
  if (!svg || !view2d) return;

  const pt = svg.createSVGPoint(); pt.x = clientX ?? r.left + r.width / 2; pt.y = clientY ?? r.top + r.height / 2;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  setViewBox({ x: p.x - (p.x - vb.x) * f, y: p.y - (p.y - vb.y) * f, w: vb.w * f, h: vb.h * f });
}
function wirePanZoom(wrap) {

  let drag = null, dragged = false;

    if (e.button !== 0 || view2d.vb.w >= view2d.base.w) return;
    drag = { x: e.clientX, y: e.clientY, vb: Object.assign({}, view2d.vb), k: view2d.vb.w / svg.getBoundingClientRect().width };
    dragged = false;
  });

    if (!drag) return;
    const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!dragged && Math.hypot(dx, dy) < 5) return;
    if (!dragged) { dragged = true; svg.setPointerCapture?.(e.pointerId); wrap.classList.add('panning'); }
    setViewBox({ x: drag.vb.x - dx * drag.k, y: drag.vb.y - dy * drag.k, w: drag.vb.w, h: drag.vb.h });
  });
  window.addEventListener('pointerup', () => { drag = null; wrap.classList.remove('panning'); });

document.getElementById('zmIn').addEventListener('click', () => zoomBy(0.7));
document.getElementById('zmOut').addEventListener('click', () => zoomBy(1 / 0.7));
document.getElementById('zmFit').addEventListener('click', () => view2d && setViewBox(view2d.base));

function hoverCell(x, y) {
  hoverPath(x, y);
  const cell = x >= 0 && y >= 0 ? String.fromCharCode(65 + x) + (y + 1) : null;
  hoveredCreature = Object.values(state && state.creatures || {}).find((c) => c.pos === cell)?.id || null;
  const hc = state && x >= 0 && y >= 0 && x < state.width && y < state.height && creatureAtCell(cellName(x, y));
  setHover(hc ? hc.id : null);
  const h = document.getElementById('hover');
  if (!state || x < 0 || y < 0 || x >= state.width || y >= state.height) { h.textContent = ''; return; }
  const c = state.cells[y][x];
  const id = String.fromCharCode(65 + x) + (y + 1);
  if (c.fog === 'unknown') { h.innerHTML = `<b>${id}</b> · unexplored`; return; }
  const bits = [esc(c.terrain)];
  if (c.h) bits.push(`${c.h} ft up`);
  if (c.obj && c.obj.name !== c.terrain) bits.push(`${esc(c.obj.name)} (${c.obj.height} ft)`);
  if (c.tags.length) bits.push(c.tags.map(esc).join(', '));
  if (c.fog === 'remembered') bits.push('out of sight');
  h.innerHTML = `<b>${id}</b> · ${bits.join(' · ')}`;
}

// Walls along grid lines: thick stone lines; doors, windows, low walls and secret doors styled apart.
function drawWalls(v, g) {
  for (const w of v.walls || []) {
    const x1 = w.x1 * CELL, y1 = w.y1 * CELL, x2 = w.x2 * CELL, y2 = w.y2 * CELL;
    const line = (attrs) => el('line', Object.assign({ x1, y1, x2, y2, 'stroke-linecap': 'square' }, attrs), g);
    if (w.kind === 'door') {
      line({ stroke: '#0e0d0a', 'stroke-width': 7 });
      if (w.open) {
        // leaf swung open from the first vertex
        const len = Math.hypot(x2 - x1, y2 - y1), vert = x1 === x2;
        el('line', { x1, y1, x2: x1 + (vert ? len * .8 : 0), y2: y1 + (vert ? 0 : len * .8), stroke: '#8a5f34', 'stroke-width': 4 }, g);
      } else line({ stroke: w.hidden ? 'var(--secret)' : '#8a5f34', 'stroke-width': 4, 'stroke-dasharray': w.hidden ? '5 4' : null });
    } else if (w.kind === 'window') {
      line({ stroke: '#0e0d0a', 'stroke-width': 7 });
      line({ stroke: '#9fb7c4', 'stroke-width': 2 });
    } else if (w.kind === 'low') {
      line({ stroke: '#0e0d0a', 'stroke-width': 5, opacity: .7 });
      line({ stroke: '#8c867a', 'stroke-width': 2.5, 'stroke-dasharray': '3 4' });
    } else {
      line({ stroke: '#0e0d0a', 'stroke-width': 8 });
      line({ stroke: w.hidden ? 'var(--secret)' : '#6d675d', 'stroke-width': 4 });
    }
  }
}

function drawTerrain(v) {
  const g = svg.querySelector('#terrain'), fog = svg.querySelector('#fog');
  g.innerHTML = ''; fog.innerHTML = '';
  for (let y = 0; y < v.height; y++) for (let x = 0; x < v.width; x++) {
    const c = v.cells[y][x], X = x * CELL, Y = y * CELL;
    if (c.fog === 'unknown') { el('rect', { x: X, y: Y, width: CELL, height: CELL, fill: '#0c0b09' }, fog); continue; }
    const st = terrainStyle(c);
    el('rect', { x: X, y: Y, width: CELL, height: CELL, fill: st.fill }, g);
    if (st.hatch) el('rect', { x: X, y: Y, width: CELL, height: CELL, fill: 'url(#hatch)' }, g);
    else el('rect', { x: X + .5, y: Y + .5, width: CELL - 1, height: CELL - 1, fill: 'none', stroke: st.void ? '#121210' : 'var(--floor-line)', 'stroke-width': 1 }, g);
    if (st.planks) for (let i = 1; i < 6; i++) el('line', { x1: X + 4, x2: X + CELL - 4, y1: Y + i * CELL / 6, y2: Y + i * CELL / 6, stroke: '#3b2918', 'stroke-width': 2 }, g);
    if (st.planks) { el('line', { x1: X + 3, x2: X + 3, y1: Y, y2: Y + CELL, stroke: '#a88a5c', 'stroke-width': 1.5 }, g); el('line', { x1: X + CELL - 3, x2: X + CELL - 3, y1: Y, y2: Y + CELL, stroke: '#a88a5c', 'stroke-width': 1.5 }, g); }
    if (st.oil) el('ellipse', { cx: X + CELL / 2, cy: Y + CELL / 2, rx: CELL * .42, ry: CELL * .3, fill: 'url(#sheen)', opacity: .9 }, g);
    if (c.ch === 'B' || c.tags.includes('fire-source')) {
      el('circle', { cx: X + CELL / 2, cy: Y + CELL / 2, r: CELL * .7, fill: 'url(#glow)', class: 'burning' }, g);
      el('circle', { cx: X + CELL / 2, cy: Y + CELL / 2, r: CELL * .22, fill: '#3a2f25', stroke: '#8a6a3f', 'stroke-width': 2 }, g);
    }
    const ok = c.obj && c.obj.kind;
    if (ok === 'barrel') for (const [dx, dy] of [[.36, .38], [.64, .42], [.48, .66]]) { el('circle', { cx: X + dx * CELL, cy: Y + dy * CELL, r: 8, fill: '#7a5330', stroke: '#3d3b39', 'stroke-width': 2 }, g); }
    if (ok === 'pillar') { el('circle', { cx: X + CELL / 2, cy: Y + CELL / 2, r: CELL * .36, fill: '#6d675d', stroke: '#2a2822', 'stroke-width': 3 }, g); }
    if (ok === 'tree') { el('circle', { cx: X + CELL / 2, cy: Y + CELL / 2, r: CELL * .62, fill: '#2f4a22', opacity: .85 }, g); el('circle', { cx: X + CELL / 2, cy: Y + CELL / 2, r: CELL * .12, fill: '#5a4430' }, g); }
    if (c.h) { const t = el('text', { x: X + CELL - 3, y: Y + CELL - 4, 'text-anchor': 'end', fill: 'var(--ink-faint)', 'font-family': 'IBM Plex Mono', 'font-size': 9 }, g); t.textContent = `${c.h}′`; }
    if (c.ch === 'c' || ok === 'crate') { el('rect', { x: X + 7, y: Y + 7, width: CELL - 14, height: CELL - 14, fill: '#6b4e2e', stroke: '#3c2b19', 'stroke-width': 2, rx: 2 }, g); el('path', { d: `M${X + 7} ${Y + 7} L${X + CELL - 7} ${Y + CELL - 7} M${X + CELL - 7} ${Y + 7} L${X + 7} ${Y + CELL - 7}`, stroke: '#3c2b19', 'stroke-width': 1.5 }, g); }
    if (ok === 'rubble' || (c.ch === ',' && /rubble/i.test(c.terrain))) for (const [dx, dy, r] of [[.3, .35, 5], [.62, .3, 4], [.5, .65, 6], [.25, .7, 3], [.75, .7, 4]]) el('circle', { cx: X + dx * CELL, cy: Y + dy * CELL, r, fill: '#4a463b' }, g);
    if (c.tags.includes('burning')) el('rect', { x: X, y: Y, width: CELL, height: CELL, fill: 'url(#glow)', class: 'burning' }, g);

}

function tokenLabels(v) {
  // Two-letter labels; duplicates ("Goblin Archer" x2) get a number from their id instead.
  const base = {}, count = {};
  for (const c of Object.values(v.creatures)) {
    base[c.id] = c.name.replace(/^(Goblin|Brother|Sister|the)\s+/i, '').slice(0, 2);
    count[base[c.id]] = (count[base[c.id]] || 0) + 1;
  }
  const out = {};
  for (const [id, b] of Object.entries(base)) out[id] = count[b] > 1 ? b[0] + ((id.match(/\d+$/) || [''])[0] || id.slice(-1)) : b;
  return out;
}

function drawTokens(v) {
  const seen = new Set();
  const labels = tokenLabels(v);
  for (const c of Object.values(v.creatures)) {
    const p = parseCell(c.pos);
    seen.add(c.id);
    let g = tokLayer.querySelector(`[data-id="${c.id}"]`);
    if (!g) {
      g = el('g', { class: 'tok', 'data-id': c.id }, tokLayer);
      g.style.transform = `translate(${p.x * CELL}px, ${p.y * CELL}px)`;
      g.addEventListener('click', (e) => { e.stopPropagation(); if (eatClick) return; clickRef(c.id, 'map'); });
    }
    g.style.transform = `translate(${p.x * CELL}px, ${p.y * CELL}px)`;
    g.innerHTML = '';
    const inner = el('g', { class: 'inner' }, g);
    const down = (c.hp !== undefined ? c.hp <= 0 : c.health === 'down');
    const color = SIDE_COLOR[c.side] || SIDE_COLOR.neutral;
    const cx = CELL / 2, cy = CELL / 2, R = CELL * .36;
    if (state.current === c.id) el('circle', { cx, cy, r: R + 6, fill: 'none', stroke: 'var(--gold)', 'stroke-width': 2, class: 'ring-turn' }, inner);
    if (selected === c.id) el('circle', { cx, cy, r: R + 9, fill: 'none', stroke: 'var(--ink)', 'stroke-width': 1, 'stroke-dasharray': '3 3' }, inner);
    el('circle', { cx, cy: cy + 2, r: R, fill: '#000', opacity: .45 }, inner);
    el('circle', { cx, cy, r: R, fill: '#1b1a15', stroke: color, 'stroke-width': 3, 'stroke-dasharray': c.hidden ? '4 3' : null, opacity: down ? .5 : 1 }, inner);
    // HP arc when known
    if (c.hp !== undefined && c.maxHp) {
      const f = Math.max(0, Math.min(1, c.hp / c.maxHp)), circ = 2 * Math.PI * (R - 5);
      el('circle', { cx, cy, r: R - 5, fill: 'none', stroke: f > .5 ? '#6fbf73' : f > .25 ? '#d8b45a' : '#d25b4a', 'stroke-width': 2, 'stroke-dasharray': `${circ * f} ${circ}`, transform: `rotate(-90 ${cx} ${cy})`, opacity: .9 }, inner);
    }
    const t = el('text', { x: cx, y: cy + 5, 'text-anchor': 'middle', fill: 'var(--ink)', 'font-family': 'Cormorant SC', 'font-weight': 700, 'font-size': 17, opacity: down ? .5 : 1 }, inner);
    t.textContent = labels[c.id];
    if (down) el('path', { d: `M${cx - 10} ${cy - 10} L${cx + 10} ${cy + 10} M${cx + 10} ${cy - 10} L${cx - 10} ${cy + 10}`, stroke: '#d25b4a', 'stroke-width': 3 }, inner);
    const conds = (c.conditions || []).filter((x) => !['unconscious'].includes(x.name) || !down);
    if (conds.length) { el('circle', { cx: CELL - 8, cy: 8, r: 6, fill: 'var(--secret)' }, inner); }
    // An NPC's visible mood (lib/minds.js): ? curious, ! alert, red ! ready to fight.
    if (c.cue && !down) {
      const cue = el('text', { x: 9, y: 15, 'text-anchor': 'middle', fill: c.cue === 'combat' ? '#d25b4a' : '#d8b45a', stroke: '#1b1a15', 'stroke-width': 3, 'paint-order': 'stroke', 'font-weight': 700, 'font-size': 18 }, inner);
      cue.textContent = c.cue === 'curious' ? '?' : '!';
      el('title', {}, cue).textContent = c.cue === 'curious' ? 'Something caught their attention' : c.cue === 'alert' ? 'On guard, searching' : 'Ready to fight';
    }
  }
  tokLayer.querySelectorAll('.tok').forEach((g) => { if (!seen.has(g.dataset.id)) g.remove(); });
}

function drawTrail(entry) {
  if (!entry || entry.type !== 'move' || !entry.data || !entry.data.path) return;
  const pts = entry.data.path.map(parseCell).map((p) => `${p.x * CELL + CELL / 2},${p.y * CELL + CELL / 2}`).join(' ');
  fxLayer.innerHTML = '';
  el('polyline', { points: pts, fill: 'none', stroke: 'var(--gold)', 'stroke-width': 3, 'stroke-linecap': 'round', class: 'trail' }, fxLayer);

const animates = (e) => e.type === 'move' && e.data && Array.isArray(e.data.path) && e.data.path.length > 1 && !!state.creatures[e.data.id] && !state.creatures[e.data.id].hidden;

const D20 = '<svg viewBox="0 0 46 46"><polygon points="23,2 43,13 43,33 23,44 3,33 3,13" fill="#d8b45a" stroke="#8a6a2f" stroke-width="2"/><polygon points="23,9 37,31 9,31" fill="none" stroke="#8a6a2f" stroke-width="1.2" opacity=".6"/></svg>';

const centerOf = (id) => { const c = (disp || state).creatures[id]; if (!c) return null; const p = parseCell(c.pos); return { x: p.x * CELL + CELL / 2, y: p.y * CELL + CELL / 2 }; };

  return new Promise((done) => {
    const a = centerOf(from), b = centerOf(to), g = svg && svg.querySelector('#hitfx');

    const color = { fire: '#ff8a3d', radiant: '#fff3b0', cold: '#9fe3ff', necrotic: '#b48cff', lightning: '#cfe8ff' }[dtype] || '#e9dcb8';

      wrap.innerHTML = '<div class="map3d" id="map3d"></div>';
      map3dLoading = import('/viewer/map3d.js').then((m) => {
        map3d = m.createMap3D(document.getElementById('map3d'), { onSelect: (id) => clickRef(id, 'map'), onCell: (x, y) => clickRef(cellName(x, y), 'map', [x, y]), onHover: hoverCell });
        map3d.setFollow(followTurn); map3d.setSpeed(pb.speed);
        render(); initialCamera();
      }).catch((e) => {
        map3dError = e;
        wrap.innerHTML = `<div class="empty">The 3D map couldn't load (it fetches three.js from the internet).<br><code>${esc(e.message)}</code><br><a href="${href(DM, false)}" style="color:var(--gold)">Back to 2D</a></div>`;
      });
    }
    return;
  }
  map3d.update(disp, { you: me && me.creatures ? me.creatures[0] : null, selected, hovered: hoveredCreature, cursor: { cell: cursor.cell, z: cursor.z } });
}

const followButton = document.getElementById('bFollow');
followButton.classList.toggle('on', followTurn);
followButton.setAttribute('aria-pressed', String(followTurn));
followButton.addEventListener('click', () => {
  followTurn = !followTurn;
  followButton.classList.toggle('on', followTurn);
  followButton.setAttribute('aria-pressed', String(followTurn));
  try { localStorage.setItem('followTurn', followTurn ? 'on' : 'off'); } catch { /* private window */ }
  if (map3d) map3d.setFollow(followTurn);
});
document.getElementById('bWalls').addEventListener('click', (e) => {
  e.currentTarget.classList.toggle('on');
  if (map3d) map3d.setWallsLow(e.currentTarget.classList.contains('on'));
});
document.getElementById('bCam').addEventListener('click', () => map3d && map3d.resetCamera());

async function refresh() {
  try {
    const r = await fetch(`/api/state?view=${DM ? 'dm' : 'player'}`);
    state = await r.json();
    if (TOKEN) {
      const r = await fetch(`/api/seat?token=${encodeURIComponent(TOKEN)}`);
      me = await r.json();
      if (!r.ok && !SEAT) me = null; // not on the DM's machine: just a spectator
    }
    for (const k of Object.keys(hoverCache)) delete hoverCache[k];
    hoverEpoch++; clearTimeout(hover.timer);
    if (hover.id) hover.timer = setTimeout(() => fetchHover(hover.id), 120);
    if (pw && pw.isOpen && W && W.context !== wheelContext()) closeWheel(); // cached targets or actions changed
    ingest();
    render();
    drawResolving();
    initialCamera();
    if (cursor.id || cursor.cell) fetchLook(); // things moved: what you can tell may have changed
  } catch (e) { /* server restarting */ }
}
// ---------- connection health: round trip of real requests plus a /api/ping every 5 s; a loss glyph on failures or a down stream ----------
const net = { rtt: null, fails: [], stream: 'connecting' };
function netDraw() {
  const now = Date.now(); net.fails = net.fails.filter((t) => now - t < 60000);
  const lost = net.stream !== 'open' && net.stream !== 'connecting' || (net.fails.length && now - net.fails[net.fails.length - 1] < 10000);
  const box = document.getElementById('net'), cls = lost ? 'lost' : net.rtt == null ? '' : net.rtt < 100 ? 'ok' : net.rtt < 300 ? 'slow' : 'bad';
  box.className = 'net ' + cls;
  box.querySelector('b').textContent = lost ? '⚠' : net.rtt == null ? '' : net.rtt + ' ms';
  box.title = `Last round trip: ${net.rtt == null ? 'n/a' : net.rtt + ' ms'}
Failed requests in the last minute: ${net.fails.length}
Event stream: ${net.stream}`;
}
const netFetch = window.fetch.bind(window);
window.fetch = async (input, init) => {
  const u = String(input && input.url || input), t0 = performance.now();
  if (!u.startsWith('/api/')) return netFetch(input, init);
  try {
    const r = await netFetch(input, init);
    if (r.status >= 500) net.fails.push(Date.now()); else net.rtt = Math.round(performance.now() - t0);
    netDraw(); return r;
  } catch (e) { net.fails.push(Date.now()); netDraw(); throw e; }
};
async function netPing() {
  const ac = new AbortController(), to = setTimeout(() => ac.abort(), 4000);
  try { await fetch('/api/ping', { signal: ac.signal, cache: 'no-store' }); } catch { /* counted by the wrapper */ }
  clearTimeout(to);
}
setInterval(netPing, 5000); netPing();
const es = new EventSource('/events');
es.onmessage = refresh;
let esOpened = false;
es.onerror = () => { net.stream = es.readyState === 2 ? 'closed' : 'reconnecting'; netDraw(); };
es.onopen = () => { net.stream = 'open'; netDraw(); if (esOpened) { pb.catchUp = true; refresh(); } esOpened = true; }; // reconnected: play only the current turn
es.addEventListener('ping', (e) => { try { showPing(JSON.parse(e.data)); } catch { /* ignore */ } });
refresh();
// Keeps the "sent 12s ago" clocks honest between pushes.
setInterval(() => { if (SEAT && me && me.intents && me.intents.some((e) => !e.done)) drawAct(); }, 5000);
</script>
