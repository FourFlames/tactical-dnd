<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Battlemap</title>
<style>
  :root {
    --bg: #14120f; --panel: #1d1a16; --line: #2e2923; --ink: #e8e0d0; --dim: #8f8574;
    --floor: #3a342b; --wall: #0e0c0a; --difficult: #4a3d2c; --water: #24404d;
    --yours: #d9a441; --hostile: #c4473a; --wary: #c98a3a; --neutral: #8c8a80; --friendly: #7fa66a; --deferential: #6a8fb5;
    --sel: #f5e6b8; --bad: #e07060;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.4 system-ui, sans-serif; display: grid; grid-template-columns: 1fr 300px; height: 100vh; }
  main { overflow: auto; display: grid; place-items: center; padding: 16px; }
  aside { background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  h1 { font-size: 16px; margin: 0; padding: 14px 16px 4px; }
  .as { padding: 4px 16px 10px; color: var(--dim); }
  .as select { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 4px; padding: 2px 6px; font: inherit; }
  #status { padding: 0 16px 12px; color: var(--dim); min-height: 2.8em; }
  #status.bad { color: var(--bad); }
  #log { flex: 1; overflow: auto; margin: 0; padding: 8px 16px; list-style: none; border-top: 1px solid var(--line); font: 12px/1.5 ui-monospace, monospace; color: var(--dim); }
  #log li b { color: var(--ink); font-weight: normal; }
  .hint { padding: 10px 16px; border-top: 1px solid var(--line); color: var(--dim); font-size: 12px; }
  svg { display: block; max-width: 100%; height: auto; }
  .cell { stroke: var(--line); stroke-width: 0.02; }
  .cell.open:hover { fill-opacity: 0.75; cursor: pointer; }
  .token { transition: transform 90ms linear; }
  .token.yours { cursor: pointer; }
  .token circle { stroke: #000; stroke-width: 0.04; }
  .token.yours circle { stroke: var(--ink); stroke-width: 0.05; }
  .token.sel circle { stroke: var(--sel); stroke-width: 0.08; }
  .token text { font: bold 0.36px system-ui; fill: #14120f; text-anchor: middle; dominant-baseline: central; pointer-events: none; }
  .route { fill: none; stroke: var(--sel); stroke-width: 0.06; stroke-dasharray: 0.12 0.1; pointer-events: none; }
  @media (max-width: 760px) { body { grid-template-columns: 1fr; grid-template-rows: auto 240px; } aside { border-left: 0; border-top: 1px solid var(--line); } }
</style>
</head>
<body>
<main><svg id="map"></svg></main>
<aside>
  <h1 id="title">…</h1>
  <label class="as">Viewing as <select id="as"></select></label>
  <div id="status">Connecting…</div>
  <ul id="log"></ul>
  <div class="hint">Click one of your tokens, hover to preview the route, click a square to move. As the DM, shift-click places it (no route, no speed). Hover a token to see what you notice. Colour is stance: red hostile, amber wary, grey neutral, green friendly.</div>
</aside>
<script>
const NS = 'http://www.w3.org/2000/svg';
const svg = document.getElementById('map'), statusEl = document.getElementById('status'), logEl = document.getElementById('log');
const params = new URLSearchParams(location.search);
const viewer = params.get('as') || 'dm';
// Everything below speaks in this viewer's names: tokens are keyed by `handle`, never by a kernel id.
let room = null, selected = null, previewKey = null, busy = Promise.resolve();

const el = (tag, attrs = {}, parent) => {
  const e = document.createElementNS(NS, tag);
  for (const [k, v] of Object.entries(attrs)) e.setAttribute(k, v);
  if (parent) parent.appendChild(e);
  return e;
};
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const status = (text, bad = false) => { statusEl.textContent = text; statusEl.className = bad ? 'bad' : ''; };
const terrainFill = (t) => t.blocks_move ? 'var(--wall)' : /water/i.test(t.name) ? 'var(--water)' : t.difficult ? 'var(--difficult)' : 'var(--floor)';
const creature = (handle) => room.creatures.find((c) => c.handle === handle);
const label = (handle) => (creature(handle) || { label: handle }).label;
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

async function api(path, body) {
  const r = await fetch(`/api/rooms/${room.id}${path}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ as: viewer, ...body }) });
  return r.json();
}

function drawMap() {
  const { width, height, palette, tiles } = room.map;
  svg.replaceChildren();
  svg.setAttribute('viewBox', `0 0 ${width} ${height}`);
  svg.setAttribute('width', width * 40);
  const cells = el('g', {}, svg);
  for (let y = 0; y < height; y++) for (let x = 0; x < width; x++) {
    const t = palette[tiles[y * width + x]];
    const r = el('rect', { x, y, width: 1, height: 1, fill: terrainFill(t), class: 'cell' + (t.blocks_move ? '' : ' open') }, cells);
    el('title', {}, r).textContent = `${t.name} (${x}, ${y})`;
    r.addEventListener('click', (e) => onCell(x, y, e.shiftKey));
    r.addEventListener('mouseenter', () => preview(x, y));
  }
  el('path', { id: 'route', class: 'route' }, svg);
  const tokens = el('g', { id: 'tokens' }, svg);
  for (const c of room.creatures) {
    const g = el('g', { class: 'token' + (c.yours ? ' yours' : ''), 'data-handle': c.handle }, tokens);
    // Colour is stance: for a seat, how its character feels about this one; for the DM, how this one feels about the party.
    el('circle', { cx: 0.5, cy: 0.5, r: 0.4, fill: c.yours && viewer !== 'dm' ? 'var(--yours)' : `var(--${c.stance || 'neutral'})` }, g);
    el('text', { x: 0.5, y: 0.52 }, g).textContent = c.label.split(/\s+/).map((w) => w[0].toUpperCase()).join('').slice(0, 2);
    const stats = c.hp != null ? ` · ${c.hp}/${c.max_hp} HP · ${c.speed_ft} ft` : '';
    const stance = c.stance ? `\n${viewer === 'dm' ? 'Toward the party' : 'You feel'}: ${c.stance}` : '';
    const appears = c.appears.length ? '\n' + c.appears.map((a) => `· ${a}`).join('\n') : '';
    el('title', {}, g).textContent = `${cap(c.label)} (${c.handle})${stats}${stance}${appears}`;
    if (c.yours) g.addEventListener('click', () => select(c.handle));
  }
  placeTokens();
}
function placeTokens() {
  for (const c of room.creatures) {
    const g = svg.querySelector(`.token[data-handle="${c.handle}"]`);
    if (g) { g.setAttribute('transform', `translate(${c.pos.x} ${c.pos.y})`); g.classList.toggle('sel', c.handle === selected); }
  }
}
function select(handle) {
  selected = selected === handle ? null : handle;
  placeTokens(); showRoute(null);
  status(selected ? `${cap(label(selected))} selected.` : 'Nothing selected.');
}
function showRoute(path) {
  const r = document.getElementById('route');
  if (!path || !path.length) return r.setAttribute('d', '');
  const c = creature(selected);
  r.setAttribute('d', [c.pos, ...path].map((p, i) => `${i ? 'L' : 'M'}${p.x + 0.5} ${p.y + 0.5}`).join(' '));
}

// The route preview is the real command run as a dry run: the kernel is the only thing that knows the rules.
async function preview(x, y) {
  if (!selected) return;
  const key = `${selected}@${x},${y}`;
  previewKey = key;
  const out = await api('/commands', { dry_run: true, commands: [{ type: 'move', who: selected, to: { x, y } }] });
  if (previewKey !== key) return;
  if (out.ok) { showRoute(out.events[0].path); status(`${out.events[0].cost_ft} ft to (${x}, ${y}).`); }
  else { showRoute(null); status(out.reason, true); }
}
async function onCell(x, y, place) {
  if (!selected) return status('Pick one of your tokens first.');
  previewKey = null;
  const out = await api('/commands', { commands: [{ type: place ? 'place' : 'move', who: selected, to: { x, y } }] });
  status(out.ok ? `${cap(label(selected))} selected.` : out.reason, !out.ok);
  showRoute(null);
}

// ---------- steps: the stream is the only thing that moves tokens ----------
// The log is the server's own history lines (the same ones the DM and agents read), newest first.
async function loadLog() {
  const h = await (await fetch(`/api/rooms/${room.id}/history?as=${encodeURIComponent(viewer)}&limit=40`)).json();
  logEl.replaceChildren(...(h.lines || []).slice().reverse().map((line) => {
    const li = document.createElement('li');
    li.innerHTML = esc(line).replace(/^(#\d+)/, '<b>$1</b>');
    return li;
  }));
}
function ingest(st) {
  if (st.step <= room.seq) return;
  room.seq = st.step;
  for (const e of st.events) {
    const c = e.who && creature(e.who);
    if (e.type === 'creature_moved' && c) {
      busy = busy.then(async () => { for (const p of e.path) { c.pos = p; placeTokens(); await new Promise((r) => setTimeout(r, 90)); } });
    } else if (e.type === 'creature_placed' && c) {
      busy = busy.then(() => { c.pos = e.to; placeTokens(); });
    }
  }
  loadLog();
}
async function load() {
  const rooms = await (await fetch('/api/rooms')).json();
  const meta = rooms.find((r) => r.id === params.get('room')) || rooms[0];
  if (!meta) return status('No rooms on the server.', true);
  const pick = document.getElementById('as');
  pick.replaceChildren(...['dm', ...meta.seats].map((s) => new Option(s === 'dm' ? 'DM' : s, s, false, s === viewer)));
  pick.onchange = () => { params.set('as', pick.value); location.search = params; };
  room = await (await fetch(`/api/rooms/${meta.id}?as=${encodeURIComponent(viewer)}`)).json();
  if (room.ok === false) return status(room.reason, true);
  document.getElementById('title').textContent = room.name;
  document.title = room.name;
  drawMap();
  loadLog();
  return room;
}
function connect() {
  const es = new EventSource(`/api/rooms/${room.id}/stream?as=${encodeURIComponent(viewer)}&since=${room.seq}`);
  es.addEventListener('step', (m) => ingest(JSON.parse(m.data)));
  // History changed under us (rewind, a committed edit, or we fell behind): start over from the new main.
  es.addEventListener('reset', async () => { es.close(); await load(); connect(); });
  es.onopen = () => { if (!selected) status('Live. Pick one of your tokens.'); };
  es.onerror = () => { status('Connection lost, retrying…', true); es.close(); setTimeout(() => load().then((r) => r && connect()), 1000); };
}
load().then((r) => r && connect());
</script>
</body>
</html>
