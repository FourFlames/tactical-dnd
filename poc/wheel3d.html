<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Action wheel 3D</title>
<!-- Feel test: the action wheel on a 3D map. Entities are picked by a stem and name pill above them, not by their body.
     No game wiring; everything is fake. Ref: docs/wheel-lexicon.md, poc/wheel.html (the 2D version). -->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  :root {
    --bg: #14130f; --panel: #1c1b16; --panel-2: #232118; --line: #34312a;
    --ink: #e9e3d3; --ink-dim: #9c9584; --ink-faint: #6b6557;
    --gold: #d8b45a; --party: #4fb3a4; --enemy: #cf6a4c; --neutral: #a59f8e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; }
  canvas { display: block; position: fixed; inset: 0; }
  #overlay { position: fixed; inset: 0; pointer-events: none; user-select: none; }
  #stems { position: absolute; inset: 0; width: 100%; height: 100%; }
  #stems line { stroke: #e9e3d3; stroke-width: 1.2; opacity: 0; }
  #stems line.hot { stroke: var(--gold); }

  .mk { opacity: 0; pointer-events: none; position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 5px; height: 22px; padding: 0 8px 0 2px; border-radius: 11px; background: #1c1b16e8; border: 1px solid var(--line); white-space: nowrap; font-size: 11.5px; cursor: pointer; will-change: transform, opacity; }
  .mk .ic { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 10px; font-weight: 700; border: 1.5px solid; background: #14130f; }
  .mk.party .ic { border-color: var(--party); color: var(--party); }
  .mk.enemy .ic { border-color: var(--enemy); color: var(--enemy); }
  .mk.object .ic { border-color: var(--neutral); color: var(--neutral); border-radius: 4px; }
  .mk.square .ic { border-color: var(--gold); color: var(--gold); border-radius: 3px; }
  .mk small { color: var(--ink-faint); }
  .mk:hover, .mk.hot { border-color: var(--gold); background: #2e2a1ef0; }
  /* row scroll arrows: the count of hidden pills sits above */
  .arr { opacity: 0; pointer-events: none; position: absolute; left: 0; top: 0; width: 20px; height: 22px; display: grid; place-items: center; border-radius: 11px; background: #1c1b16e8; border: 1px solid var(--line); color: var(--ink); font-size: 15px; line-height: 1; cursor: pointer; will-change: transform, opacity; }
  .arr b { font-weight: 400; margin-top: -2px; }
  .arr i { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 1px; font: normal 600 10px/12px system-ui, sans-serif; color: var(--gold); }
  .arr.off { cursor: default; color: var(--ink-faint); }
  .arr:not(.off):hover, .arr.hot { border-color: var(--gold); background: #2e2a1ef0; color: var(--gold); }

  /* the wheel (same as poc/wheel.html) */


  .hud { position: fixed; background: #1c1b16e6; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; }
  #top { top: 6px; left: 6px; right: 6px; padding: 3px 8px; font-size: 11px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; color: var(--ink-faint); }
  #top b { color: var(--ink); font-weight: 600; }
  #top kbd { border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; color: var(--ink-dim); font: 10.5px ui-monospace, monospace; }
  #top label { display: flex; gap: 5px; align-items: center; color: var(--ink-dim); }
  #card { top: 36px; right: 8px; width: 210px; color: var(--ink-dim); }
  #card b { color: var(--ink); }
  #log { bottom: 8px; left: 8px; max-width: 420px; }
  #log div { color: var(--ink-dim); }
  #log div:first-child { color: var(--ink); }
  #log code { color: var(--gold); font: 11px ui-monospace, monospace; }
  #log:empty, #card:empty { display: none; }
  [hidden] { display: none !important; }
  #overlay { z-index: 5; } .hud { z-index: 2; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { all: unset; cursor: pointer; padding: 1px 9px; color: var(--ink-dim); font-size: 11px; }
  .seg button.on { background: var(--gold); color: #14130f; font-weight: 600; }

  /* Bar mode: icon-only markers, and the action bar under the selected square */
  body.barmode .mk:not(.square) { padding: 0 2px; }
  body.barmode .mk:not(.square) > span:last-child { display: none; }
  #bar { position: absolute; left: 0; top: 0; z-index: 20; display: flex; align-items: center; gap: 7px; padding: 6px; height: 66px; background: #1c1b16f2; border: 1px solid var(--gold); border-radius: 12px; pointer-events: auto; box-shadow: 0 6px 18px #0009; will-change: transform; }
  .bside { overflow: hidden; display: flex; height: 100%; align-items: center; flex: none; }
  .bside.L { justify-content: flex-end; }
  .btrack { display: flex; gap: 4px; flex: none; will-change: transform; }
  .bside.L .btrack { flex-direction: row-reverse; }
  .tile { width: 80px; height: 52px; flex: none; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer; padding: 0 3px; animation: tinR .24s both; animation-delay: calc(var(--i) * 30ms); }
  .bside.L .tile { animation-name: tinL; }
  .tile i { font-style: normal; color: var(--gold); font-size: 13px; line-height: 14px; }
  .tile b, .tile small { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile b { font-size: 10.5px; font-weight: 600; line-height: 1.15; }
  .tile small { font-size: 9.5px; color: var(--ink-dim); line-height: 1.1; min-height: 10px; }
  .tile:hover { border-color: var(--gold); background: #2e2a1ef0; }
  .tile.off { opacity: .4; cursor: not-allowed; }
  .tile.off:hover { border-color: var(--line); background: var(--panel); }
  .tile.back { border-color: var(--gold); background: #3a321c; }
  .tile.back i { font-size: 17px; }
  @keyframes tinL { from { opacity: 0; transform: translateX(40px); } }
  @keyframes tinR { from { opacity: 0; transform: translateX(-40px); } }
  .bic { width: 50px; height: 52px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 1px solid var(--gold); border-radius: 8px; background: #2a2518; cursor: pointer; }
  .bic:hover { background: #3a321c; }
  .bic small { font-size: 9px; color: var(--ink-dim); max-width: 46px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.1; }
  .bic .ic, .fly .ic { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; border: 2px solid; background: #14130f; }
  .bic.sq .ic { border-radius: 4px; border-color: var(--gold); color: var(--gold); }
  .party .ic { border-color: var(--party); color: var(--party); }
  .enemy .ic { border-color: var(--enemy); color: var(--enemy); }
  .object .ic { border-color: var(--neutral); color: var(--neutral); border-radius: 4px; }
  .fly { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; will-change: transform; }
  /* the one shared tooltip */
  #tip { position: fixed; left: 0; top: 0; z-index: 1000; pointer-events: none; max-width: 250px; padding: 5px 9px; background: #14130ff5; border: 1px solid var(--gold); border-radius: 6px; font-size: 11.5px; color: var(--ink-dim); line-height: 1.35; box-shadow: 0 4px 14px #000a; }
  #tip b { color: var(--ink); }
  #tip .g { color: var(--gold); }
  #tip .tag { color: var(--party); border: 1px solid var(--party); border-radius: 3px; padding: 0 3px; font-size: 9px; }
  #tip code { color: var(--gold); font: 11px ui-monospace, monospace; word-break: break-all; }
</style>
</head>
<body>
<div id="overlay"><svg id="stems"></svg></div>
<div class="hud" id="top">
  <b>Action wheel · 3D</b>
  <span class="seg" id="seg"><button data-m="wheel">Wheel</button><button data-m="bar">Bar</button></span>
  <span id="hint"></span>
  <label><input type="checkbox" id="slow"> slow-mo spin</label>
  <label><input type="checkbox" id="hits"> hit areas</label>
</div>
<div class="hud" id="card"></div>
<div class="hud" id="log"></div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { createPipWheel } from './pip-wheel.js';

const COLS = 12, ROWS = 9, FT = 1 / 5;
const SPIN = () => (document.getElementById('slow').checked ? 600 : 150);
const colName = (c) => String.fromCharCode(65 + c);
const cellName = (c, r) => colName(c) + (r + 1);

const walls = new Set(['A1','B1','C1','D1','E1','F1','G1','H1','I1','J1','K1','L1','A2','A3','A9','L9','L8','D4','D5','I3','L4','L6']);
const chasm = new Set(['G4','G5','G6','H5']);

// Same fake world as the 2D mockup. `alt` is height in feet; hp 0 means down.
const ents = [
  { id: 'rook', name: 'Rook', kind: 'party', me: true, c: 2, r: 6, ac: 18, hp: 28 },
  { id: 'gob1', name: 'Goblin', kind: 'enemy', c: 3, r: 7, ac: 15, hp: 7 },
  { id: 'gob2', name: 'Goblin archer', kind: 'enemy', c: 9, r: 3, ac: 13, hp: 7 },
  { id: 'gob3', name: 'Goblin (behind wall)', kind: 'enemy', c: 8, r: 1, ac: 15, hp: 7 },
  { id: 'door1', name: 'Oak door', kind: 'object', c: 11, r: 4, ac: 15 },
  { id: 'wren', name: 'Wren', kind: 'party', c: 4, r: 5, ac: 14, hp: 0, prone: true },
  { id: 'bat', name: 'Giant bat', kind: 'enemy', c: 4, r: 5, ac: 13, hp: 22, alt: 10 },
  { id: 'sword', name: 'Shortsword', kind: 'object', item: true, c: 4, r: 5 },
];
for (let i = 0; i < 9; i++) ents.push({ id: 'rat' + (i + 1), name: 'Rat ' + (i + 1), kind: 'enemy', rat: true, c: 9, r: 6, ac: 10, hp: 1 });

const me = () => ents.find((e) => e.me);
const dist = (a, b) => 5 * Math.max(Math.abs(a.c - b.c), Math.abs(a.r - b.r), Math.round(((a.alt || 0) - (b.alt || 0)) / 5));
const odds = (bonus, ac, dis) => { const p = Math.min(.95, Math.max(.05, (21 - (ac - bonus)) / 20)); return Math.round(100 * (dis ? p * p : p)) + '%'; };

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#14130f');
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(4.5, 9.5, 14);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(6, 0, 4.8);
controls.enableDamping = true;
controls.maxPolarAngle = 1.38;
controls.mouseButtons = { LEFT: THREE.MOUSE.ROTATE, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.PAN };
controls.update();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

scene.add(new THREE.HemisphereLight('#d9d2bf', '#2a2620', 1.0));
const sun = new THREE.DirectionalLight('#ffe9c4', 1.7);
sun.position.set(9, 14, 3); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10 });
sun.target.position.set(6, 0, 4.5);
scene.add(sun, sun.target);

const occluders = [];   // what blocks the view of a marker (walls and floors)
const floorTop = (c, r) => (chasm.has(cellName(c, r)) ? -2.6 : 0);
const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .85, ...o });
const floorMats = [M('#3d382e'), M('#37332a')];
for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
  const n = cellName(c, r);
  let mesh;
  if (walls.has(n)) {
    mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1.8, 1), M('#2a2620'));
    mesh.position.set(c + .5, .9, r + .5);
  } else if (chasm.has(n)) {
    mesh = new THREE.Mesh(new THREE.BoxGeometry(1, .4, 1), M('#16130f'));
    mesh.position.set(c + .5, -2.8, r + .5);
  } else {
    mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 3, 1), floorMats[(c + r) % 2]);
    mesh.position.set(c + .5, -1.5, r + .5);
  }
  mesh.castShadow = mesh.receiveShadow = true;
  mesh.userData.cell = { c, r };
  occluders.push(mesh); scene.add(mesh);
}
{ // faint grid on the floor
  const pts = [];
  for (let c = 0; c <= COLS; c++) pts.push(c, .005, 0, c, .005, ROWS);
  for (let r = 0; r <= ROWS; r++) pts.push(0, .005, r, COLS, .005, r);
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  scene.add(new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color: '#000000', transparent: true, opacity: .25 })));
}


// ---------- entity bodies ----------
const SIDE = { party: '#4fb3a4', enemy: '#cf6a4c', object: '#a59f8e' };
function body(e) {
  const g = new THREE.Group();
  const col = M(SIDE[e.kind], { roughness: .55 });
  const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); g.add(m); return m; };
  if (e.item) {
    add(new THREE.BoxGeometry(.07, .03, .55), M('#b9b4a8', { metalness: .7, roughness: .3 }), 0, .03, -.05);
    add(new THREE.BoxGeometry(.22, .04, .05), M('#6b4a2b'), 0, .03, .22);
    e.top = .12; e.half = .3;
  } else if (e.kind === 'object') {
    add(new THREE.BoxGeometry(.9, 1.5, .14), M('#6b4a2b'), 0, .75, 0).rotation.y = Math.PI / 2;
    e.top = 1.55; e.half = .45;
  } else if (e.rat) {
    add(new THREE.SphereGeometry(.11, 12, 8), col, 0, .1, 0).scale.set(1, .8, 1.5);
    add(new THREE.SphereGeometry(.06, 10, 8), col, 0, .14, .16);
    e.top = .22; e.half = .14;
  } else if (e.id === 'bat') {
    add(new THREE.SphereGeometry(.16, 14, 10), col, 0, 0, 0);
    for (const s of [-1, 1]) add(new THREE.BoxGeometry(.5, .02, .28), col, s * .32, .04, 0).rotation.z = s * .35;
    e.top = .2; e.half = .55;
  } else {
    const torso = add(new THREE.CapsuleGeometry(.2, .5, 6, 14), col, 0, .5, 0);
    const head = add(new THREE.SphereGeometry(.15, 16, 12), M('#d8c7a8'), 0, 1.05, 0);
    add(new THREE.CylinderGeometry(.34, .36, .06, 24), M('#1f1d18'), 0, .03, 0);
    if (e.prone) { torso.rotation.z = Math.PI / 2; torso.position.set(0, .22, 0); head.position.set(.5, .2, 0); }
    e.top = e.prone ? .45 : 1.25; e.half = e.prone ? .45 : .26;
  }
  g.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.material = o.material.clone(); } });
  scene.add(g);
  return g;
}
// Where each thing stands: things sharing a square spread out within it.
function layout() {
  const groups = {};
  for (const e of ents) (groups[e.c + ',' + e.r] ||= []).push(e);
  for (const list of Object.values(groups)) {
    const ground = list.filter((e) => !e.alt);
    ground.forEach((e, i) => {
      let ox = 0, oz = 0;
      if (ground.length > 1) {
        if (e.rat) { ox = (i % 3 - 1) * .3; oz = (Math.floor(i / 3) - 1) * .3; }
        else if (e.item) { ox = -.28; oz = .25; }
      }
      e.target = new THREE.Vector3(e.c + .5 + ox, floorTop(e.c, e.r), e.r + .5 + oz);
    });
    for (const e of list.filter((x) => x.alt)) e.target = new THREE.Vector3(e.c + .5, floorTop(e.c, e.r) + e.alt * FT, e.r + .5);
  }
  for (const e of ents) if (!e.obj) {
    e.obj = body(e); e.obj.position.copy(e.target);
  }
}
layout();
// `on` is true (full glow) or a strength 0..1
function glow(e, on) {
  if (!e?.obj) return;
  const k = on === true ? .45 : Math.round((+on || 0) * 50) / 50;
  if (e.glowing === k) return;
  e.glowing = k;
  e.obj.traverse((o) => { if (o.isMesh) { o.material.emissive.set(k ? '#d8b45a' : '#000000'); o.material.emissiveIntensity = k; } });
}

// ---------- markers: stem + icon + name ----------
const overlay = document.getElementById('overlay');
const stems = document.getElementById('stems');
const SVGNS = 'http://www.w3.org/2000/svg';
function makeMarker(cls, icon, label) {
  const el = document.createElement('div');
  el.className = 'mk ' + cls;
  el.innerHTML = `<span class="ic">${icon}</span><span>${label}</span>`;
  overlay.appendChild(el);
  const kink = document.createElementNS(SVGNS, 'line');   // screen-space bit from the stem's top to a pill that was pushed aside
  stems.appendChild(kink);
  return { el, kink, stem: makeStem(), w: 0, alpha: 0, x: null, y: null, base: new THREE.Vector3(), ta: { x: 0, y: 0 } };
}
// The stem is a real line in the world: solid where it is in front, dashed and dimmer where something hides it.
const STEM_W = .9;   // world length above the top of the body
function makeStem() {
  const geo = new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(), new THREE.Vector3(0, STEM_W, 0)]);
  const solid = new THREE.Line(geo, new THREE.LineBasicMaterial({ color: '#e9e3d3', transparent: true, opacity: 0 }));
  const dash = new THREE.Line(geo, new THREE.LineDashedMaterial({ color: '#e9e3d3', dashSize: .05, gapSize: .05, transparent: true, opacity: 0, depthFunc: THREE.GreaterDepth, depthWrite: false }));
  dash.computeLineDistances();
  for (const l of [solid, dash]) { l.visible = false; l.frustumCulled = false; scene.add(l); }
  return { solid, dash };
}
for (const e of ents) {
  if (e.me) continue;
  const icon = e.item ? '⚔' : e.kind === 'object' ? '▯' : e.name[0];
  const sub = e.alt ? `<small>${e.alt} ft up</small>` : e.hp === 0 ? '<small>down</small>' : '';
  e.mk = makeMarker(e.kind, icon, e.name + ' ' + sub);
  e.mk.el.onclick = (ev) => { ev.stopPropagation(); pickEntity(e); };
  e.mk.el.onmouseenter = () => { mkHover = e; };
  e.mk.el.onmouseleave = () => { if (mkHover === e) mkHover = null; };
  e.mk.el.classList.add('tipped');
  e.mk.el._tip = `<b>${e.name}</b>${e.alt ? ' · ' + e.alt + ' ft up' : e.hp === 0 ? ' · down' : ''}<br>Click to select`;
}
const sqMk = makeMarker('square', '▢', '');
let hoverEnt = null, mkHover = null;
let mode = 'wheel';   // 'wheel' | 'bar'
let B = null;         // the action bar: { square, ent, L: menu stack, R: menu stack, scroll }

const mouse = { x: -1e4, y: -1e4 };
addEventListener('pointermove', (ev) => { mouse.x = ev.clientX; mouse.y = ev.clientY; mouse.ui = ev.target !== renderer.domElement; mouse.btn = ev.buttons; });
document.addEventListener('pointerleave', () => { mouse.x = mouse.y = -1e4; });

const ray = new THREE.Raycaster();
const tmp = new THREE.Vector3();
function toScreen(v) {
  tmp.copy(v).project(camera);
  return { x: (tmp.x + 1) / 2 * innerWidth, y: (1 - tmp.y) / 2 * innerHeight, front: tmp.z < 1 && Math.abs(tmp.x) < 1.15 && Math.abs(tmp.y) < 1.15 };
}
// In view = some part of the body or of its stem (middle, top, or along the stem) has a clear line from the camera.
function inView(e) {
  for (const h of [e.top, e.top / 2, e.top + STEM_W * .5, e.top + STEM_W]) {
    const p = e.obj.position.clone().setY(e.obj.position.y + h + .02);
    const d = p.distanceTo(camera.position);
    ray.set(camera.position, p.sub(camera.position).normalize()); ray.far = d - .05;
    if (!ray.intersectObjects(occluders, false).length) return true;
  }
  return false;
}

// Pills whose stem tops are close on screen share one row: one baseline, packed, in the order of their stems' x, the
// whole row centred (least squares) over its stems. A row wider than ~60% of the window shows a window of its pills,
// with an arrow at each end; hovering an arrow slides the window along (one pill per ROW_STEP ms).
const ROW_GAP = 4, ARR_W = 20, ROW_STEP = 220, MAX_PILLS = 5;
const rows = [];
function makeRow() {
  const r = { t: 0, off: 0, hot: 0, stepAt: 0, a: 0, amax: 0, n: 0, cap: 0, used: false, lx: 0, rx: 0, y: 0 };
  for (const d of [-1, 1]) {
    const el = document.createElement('div');
    el.className = 'arr tipped';
    el.innerHTML = `<i></i><b>${d < 0 ? '‹' : '›'}</b>`;
    el.onpointerenter = () => { if (!el.classList.contains('off')) { r.hot = d; r.stepAt = 0; } };
    el.onpointerleave = () => { if (r.hot === d) r.hot = 0; };
    overlay.appendChild(el);
    r[d < 0 ? 'aL' : 'aR'] = el;
  }
  rows.push(r);
  return r;
}
// Group the active pills by stem-top proximity on screen (a pair already in the same row links a bit further: no flicker).
function groupPills(act) {
  const par = act.map((_, i) => i), find = (i) => (par[i] === i ? i : (par[i] = find(par[i])));
  for (let i = 0; i < act.length; i++) for (let j = i + 1; j < act.length; j++) {
    const a = act[i], b = act[j], k = a.row && a.row === b.row ? 1.5 : 1;

function updateMarkers() {
  const bar = mode === 'bar';

  const now = performance.now();
  // 1. which bodies are on screen, in view, and near the cursor
  for (const e of ents) {
    if (!e.mk) continue;
    const s = toScreen(e.obj.position.clone().setY(e.obj.position.y + e.top));
    e.anchor = s;
    e.mk.base.copy(e.obj.position).y += e.top;
    e.mk.ta = toScreen(tmp.copy(e.mk.base).setY(e.mk.base.y + STEM_W));
    const pillD = e.mk.alpha > .1 ? Math.hypot(mouse.x - e.mk.x, mouse.y - e.mk.y) : 1e9;
    let want = 0;

      const ramp = Math.max(nearRamp(e, NEAR_SCORE), Math.min(1, Math.max(0, (60 - pillD) / 30)));
      if (B?.ent === e) want = 0;   // its icon is in the bar

      else if (s.front && (hoverEnt === e || (!B && ramp > 0)) && inView(e)) want = hoverEnt === e ? 1 : ramp;
      e.gate = B?.ent !== e && s.front && !(B && !B.ent);
    } else {
      const ramp = Math.max(nearRamp(e, NEAR_SCORE_PILLS), Math.min(1, Math.max(0, (60 - pillD) / 30)));

  for (const e of ents) if (e.mk?.row?.used && e.gate && e.want < keep.get(e.mk.row)) e.want = keep.get(e.mk.row);

  // 2. each pill starts straight above its stem's top; pills with nearby stem tops share a row
  const items = [...ents.filter((e) => e.mk).map((e) => Object.assign(e.mk, { ent: e, wantA: e.want })), Object.assign(sqMk, { wantA: sqMk.want })]

    const votes = new Map();

    let r = [...votes].sort((a, b) => b[1] - a[1])[0]?.[0];

  // 3. draw

function updateHover() {
  const free = !W && !mouse.ui && !mouse.btn && mouse.x > -1e3;
  if (free) lastBody = bodyAt(mouse.x, mouse.y, lastBody); else { hoverScores(mouse.x, mouse.y); lastBody = null; }
  hoverEnt = W ? null : mkHover || lastBody;
  renderer.domElement.style.cursor = hoverEnt ? 'pointer' : '';
  drawHits();
}
function barClick(x, y) {
  const e = bodyAt(x, y, lastBody);
  if (e) return barSelectEnt(e);
  const cell = cellAt(x, y);
  if (cell) return barSelectSquare(cell.c, cell.r);
  closeBar();
}
// Debug: draw the hover ellipses.
const hitsEl = document.createElementNS(SVGNS, 'g');
stems.appendChild(hitsEl);
function drawHits() {
  if (!document.getElementById('hits').checked) { if (hitsEl.firstChild) hitsEl.innerHTML = ''; return; }
  hitsEl.innerHTML = ents.filter((e) => e.hv?.front).map((e) => { const h = e.hv;
    return `<ellipse cx="${h.x}" cy="${h.y}" rx="${h.rx}" ry="${h.ry}" fill="none" stroke="${e === hoverEnt ? '#d8b45a' : '#e9e3d366'}" stroke-dasharray="${h.s < 1 ? '' : '3 3'}"/>`; }).join('');
}

// The selected square, drawn on the floor.
const selSq = new THREE.Group();
{
  const g = new THREE.PlaneGeometry(.94, .94).rotateX(-Math.PI / 2);
  selSq.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color: '#d8b45a', transparent: true, opacity: .22, depthWrite: false })),
    new THREE.LineSegments(new THREE.EdgesGeometry(g), new THREE.LineBasicMaterial({ color: '#d8b45a' })));
  selSq.visible = false; scene.add(selSq);
}

// layout: [square actions … ←] [square icon] [entity icon] [→ … entity actions]; each side is a clipped, scrollable track
const TW = 80, TG = 4, IC = 50, SEP = 7, PAD = 6, BAR_H = 66;
const NEUTRAL = .5, MAX_SPEED = 700;   // fraction of the half-width that doesn't scroll; px/s at the very edge
const barEl = document.createElement('div');
barEl.id = 'bar'; barEl.hidden = true;
barEl.innerHTML = '<div class="bside L"><div class="btrack"></div></div><div class="bic sq tipped"></div><div class="bic en tipped"></div><div class="bside R"><div class="btrack"></div></div>';
overlay.appendChild(barEl);
const [vL, icSq, icEn, vR] = barEl.children;
const tracks = { L: vL.firstChild, R: vR.firstChild };

const GLYPH = { Strike: '⚔', Signature: '➤', Kit: '✦', Tactics: '♟', Inspect: '?', Move: '➜', Aid: '✚', Use: '◆', Talk: '“', 'Try something': '✧', Other: '…', 'Move here': '➜', Dash: '≫', 'Aim here': '◎', Tricks: '✧', Ping: '!' };
function itemsOf(stack) {
  const menu = stack[stack.length - 1];
  const items = [];
  for (const [, s] of Object.entries(menu.slots).sort((a, b) => a[0] - b[0])) {
    items.push({ ...s });
    if (s.full && stack.length === 1) items.push({ what: 'All attacks', role: 'Strike', sub: s.full });
  }
  if (stack.length > 1) items.unshift({ back: true, what: 'Back' });
  return items;
}
function tipOf(s, stack) {
  if (s.back) return `<b>Back</b><br>Return to ${stack[stack.length - 2].title}`;
  const t = `<b>${s.what}</b>${s.odds ? ` <span class="g">${s.odds}</span>` : ''}${s.self ? ' <span class="tag">self</span>' : ''}`;
  if (s.off) return t + '<br>Not available right now';
  if (s.sub) return t + '<br>Opens more options';
  if (s.inspect) return t + `<br>Look closely at ${s.inspect.name}`;
  if (s.inspectSq) return t + `<br>Look closely at ${s.inspectSq}`;
  return t + (s.act ? `<br><code>${s.act}</code>` : '');
}
function tileEl(s, stack, side, i) {
  const el = document.createElement('div');
  el.className = 'tile tipped' + (s.off ? ' off' : '') + (s.back ? ' back' : '');
  el.style.setProperty('--i', i);
  const small = s.back ? stack[stack.length - 1].title : s.self ? 'self' + (s.odds ? ' · ' + s.odds : '') : s.odds || '';
  el.innerHTML = `<i>${s.back ? '↶' : GLYPH[s.role] || s.what[0]}</i><b>${s.what}${s.sub ? ' ▸' : ''}</b><small>${small}</small>`;
  el._tip = tipOf(s, stack);
  el.onclick = () => barPick(s, side);
  return el;
}
function buildBar(sides = 'LR') {
  for (const side of sides) {
    const track = tracks[side], stack = B[side];
    track.innerHTML = '';
    if (stack) itemsOf(stack).forEach((s, i) => track.appendChild(tileEl(s, stack, side, i)));
    B['n' + side] = track.children.length;
    if (side === 'L' ? B.scroll > 0 : B.scroll < 0) B.scroll = 0;
  }
  const n = cellName(B.square.c, B.square.r), e = B.ent;
  vR.hidden = icEn.hidden = !e;
  icSq.innerHTML = `<span class="ic">▢</span><small>${n}</small>`;
  icSq._tip = `<b>${n}</b><br>Click to deselect the square`;
  icSq.onclick = closeBar;
  if (e) {
    icEn.className = `bic en tipped ${e.kind}`;
    icEn.innerHTML = `<span class="ic">${e.mk.el.firstChild.textContent}</span><small>${e.name}</small>`;
    icEn._tip = `<b>${e.name}</b><br>Click to deselect (back to ${n})`;
    icEn.onclick = () => { B.ent = null; B.R = null; buildBar('R'); };
  }
  barEl.hidden = false;
}
function barSelectSquare(c, r) {
  closeAll();
  B = { square: { c, r }, ent: null, L: [squareRoot({ c, r })], R: null, scroll: 0, nL: 0, nR: 0 };
  buildBar();
}
function barSelectEnt(e) {
  const sameSq = B && B.square.c === e.c && B.square.r === e.r;
  const from = e.mk.alpha > .15 ? { x: e.mk.x, y: e.mk.y } : { x: e.mk.ta.x, y: e.mk.ta.y - 13 };
  if (!sameSq) B = { square: { c: e.c, r: e.r }, L: [squareRoot({ c: e.c, r: e.r })], scroll: 0, nL: 0, nR: 0 };
  B.ent = e; B.R = [rootFor(e)]; B.fly = from;
  buildBar(sameSq ? 'R' : 'LR');
}
function barPick(s, side) {
  if (s.off) return;
  const stack = B[side];
  if (s.back) stack.pop();
  else if (s.sub) stack.push(s.sub());
  else { runSlot(s); return closeBar(); }
  buildBar(side);
}
function barBack() {   // one step out: submenu, then entity, then the square
  if (!B) return;
  if (B.R && B.R.length > 1) { B.R.pop(); buildBar('R'); }
  else if (B.L.length > 1) { B.L.pop(); buildBar('L'); }
  else if (B.ent) { B.ent = null; B.R = null; buildBar('R'); }
  else closeBar();
}
function closeBar() {
  B = null; barEl.hidden = true; selSq.visible = false; setTip(null);
  document.querySelectorAll('.fly').forEach((f) => f.remove());
  icEn.style.visibility = '';
}
// The entity's icon leaves its marker and slides into the bar.
function startFly(from, e) {
  const t = icEn.firstChild.getBoundingClientRect();
  const to = { x: t.left + t.width / 2, y: t.top + t.height / 2 };
  const f = document.createElement('div');
  f.className = 'fly ' + e.kind;
  f.innerHTML = `<span class="ic">${e.mk.el.firstChild.textContent}</span>`;
  document.body.appendChild(f);
  icEn.style.visibility = 'hidden';
  const a = f.animate([{ transform: `translate(${from.x - 13}px, ${from.y - 13}px) scale(.7)` }, { transform: `translate(${to.x - 13}px, ${to.y - 13}px) scale(1)` }], { duration: 300, easing: 'cubic-bezier(.2,.9,.25,1)' });
  a.onfinish = a.oncancel = () => { f.remove(); icEn.style.visibility = ''; };
}
const fade = (el, l, r) => {
  const m = `linear-gradient(90deg, ${l ? 'transparent' : '#000'} 0, #000 24px, #000 calc(100% - 24px), ${r ? 'transparent' : '#000'} 100%)`;
  if (el._m !== m) { el._m = m; el.style.maskImage = el.style.webkitMaskImage = m; }
};
// The bar hangs below the selected square and follows it; it is clamped into the window.
function updateBar(now) {
  if (!B) return;
  const { c, r } = B.square, y0 = floorTop(c, r);
  selSq.visible = true; selSq.position.set(c + .5, y0 + .012, r + .5);
  const cs = [[c, r], [c + 1, r], [c, r + 1], [c + 1, r + 1]].map(([x, z]) => toScreen(new THREE.Vector3(x, y0, z)));
  const sx = cs.reduce((a, p) => a + p.x, 0) / 4, bottom = Math.max(...cs.map((p) => p.y));
  const hasR = !!B.ent;
  const Lt = B.nL ? B.nL * (TW + TG) - TG : 0, Rt = hasR && B.nR ? B.nR * (TW + TG) - TG : 0;
  const fixed = 2 * (PAD + 1) + IC * (hasR ? 2 : 1) + SEP * (hasR ? 3 : 1);
  const full = Math.max(0, innerWidth - 16 - fixed);
  const Lw = Math.min(Lt, hasR ? full - Math.min(Rt, full / 2) : full), Rw = hasR ? Math.min(Rt, full - Lw) : 0;
  const barW = fixed + Lw + Rw;
  const left = Math.max(8, Math.min(innerWidth - 8 - barW, sx - (PAD + 1) - Lw - SEP - IC / 2));
  const top = Math.max(4, Math.min(innerHeight - BAR_H - 6, bottom + 10));
  barEl.style.transform = `translate(${left}px, ${top}px)`;
  vL.style.width = Lw + 'px'; vR.style.width = Rw + 'px';
  // edge scrolling: nothing in the middle half, then quadratically faster toward either end
  const maxL = Math.max(0, Lt - Lw), maxR = Math.max(0, Rt - Rw);
  const dt = Math.min(.05, (now - (B.t || now)) / 1000); B.t = now;
  if ((maxL || maxR) && Math.abs(mouse.y - (top + BAR_H / 2)) < BAR_H / 2 + 30 && mouse.x > left - 60 && mouse.x < left + barW + 60) {
    const u = Math.max(-1, Math.min(1, (mouse.x - (left + barW / 2)) / (barW / 2)));
    const t = Math.max(0, (Math.abs(u) - NEUTRAL) / (1 - NEUTRAL));
    B.scroll -= Math.sign(u) * MAX_SPEED * t * t * dt;
  }
  B.scroll = Math.max(-maxR, Math.min(maxL, B.scroll));
  const sl = Math.max(0, B.scroll), sr = Math.max(0, -B.scroll);
  tracks.L.style.transform = `translateX(${sl}px)`; tracks.R.style.transform = `translateX(${-sr}px)`;
  fade(vL, maxL - sl > 1, sl > 1); fade(vR, sr > 1, maxR - sr > 1);
  if (B.fly) { startFly(B.fly, B.ent); B.fly = null; }
}

// ---------- one shared tooltip: one node, one owner, always on top ----------
const tipEl = document.createElement('div');
tipEl.id = 'tip'; tipEl.hidden = true;
document.body.appendChild(tipEl);
let tipOwner = null;
function setTip(el) {
  if (el && el.closest('.mk') && mode !== 'bar') el = null;
  if (el === tipOwner) return;
  tipOwner = el; tipEl.hidden = !el;
  if (el) { tipEl.innerHTML = el._tip || ''; placeTip(); }
}
// Under the bar if there is room, else above it, so it never covers the bar or the icon; markers get it above.
function placeTip() {
  const r = tipOwner.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  const inBar = barEl.contains(tipOwner);
  const ref = inBar ? barEl.getBoundingClientRect() : r;
  const y = inBar ? (ref.bottom + 8 + h < innerHeight ? ref.bottom + 8 : ref.top - h - 8) : (ref.top - h - 6 < 4 ? ref.bottom + 6 : ref.top - h - 6);
  tipEl.style.transform = `translate(${Math.max(6, Math.min(innerWidth - w - 6, r.left + r.width / 2 - w / 2))}px, ${Math.max(4, y)}px)`;
}
function tickTip() {
  if (!tipOwner) return;
  if (!tipOwner.isConnected || ((tipOwner.classList.contains('mk') || tipOwner.classList.contains('arr')) && +tipOwner.style.opacity < .3) || tipOwner.classList.contains('off')) setTip(null);
  else placeTip();
}
document.addEventListener('pointerover', (ev) => setTip(ev.target.closest?.('.tipped') || null));
document.documentElement.addEventListener('pointerleave', () => setTip(null));

// ---------- input ----------
// A click (not a drag) on the scene picks the body under the cursor, else the floor. While the pip wheel is open it
// takes clicks itself, so none reach here.
let down = null;
renderer.domElement.addEventListener('pointerdown', (ev) => { down = { x: ev.clientX, y: ev.clientY, b: ev.button }; });
renderer.domElement.addEventListener('pointerup', (ev) => {
  if (!down || ev.button !== 0 || Math.hypot(ev.clientX - down.x, ev.clientY - down.y) > 5) return;
  if (mode === 'bar') return barClick(ev.clientX, ev.clientY);
  const e = bodyAt(ev.clientX, ev.clientY, lastBody);
  if (e) return openWheelOn(e);
  const cell = cellAt(ev.clientX, ev.clientY);
  if (cell) openWheelOnSquare(cell.c, cell.r);
});
addEventListener('contextmenu', (ev) => {
  ev.preventDefault();
  const dragged = down && down.b === 2 && Math.hypot(ev.clientX - down.x, ev.clientY - down.y) > 5;
  if (!dragged) goBack();
});
addEventListener('keydown', (ev) => {
  if (ev.key === 'Escape' || ev.key === 'Backspace') { ev.preventDefault(); goBack(); }
});

// ---------- side panels ----------
function log(what, act) {
  const el = document.getElementById('log');
  el.insertAdjacentHTML('afterbegin', `<div>${what} → <code>${act}</code></div>`);
  while (el.children.length > 3) el.lastChild.remove();
}
function inspect(t) {
  const d = t.kind === 'object' ? '' : ` · ${dist(me(), t)} ft`;
  document.getElementById('card').innerHTML = `<b>${t.name}</b>${d}<br>${t.ac ? 'AC ' + t.ac : ''}${t.hp != null ? ` · ${t.hp === 0 ? 'down' : 'looks ' + (t.hp > 10 ? 'healthy' : 'fragile')}` : ''}${t.alt ? ` · flying ${t.alt} ft` : ''}${t.prone ? ' · prone' : ''}`;
}
function inspectSquare(n) {
  document.getElementById('card').innerHTML = `<b>${n}</b><br>${chasm.has(n) ? 'A chasm. Jump or fall.' : 'Packed earth. Nothing lying here.'}`;
}

// ---------- loop ----------
renderer.setAnimationLoop((now) => {
  controls.update();
  updateHover();
  for (const e of ents) e.obj.position.lerp(e.target, .15);
  const bat = ents.find((e) => e.id === 'bat');
  bat.obj.position.y = bat.target.y + Math.sin(now / 400) * .08;
  renderer.render(scene, camera);
  updateMarkers();
  updateBar(now);
  tickTip();
});
document.querySelectorAll('#seg button').forEach((b) => { b.onclick = () => setMode(b.dataset.m); });
setMode(startMode);
</script>
