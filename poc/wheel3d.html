<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Action wheel 3D</title>
<!-- Feel test: the action wheel on a 3D map. Entities are picked by a stem and name pill above them, not by their body.
     No game wiring; everything is fake. Ref: docs/wheel-lexicon.md, poc/wheel.html (the 2D version). -->
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
<style>
  :root {
    --bg: #14130f; --panel: #1c1b16; --panel-2: #232118; --line: #34312a;
    --ink: #e9e3d3; --ink-dim: #9c9584; --ink-faint: #6b6557;
    --gold: #d8b45a; --party: #4fb3a4; --enemy: #cf6a4c; --neutral: #a59f8e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font: 13px/1.4 system-ui, sans-serif; }
  canvas { display: block; position: fixed; inset: 0; }
  #overlay { position: fixed; inset: 0; pointer-events: none; user-select: none; }
  #stems { position: absolute; inset: 0; width: 100%; height: 100%; }
  body.dragging .mk, body.dragging .lb, body.dragging #bar { pointer-events: none !important; filter: grayscale(.8) brightness(.7); }
  /* the icon is the marker: centred on the top of its stem and the click target. The label sits above it (tucked 4px behind it), never clickable. */
  .mk { opacity: 0; pointer-events: none; position: absolute; left: -11px; top: -11px; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; font-weight: 700; border: 2px solid; background: #14130f; cursor: pointer; will-change: transform, opacity; }
  .mk.party { border-color: var(--party); color: var(--party); }
  .mk.enemy { border-color: var(--enemy); color: var(--enemy); }
  .mk.object { border-color: var(--neutral); color: var(--neutral); border-radius: 5px; }
  .mk:hover, .mk.hot { border-color: var(--gold); background: #2e2a1e; }
  /* same look as the pip wheel's captions */
  .lb { opacity: 0; pointer-events: none; position: absolute; left: 0; top: 0; display: flex; align-items: center; height: 15px; padding: 0 5px; border-radius: 6px; background: #14130fd9; color: var(--ink); white-space: nowrap; font-size: 11px; font-weight: 600; will-change: transform, opacity, clip-path; }
  .lb small { color: var(--ink-faint); font-weight: 400; margin-left: 4px; }
  .lb.hot { color: var(--gold); }
  body.barmode .lb { display: none; }

  /* the wheel (same as poc/wheel.html) */


  .hud { position: fixed; background: #1c1b16e6; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-size: 12px; }
  #top { top: 6px; left: 6px; right: 6px; padding: 3px 8px; font-size: 11px; display: flex; gap: 14px; align-items: center; flex-wrap: wrap; color: var(--ink-faint); }
  #top b { color: var(--ink); font-weight: 600; }
  #top kbd { border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; color: var(--ink-dim); font: 10.5px ui-monospace, monospace; }
  #top label { display: flex; gap: 5px; align-items: center; color: var(--ink-dim); }
  #card { top: 36px; right: 8px; width: 210px; color: var(--ink-dim); }
  #card b { color: var(--ink); }
  /* the player's doc: full on #card, a strip under Rook's pill */
  .doc .dr { display: flex; gap: 6px; align-items: center; margin-top: 3px; }
  .doc .dr > span:first-child { width: 52px; flex: none; color: var(--ink-faint); font-size: 10.5px; }
  .doc .sub { color: var(--ink-faint); font-size: 10.5px; margin-left: 58px; line-height: 1.25; }
  .hpbar { display: inline-block; width: 44px; height: 5px; border-radius: 3px; background: #14130f; border: 1px solid var(--line); overflow: hidden; vertical-align: middle; }
  .hpbar i { display: block; height: 100%; background: var(--party); }
  .hpbar.low i { background: var(--enemy); }
  .pip3 { display: inline-block; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid var(--c); background: var(--c); }
  .pip3.used { background: transparent; opacity: .5; }
  .tick { display: inline-block; width: 5px; height: 8px; margin-right: 1px; border-radius: 1px; background: var(--gold); }
  .tick.gone { background: #14130f; border: 1px solid var(--line); }
  .chip3 { font-size: 9px; line-height: 12px; padding: 0 4px; border-radius: 6px; border: 1px solid var(--gold); color: var(--gold); }
  .chip3.bad { border-color: var(--enemy); color: var(--enemy); }
  .rk { opacity: 0; pointer-events: none; position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 5px; height: 17px; padding: 0 6px; border-radius: 9px; background: #1c1b16d8; border: 1px solid var(--line); white-space: nowrap; font-size: 10px; color: var(--ink-dim); cursor: pointer; will-change: transform, opacity; }
  .rk:hover { border-color: var(--gold); }
  #log { bottom: 8px; left: 8px; max-width: 420px; }
  #log div { color: var(--ink-dim); }
  #log div:first-child { color: var(--ink); }
  #log code { color: var(--gold); font: 11px ui-monospace, monospace; }
  #log:empty, #card:empty { display: none; }
  [hidden] { display: none !important; }
  #overlay { z-index: 5; } .hud { z-index: 2; }
  /* highlight settings: closed by default, tiny */
  #hl { right: 8px; bottom: 8px; width: 224px; padding: 3px 8px; font-size: 11px; color: var(--ink-dim); }
  #hl > summary { cursor: pointer; color: var(--ink-dim); user-select: none; }
  #hl[open] { max-height: calc(100vh - 60px); overflow-y: auto; }
  #hl h6 { margin: 6px 0 2px; font: 600 10px/1.2 system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--gold); }
  #hl label { display: flex; align-items: center; gap: 5px; min-height: 18px; }
  #hl label > span { flex: 1; }
  #hl input[type=range] { width: 74px; height: 12px; margin: 0; accent-color: var(--gold); }
  #hl input[type=color] { width: 26px; height: 16px; padding: 0; border: 1px solid var(--line); background: none; }
  #hl output { width: 30px; text-align: right; color: var(--ink-faint); font: 10px ui-monospace, monospace; }
  #hl button { all: unset; cursor: pointer; margin-top: 6px; padding: 1px 9px; border: 1px solid var(--line); border-radius: 6px; }
  #hl button:hover { border-color: var(--gold); color: var(--gold); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { all: unset; cursor: pointer; padding: 1px 9px; color: var(--ink-dim); font-size: 11px; }
  .seg button.on { background: var(--gold); color: #14130f; font-weight: 600; }

  /* Bar mode: icon-only markers, and the action bar under the selected square */
  #bar { position: absolute; left: 0; top: 0; z-index: 20; display: flex; align-items: center; gap: 7px; padding: 6px; height: 66px; background: #1c1b16f2; border: 1px solid var(--gold); border-radius: 12px; pointer-events: auto; box-shadow: 0 6px 18px #0009; will-change: transform; }
  .bside { overflow: hidden; display: flex; height: 100%; align-items: center; flex: none; }
  .bside.L { justify-content: flex-end; }
  .btrack { display: flex; gap: 4px; flex: none; will-change: transform; }
  .bside.L .btrack { flex-direction: row-reverse; }
  .tile { width: 80px; height: 52px; flex: none; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; cursor: pointer; padding: 0 3px; animation: tinR .24s both; animation-delay: calc(var(--i) * 30ms); }
  .bside.L .tile { animation-name: tinL; }
  .tile i { font-style: normal; color: var(--gold); font-size: 13px; line-height: 14px; }
  .tile b, .tile small { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile b { font-size: 10.5px; font-weight: 600; line-height: 1.15; }
  .tile small { font-size: 9.5px; color: var(--ink-dim); line-height: 1.1; min-height: 10px; }
  .tile:hover { border-color: var(--gold); background: #2e2a1ef0; }
  .tile.off { opacity: .4; cursor: not-allowed; }
  .tile.off:hover { border-color: var(--line); background: var(--panel); }
  .tile.back { border-color: var(--gold); background: #3a321c; }
  .tile.back i { font-size: 17px; }
  @keyframes tinL { from { opacity: 0; transform: translateX(40px); } }
  @keyframes tinR { from { opacity: 0; transform: translateX(-40px); } }
  .bic { width: 50px; height: 52px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 1px solid var(--gold); border-radius: 8px; background: #2a2518; cursor: pointer; }
  .bic:hover { background: #3a321c; }
  .bic small { font-size: 9px; color: var(--ink-dim); max-width: 46px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; line-height: 1.1; }
  .bic .ic, .fly .ic { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-weight: 700; font-size: 13px; border: 2px solid; background: #14130f; }
  .bic.sq .ic { border-radius: 4px; border-color: var(--gold); color: var(--gold); }
  .party .ic { border-color: var(--party); color: var(--party); }
  .enemy .ic { border-color: var(--enemy); color: var(--enemy); }
  .object .ic { border-color: var(--neutral); color: var(--neutral); border-radius: 4px; }
  .fly { position: fixed; left: 0; top: 0; z-index: 30; pointer-events: none; will-change: transform; }
  /* the one shared tooltip */
  #tip { position: fixed; left: 0; top: 0; z-index: 1000; pointer-events: none; max-width: 250px; padding: 5px 9px; background: #14130ff5; border: 1px solid var(--gold); border-radius: 6px; font-size: 11.5px; color: var(--ink-dim); line-height: 1.35; box-shadow: 0 4px 14px #000a; }
  #tip b { color: var(--ink); }
  #tip .g { color: var(--gold); }
  #tip .tag { color: var(--party); border: 1px solid var(--party); border-radius: 3px; padding: 0 3px; font-size: 9px; }
  #tip code { color: var(--gold); font: 11px ui-monospace, monospace; word-break: break-all; }
</style>
</head>
<body>
<div id="overlay"><svg id="stems"></svg></div>
<div class="hud" id="top">
  <b>Action wheel · 3D</b>
  <span class="seg" id="seg"><button data-m="wheel">Wheel</button><button data-m="bar">Bar</button></span>
  <span id="hint"></span>
  <label><input type="checkbox" id="slow"> slow-mo spin</label>
  <label><input type="checkbox" id="hits"> hit areas</label>
</div>
<div class="hud" id="card"></div>
<div class="hud" id="log"></div>
<details class="hud" id="hl"><summary>Highlight</summary></details>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Line2 } from 'three/addons/lines/Line2.js';
import { LineMaterial } from 'three/addons/lines/LineMaterial.js';
import { LineGeometry } from 'three/addons/lines/LineGeometry.js';
import { createPipWheel } from './pip-wheel.js';

const COLS = 12, ROWS = 9, FT = 1 / 5;
const SPIN = () => (document.getElementById('slow').checked ? 600 : 150);
const colName = (c) => String.fromCharCode(65 + c);
const cellName = (c, r) => colName(c) + (r + 1);

const walls = new Set(['A1','B1','C1','D1','E1','F1','G1','H1','I1','J1','K1','L1','A2','A3','A9','L9','L8','D4','D5','I3','L4','L6']);
const chasm = new Set(['G4','G5','G6','H5']);

// Same fake world as the 2D mockup. `alt` is height in feet; hp 0 means down.
const ents = [
  { id: 'rook', name: 'Rook', kind: 'party', me: true, c: 2, r: 6, ac: 18, hp: 22, maxHp: 28, speed: 30, move: 25, cond: [], used: { a: false, b: false, r: false }, swLeft: 1, surgeLeft: 1,
    buffs: [{ n: 'Bless', r: 2, d: '+1d4 to attacks and saves' }] },
  { id: 'gob1', name: 'Goblin', kind: 'enemy', c: 3, r: 7, ac: 15, hp: 7 },
  { id: 'gob2', name: 'Goblin archer', kind: 'enemy', c: 9, r: 3, ac: 13, hp: 7 },
  { id: 'gob3', name: 'Goblin (behind wall)', kind: 'enemy', c: 8, r: 1, ac: 15, hp: 7 },
  { id: 'door1', name: 'Oak door', kind: 'object', c: 11, r: 4, ac: 15 },
  { id: 'wren', name: 'Wren', kind: 'party', c: 4, r: 5, ac: 14, hp: 0, prone: true },
  { id: 'bat', name: 'Giant bat', kind: 'enemy', c: 4, r: 5, ac: 13, hp: 22, alt: 10 },
  { id: 'sword', name: 'Shortsword', kind: 'object', item: true, c: 4, r: 5 },
];
for (let i = 0; i < 9; i++) ents.push({ id: 'rat' + (i + 1), name: 'Rat ' + (i + 1), kind: 'enemy', rat: true, c: 9, r: 6, ac: 10, hp: 1 });
// the horrible square: a swarm packed shoulder to shoulder
for (let i = 0; i < 36; i++) ents.push({ id: 'swarm' + (i + 1), name: 'Swarm rat ' + (i + 1), kind: 'enemy', rat: true, c: 7, r: 7, ac: 10, hp: 1 });

const me = () => ents.find((e) => e.me);
const dist = (a, b) => 5 * Math.max(Math.abs(a.c - b.c), Math.abs(a.r - b.r), Math.round(((a.alt || 0) - (b.alt || 0)) / 5));
const odds = (bonus, ac, dis) => { const p = Math.min(.95, Math.max(.05, (21 - (ac - bonus)) / 20)); return Math.round(100 * (dis ? p * p : p)) + '%'; };

// ---------- scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#14130f');
const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 200);
camera.position.set(4.5, 9.5, 14);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(6, 0, 4.8);
controls.enableDamping = true;
controls.maxPolarAngle = 1.38;
controls.mouseButtons = { LEFT: null, MIDDLE: THREE.MOUSE.DOLLY, RIGHT: THREE.MOUSE.ROTATE };   // LMB is our ground drag (below)
controls.update();
addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

scene.add(new THREE.HemisphereLight('#d9d2bf', '#2a2620', 1.0));
const sun = new THREE.DirectionalLight('#ffe9c4', 1.7);
sun.position.set(9, 14, 3); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -10, right: 10, top: 10, bottom: -10 });
sun.target.position.set(6, 0, 4.5);
scene.add(sun, sun.target);

const occluders = [];   // what blocks the view of a marker (walls and floors)
const floorTop = (c, r) => (chasm.has(cellName(c, r)) ? -2.6 : 0);
const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: .85, ...o });
const floorMats = [M('#3d382e'), M('#37332a')];
for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
  const n = cellName(c, r);
  let mesh;
  if (walls.has(n)) {
    mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1.8, 1), M('#2a2620'));
    mesh.position.set(c + .5, .9, r + .5);
  } else if (chasm.has(n)) {
    mesh = new THREE.Mesh(new THREE.BoxGeometry(1, .4, 1), M('#16130f'));
    mesh.position.set(c + .5, -2.8, r + .5);
  } else {
    mesh = new THREE.Mesh(new THREE.BoxGeometry(1, 3, 1), floorMats[(c + r) % 2]);
    mesh.position.set(c + .5, -1.5, r + .5);
  }
  mesh.castShadow = mesh.receiveShadow = true;
  mesh.userData.cell = { c, r };
  occluders.push(mesh); scene.add(mesh);
}
{ // faint grid on the floor
  const pts = [];
  for (let c = 0; c <= COLS; c++) pts.push(c, .005, 0, c, .005, ROWS);
  for (let r = 0; r <= ROWS; r++) pts.push(0, .005, r, COLS, .005, r);
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
  scene.add(new THREE.LineSegments(geo, new THREE.LineBasicMaterial({ color: '#000000', transparent: true, opacity: .25 })));
}


// ---------- entity bodies ----------
const SIDE = { party: '#4fb3a4', enemy: '#cf6a4c', object: '#a59f8e' };
function body(e) {
  const g = new THREE.Group();
  const col = M(SIDE[e.kind], { roughness: .55 });
  const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); g.add(m); return m; };
  if (e.item) {
    add(new THREE.BoxGeometry(.07, .03, .55), M('#b9b4a8', { metalness: .7, roughness: .3 }), 0, .03, -.05);
    add(new THREE.BoxGeometry(.22, .04, .05), M('#6b4a2b'), 0, .03, .22);
    e.top = .12; e.half = .3;
  } else if (e.kind === 'object') {
    add(new THREE.BoxGeometry(.9, 1.5, .14), M('#6b4a2b'), 0, .75, 0).rotation.y = Math.PI / 2;
    e.top = 1.55; e.half = .45;
  } else if (e.rat) {
    add(new THREE.SphereGeometry(.11, 12, 8), col, 0, .1, 0).scale.set(1, .8, 1.5);
    add(new THREE.SphereGeometry(.06, 10, 8), col, 0, .14, .16);
    e.top = .22; e.half = .14;
  } else if (e.id === 'bat') {
    add(new THREE.SphereGeometry(.16, 14, 10), col, 0, 0, 0);
    for (const s of [-1, 1]) add(new THREE.BoxGeometry(.5, .02, .28), col, s * .32, .04, 0).rotation.z = s * .35;
    e.top = .2; e.half = .55;
  } else {
    const torso = add(new THREE.CapsuleGeometry(.2, .5, 6, 14), col, 0, .5, 0);
    const head = add(new THREE.SphereGeometry(.15, 16, 12), M('#d8c7a8'), 0, 1.05, 0);
    add(new THREE.CylinderGeometry(.34, .36, .06, 24), M('#1f1d18'), 0, .03, 0);
    if (e.prone) { torso.rotation.z = Math.PI / 2; torso.position.set(0, .22, 0); head.position.set(.5, .2, 0); }
    e.top = e.prone ? .45 : 1.25; e.half = e.prone ? .45 : .26;
  }
  g.traverse((o) => { if (o.isMesh) { o.castShadow = true; o.material = o.material.clone(); } });
  scene.add(g);
  return g;
}
// ---------- highlight: a faint, growing approach that snaps to "picked" ----------
// Four layers, switchable: fresnel rim (shader), floor halo, floor graphic (picked only), and the old flat emissive.
const HL0 = { fre: true, halo: true, gfx: true, old: false,
  apC: '#d8b45a', apInt: .35, gamma: 2.2, range: 3, full: 1,
  pkC: '#ffe08a', pkInt: 1.3, snap: 100, over: true,
  frePow: 2.5, freBias: 0, grow: true, growCurve: 1.3 };
const HL_KEY = 'wheel3d.hl';
const S = { ...HL0 };
try { const o = JSON.parse(localStorage.getItem(HL_KEY) || '{}'); for (const k in HL0) if (typeof o[k] === typeof HL0[k]) S[k] = o[k]; } catch {}
const hlSave = () => { try { localStorage.setItem(HL_KEY, JSON.stringify(S)); } catch {} };
function hlTex(n, draw) {
  const c = document.createElement('canvas'); c.width = c.height = n;
  draw(c.getContext('2d'), n);
  return new THREE.CanvasTexture(c);
}
const haloTex = hlTex(128, (g, n) => {
  const r = g.createRadialGradient(n / 2, n / 2, 0, n / 2, n / 2, n / 2);
  r.addColorStop(0, 'rgba(255,255,255,.3)'); r.addColorStop(.55, 'rgba(255,255,255,.85)'); r.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = r; g.fillRect(0, 0, n, n);
});
const gfxTex = hlTex(256, (g, n) => {   // a thin ring with four bold brackets on the diagonals
  g.strokeStyle = '#fff'; g.lineCap = 'round';
  g.globalAlpha = .45; g.lineWidth = 2; g.beginPath(); g.arc(n / 2, n / 2, n * .4, 0, 7); g.stroke();
  g.globalAlpha = 1; g.lineWidth = 9;
  for (let i = 0; i < 4; i++) { g.beginPath(); g.arc(n / 2, n / 2, n * .4, Math.PI * (.25 + i / 2) - .42, Math.PI * (.25 + i / 2) + .42); g.stroke(); }
});
const flat = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);
const flatMat = (map) => new THREE.MeshBasicMaterial({ map, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: false });
function hlAttach(e) {
  const fu = e.fu = { uRimC: { value: new THREE.Color() }, uRimK: { value: 0 }, uRimP: { value: 2.5 }, uRimB: { value: 0 } };
  e.obj.traverse((o) => {
    if (!o.isMesh) return;
    o.material.onBeforeCompile = (sh) => {   // facing-ratio rim added to the emissive term
      Object.assign(sh.uniforms, fu);
      sh.fragmentShader = 'uniform vec3 uRimC; uniform float uRimK, uRimP, uRimB;\n' + sh.fragmentShader.replace('#include <emissivemap_fragment>',
        `#include <emissivemap_fragment>
         totalEmissiveRadiance += uRimC * uRimK * mix(uRimB, 1., pow(1. - abs(dot(normalize(vNormal), normalize(vViewPosition))), uRimP));`);
    };
  });
  e.halo = new THREE.Mesh(flat, flatMat(haloTex)); e.gfx = new THREE.Mesh(flat, flatMat(gfxTex));
  for (const m of [e.halo, e.gfx]) { m.visible = false; m.renderOrder = 1; m.frustumCulled = false; scene.add(m); }
  Object.assign(e, { apL: 0, pr: 0, lvl: 0, pk: 0 });
}
const easeBack = (t) => 1 + 2.70158 * (t - 1) ** 3 + 1.70158 * (t - 1) ** 2;
const easeOut = (t) => 1 - (1 - t) ** 3;
const cA = new THREE.Color(), cB = new THREE.Color();
// tg: 0 / .55 (square-mate) / 1 (hovered or selected); p: approach 0..1 (already smoothed in e.apL)
function hlStep(e, tg, dt) {
  e.lvl += (tg - e.lvl) * .4;

  if (!sameSq) B = { square: { c: e.c, r: e.r }, L: [squareRoot({ c: e.c, r: e.r })], scroll: 0, nL: 0, nR: 0 };

function barPick(s, side) {

// The entity's icon leaves its marker and slides into the bar.
function startFly(from, e) {

const fade = (el, l, r) => {

// The bar hangs below the selected square and follows it; it is clamped into the window.
function updateBar(now) {
  if (!B) return;
  const { c, r } = B.square, y0 = floorTop(c, r);
  selSq.visible = true; selSq.position.set(c + .5, y0 + .012, r + .5);
  const cs = [[c, r], [c + 1, r], [c, r + 1], [c + 1, r + 1]].map(([x, z]) => toScreen(new THREE.Vector3(x, y0, z)));
  const sx = cs.reduce((a, p) => a + p.x, 0) / 4, bottom = Math.max(...cs.map((p) => p.y));
  const hasR = !!B.ent;
  const Lt = B.nL ? B.nL * (TW + TG) - TG : 0, Rt = hasR && B.nR ? B.nR * (TW + TG) - TG : 0;
  const fixed = 2 * (PAD + 1) + IC * (hasR ? 2 : 1) + SEP * (hasR ? 3 : 1);
  const full = Math.max(0, innerWidth - 16 - fixed);
  const Lw = Math.min(Lt, hasR ? full - Math.min(Rt, full / 2) : full), Rw = hasR ? Math.min(Rt, full - Lw) : 0;
  const barW = fixed + Lw + Rw;
  const left = Math.max(8, Math.min(innerWidth - 8 - barW, sx - (PAD + 1) - Lw - SEP - IC / 2));
  const top = Math.max(4, Math.min(innerHeight - BAR_H - 6, bottom + 10));
  barEl.style.transform = `translate(${left}px, ${top}px)`;
  vL.style.width = Lw + 'px'; vR.style.width = Rw + 'px';
  // edge scrolling: nothing in the middle half, then quadratically faster toward either end
  const maxL = Math.max(0, Lt - Lw), maxR = Math.max(0, Rt - Rw);
  const dt = Math.min(.05, (now - (B.t || now)) / 1000); B.t = now;
  if ((maxL || maxR) && Math.abs(mouse.y - (top + BAR_H / 2)) < BAR_H / 2 + 30 && mouse.x > left - 60 && mouse.x < left + barW + 60) {
    const u = Math.max(-1, Math.min(1, (mouse.x - (left + barW / 2)) / (barW / 2)));
    const t = Math.max(0, (Math.abs(u) - NEUTRAL) / (1 - NEUTRAL));

  fade(vL, maxL - sl > 1, sl > 1); fade(vR, sr > 1, maxR - sr > 1);
  if (B.fly) { startFly(B.fly, B.ent); B.fly = null; }
}

// ---------- one shared tooltip: one node, one owner, always on top ----------
const tipEl = document.createElement('div');

// ---------- input ----------
// A click (not a drag) on the scene picks the body under the cursor, else the floor. While the pip wheel is open it
// takes clicks itself, so none reach here.
let down = null;

const ground = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
let grab = null;
function groundAt(x, y) {
  ray.setFromCamera(new THREE.Vector2(x / innerWidth * 2 - 1, -(y / innerHeight) * 2 + 1), camera);
  return ray.ray.intersectPlane(ground, new THREE.Vector3());
}
renderer.domElement.addEventListener('pointerdown', (ev) => {
  down = { x: ev.clientX, y: ev.clientY, b: ev.button };

addEventListener('pointermove', (ev) => {

  if (!grab || !(ev.buttons & 1)) return;
  const p = groundAt(ev.clientX, ev.clientY);
  if (!p || p.distanceTo(grab) > 30) return;   // near the horizon the plane runs away; skip those moves
  const d = grab.clone().sub(p);

});
addEventListener('pointerup', () => { grab = null; document.body.classList.remove('dragging'); }, true);
renderer.domElement.addEventListener('pointerup', (ev) => {

    if (mkHover && inSpread(mkHover)) return pickEntity(mkHover);

  if (mode === 'bar') return barClick(ev.clientX, ev.clientY);
  const e = pickAt(ev.clientX, ev.clientY);

let cardBase = '', cardDoc = false, cardShown = null;   // what a click put on the card, and whether that is the player doc

// ---------- the player's doc: state kept on Rook, a strip under his pill, the full card, and the reach tint ----------
const mvNeed = (d) => d * (me().prone ? 2 : 1);   // crawling costs double
function setProne(on) {
  const P = me();
  if (!!P.prone === on) return;
  P.prone = on;
  P.cond = on ? [...P.cond, 'prone'] : P.cond.filter((c) => c !== 'prone');
  const [torso, head] = P.obj.children;
  torso.rotation.z = on ? Math.PI / 2 : 0; torso.position.set(0, on ? .22 : .5, 0); head.position.set(on ? .5 : 0, on ? .2 : 1.05, 0);
  P.top = on ? .45 : 1.25; P.half = on ? .45 : .26;
}
function secondWind() {
  const P = me();
  if (P.swLeft < 1 || P.used.b) return;
  P.swLeft--; P.used.b = true; P.hp = Math.min(P.maxHp, P.hp + Math.ceil(Math.random() * 10) + 3);
}
function endTurn() {
  const P = me();
  P.used = { a: false, b: false, r: false }; P.move = P.speed;
  P.buffs = P.buffs.map((b) => ({ ...b, r: b.r - 1 })).filter((b) => b.r > 0);
}
function selfRoot(t) {
  const U = t.used, foes = ents.filter((e) => e.kind === 'enemy' && e.hp > 0).sort((a, b) => dist(t, a) - dist(t, b)), near = foes[0];
  const swOk = t.swLeft > 0 && !U.b, tac = (what, odds, act, fx) => ({ what, odds: U.a ? 'action used' : odds, off: U.a, act, fx: () => { U.a = true; fx?.(); } });
  const dodge = () => { t.buffs = [...t.buffs.filter((b) => b.n !== 'Dodging'), { n: 'Dodging', r: 1, d: 'attacks against you have disadvantage' }]; };

  const wind = { what: 'Second Wind', odds: t.swLeft ? (U.b ? 'bonus used' : '1d10+3 · bonus') : 'spent', off: !swOk, act: 'heal rook 1d10+3', fx: secondWind };
  return {
    title: t.name + ' (you)',
    slots: {
      1: t.hp < t.maxHp && swOk ? { role: 'Self', ...wind } : { role: 'Self', ...tac('Dodge', 'until your next turn', 'dodge rook', dodge) },
      2: near ? { role: 'Signature', what: 'Strike nearest', odds: `${near.name} · ${dist(t, near)} ft`, off: U.a || dist(t, near) > 30, act: `attack rook ${near.id} ${dist(t, near) <= 5 ? 'longsword' : 'javelin'}` }
              : { role: 'Signature', what: 'Strike nearest', odds: 'no enemies', off: true },
      3: { role: 'Kit', what: 'Fighter', sub: () => ({ title: 'Fighter', slots: { 1: wind, 2: surge } }) },
      4: { role: 'Tactics', what: 'Tactics', sub: () => ({ title: 'Tactics', slots: {
        1: tac('Dash', '+' + t.speed + ' ft', 'dash rook', () => { t.move += t.speed; }),
        2: tac('Disengage', 'no opportunity attacks', 'disengage rook'),
        3: tac('Dodge', 'until your next turn', 'dodge rook', dodge),
        5: tac('Hide', 'Stealth', 'check rook stealth 12; hide rook'),
        6: tac('Ready', 'on trigger', 'ready rook attack') } }) },
      5: { role: 'Inspect', what: 'Inspect self', inspect: t },
      6: { role: 'Other', what: 'Other', sub: () => ({ title: 'Other', slots: {
        1: t.prone ? { what: 'Stand up', odds: t.move < t.speed / 2 ? 'not enough movement' : 'costs ' + t.speed / 2 + ' ft', off: t.move < t.speed / 2, act: 'condition rook remove prone', fx: () => { t.move -= t.speed / 2; setProne(false); } }
                   : { what: 'Drop prone', odds: 'free', act: 'condition rook add prone', fx: () => setProne(true) },
        2: { what: 'Swap weapon', odds: 'free interaction', act: 'equip rook javelin' },
        3: { what: 'Drop weapon', odds: 'free', act: 'drop rook longsword' },

const docRows = (P) => ({

});
function docHtml() {
  const P = me(), { hp, pip, ticks } = docRows(P);
  const row = (k, v, sub) => `<div class="dr"><span>${k}</span><span>${v}</span></div>${sub ? `<div class="sub">${sub}</div>` : ''}`;
  return `<div class="doc"><b>${P.name}</b> · you · Fighter 3 · AC ${P.ac}
    ${row('HP', `<span class="hpbar${hp < .4 ? ' low' : ''}"><i style="width:${hp * 100}%"></i></span> <b>${P.hp}</b>/${P.maxHp}`)}
    ${row('Conditions', P.cond.length ? P.cond.map((c) => `<b>${c}</b>`).join(', ') : 'none', P.prone ? 'attacks within 5 ft have advantage; moving costs double' : '')}
    ${row('Buffs', P.buffs.length ? P.buffs.map((b) => `<b>${b.n}</b> · ${b.r} rd${b.r > 1 ? 's' : ''}`).join(', ') : 'none', P.buffs.map((b) => b.d).join('; '))}
    ${row('This turn', `${pip('a', 'var(--party)', 'Act')} ${pip('b', 'var(--gold)', 'Bonus')} ${pip('r', '#8aa4d8', 'React')}`)}
    ${row('Movement', `<b>${P.move}</b> / ${P.speed} ft`, ticks)}
    ${row('Resources', `Second Wind ${P.swLeft}/1 · Surge ${P.surgeLeft}/1`)}</div>`;
}
// the strip: its own element, parked under Rook's pill and fading with it
const rk = document.createElement('div');
rk.className = 'rk tipped'; overlay.appendChild(rk);
rk.onclick = () => pickEntity(me());
rk.onpointerenter = () => { mkHover = me(); };
rk.onpointerleave = () => { if (mkHover === me()) mkHover = null; };
function updateDoc() {
  const P = me(), m = P.mk, { hp, pip } = docRows(P);
  const chips = [...P.cond.map((c) => [c, 1]), ...P.buffs.map((b) => [b.n + ' ' + b.r, 0])];
  const h = `<span class="hpbar${hp < .4 ? ' low' : ''}"><i style="width:${hp * 100}%"></i></span><b style="color:var(--ink)">${P.hp}</b>${pip('a', 'var(--party)')}${pip('b', 'var(--gold)')}${pip('r', '#8aa4d8')}<span style="color:var(--ink)">${P.move} ft</span>`
    + chips.slice(0, 3).map(([n, bad]) => `<span class="chip3${bad ? ' bad' : ''}">${n}</span>`).join('');
  if (rk._h !== h) { rk._h = h; rk.innerHTML = h; rk._w = 0; }
  rk._tip = `<b>${P.name}</b> · HP ${P.hp}/${P.maxHp} · ${P.move} ft left<br>${P.cond.concat(P.buffs.map((b) => b.n + ' ' + b.r)).join(', ') || 'no conditions or buffs'}<br>Dots: action, bonus, reaction (hollow = used)`;
  m.el._tip = `<b>${P.name}</b> · you<br>Click to select`;
  if (!rk._w) rk._w = rk.offsetWidth || 120;

// floor cells Rook can still reach (straight-line, walls and chasm excluded) while his or the square wheel is open
const tint = new THREE.Group(); tint.visible = false; scene.add(tint);
{
  const geo = new THREE.PlaneGeometry(.92, .92).rotateX(-Math.PI / 2), mat = new THREE.MeshBasicMaterial({ color: '#4fb3a4', transparent: true, opacity: .17, depthWrite: false });
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const n = cellName(c, r);
    if (walls.has(n) || chasm.has(n)) continue;
    const m = new THREE.Mesh(geo, mat); m.position.set(c + .5, .008, r + .5); m.userData = { c, r }; tint.add(m);
  }
}
function updateTint() {

  tint.visible = !!on;
  const k = [P.c, P.r, P.move, P.prone].join();
  if (!on || tint._k === k) return;
  tint._k = k;
  for (const m of tint.children) m.visible = mvNeed(5 * Math.max(Math.abs(m.userData.c - P.c), Math.abs(m.userData.r - P.r))) <= P.move;

// ---------- highlight settings panel ----------
{
  const spec = [['Composition'], ['fre', 'Fresnel rim'], ['halo', 'Floor halo'], ['gfx', 'Picked ring'], ['old', 'Old flat glow'],
    ['Approach'], ['apC', 'Colour'], ['apInt', 'Max intensity', 0, 1, .01], ['gamma', 'Curve (γ)', .5, 5, .1], ['range', 'Starts at', 1.5, 6, .1], ['full', 'Full at', .6, 1.2, .05],
    ['Picked'], ['pkC', 'Colour'], ['pkInt', 'Intensity', .2, 3, .05], ['snap', 'Snap (ms)', 30, 400, 5], ['over', 'Overshoot'],
    ['Fresnel'], ['frePow', 'Power (theta)', .5, 6, .1], ['freBias', 'Bias', 0, .8, .02],
    ['Stem, icon, label'], ['grow', 'Stem grows with approach'], ['growCurve', 'Growth curve', .5, 3, .1]];
  const el = document.getElementById('hl'), ins = [];
  const put = (v, k) => { for (const [i, o] of ins) if (k === undefined || i.dataset.k === k) { if (i.type === 'checkbox') i.checked = S[i.dataset.k]; else i.value = S[i.dataset.k]; if (o) o.value = (+S[i.dataset.k]).toFixed(2).replace(/\.?0+$/, ''); } };
  for (const [k, label, min, max, step] of spec) {

    const type = typeof HL0[k] === 'boolean' ? 'checkbox' : k.endsWith('C') ? 'color' : 'range';
    const lb = document.createElement('label'), i = document.createElement('input'), o = type === 'range' ? document.createElement('output') : null;
    lb.innerHTML = `<span>${label}</span>`; i.type = type; i.dataset.k = k;
    if (type === 'range') Object.assign(i, { min, max, step });
    i.oninput = () => { S[k] = type === 'checkbox' ? i.checked : type === 'range' ? +i.value : i.value; put(0, k); hlSave(); };
    lb.append(...(o ? [i, o] : [i])); el.append(lb); ins.push([i, o]);
  }
  const rb = document.createElement('button'); rb.textContent = 'Reset';
  rb.onclick = () => { Object.assign(S, HL0); put(); hlSave(); };
  el.append(rb); put();
}

// ---------- loop ----------
renderer.setAnimationLoop((now) => {
  controls.update();
  updateHover();
  for (const e of ents) e.obj.position.lerp(e.target, .15);
  const bat = ents.find((e) => e.id === 'bat');
  bat.obj.position.y = bat.target.y + Math.sin(now / 400) * .08;
  renderer.render(scene, camera);
