<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+SC:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #14130f; --panel: #1c1b16; --panel-2: #232118; --panel-3: #2a2820; --line: #34312a;
    --ink: #e9e3d3; --ink-dim: #9c9584; --ink-faint: #6b6557;
    --gold: #d8b45a; --gold-soft: rgba(216,180,90,.12); --gold-line: rgba(216,180,90,.45);
    --party: #4fb3a4; --enemy: #cf6a4c; --secret: #a98bd6;
    --display: 'Cormorant SC', Georgia, serif; --sans: 'Inter', system-ui, sans-serif; --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans); }
  button { font: inherit; color: inherit; }
  .app { display: grid; grid-template-columns: 190px minmax(0, 1fr) 340px; grid-template-rows: auto 1fr; height: 100vh; }
  .top { grid-column: 1 / -1; display: flex; align-items: center; gap: 14px; padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--panel); min-width: 0; }
  .top .back { color: var(--ink-faint); text-decoration: none; font-size: 18px; }
  .top .back:hover { color: var(--gold); }
  .top h1 { font: 700 26px/1 var(--display); color: var(--gold); margin: 0; letter-spacing: .03em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .line { color: var(--ink-dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .top .spacer { flex: 1; }
  .saved { font: 11px var(--mono); color: var(--ink-faint); white-space: nowrap; }
  .pill { display: inline-block; font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-dim); white-space: nowrap; }
  .pill.ready { color: var(--party); border-color: rgba(79,179,164,.4); }
  .pill.needs-dm { color: var(--secret); border-color: rgba(169,139,214,.45); }
  .pill.gold { color: var(--gold); border-color: var(--gold-line); }

  nav { border-right: 1px solid var(--line); padding: 14px 10px; overflow-y: auto; }
  nav button { display: flex; align-items: center; gap: 10px; width: 100%; background: none; border: 0; padding: 8px 10px; border-radius: 6px; cursor: pointer; text-align: left; color: var(--ink-dim); }
  nav button:hover { background: var(--panel-2); color: var(--ink); }
  nav button.on { background: var(--panel-2); color: var(--ink); box-shadow: inset 2px 0 0 var(--gold); }
  nav .st { width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; font-size: 11px; border: 1px solid var(--line); color: var(--ink-faint); flex: none; }
  nav .st.ok { color: var(--party); border-color: rgba(79,179,164,.5); }
  nav .st.todo { color: var(--ink-dim); }
  nav .st.error { color: var(--enemy); border-color: var(--enemy); }
  nav .st.dm { color: var(--secret); border-color: var(--secret); }
  nav .star { margin-left: auto; color: var(--gold); font-size: 12px; }
  nav .optional { margin-left: auto; font-size: 10px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: .08em; }

  main { overflow-y: auto; padding: 22px 28px 60px; min-width: 0; }
  .side { border-left: 1px solid var(--line); background: var(--panel); overflow-y: auto; padding: 18px; min-width: 0; }
  @media (max-width: 1100px) { .app { grid-template-columns: 170px minmax(0, 1fr); } .side { grid-column: 1 / -1; border-left: 0; border-top: 1px solid var(--line); } .app { height: auto; } main, nav { overflow: visible; } }
  @media (max-width: 720px) {
    .app { grid-template-columns: 1fr; }
    nav { display: flex; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--line); padding: 8px; gap: 4px; }
    nav button { width: auto; white-space: nowrap; }
    nav .star, nav .optional { margin-left: 4px; }
    main { padding: 18px 16px 40px; }
    .top { padding: 10px 16px; flex-wrap: wrap; }
    .top .line { width: 100%; order: 5; }
  }
  h2 { font: 500 28px/1.15 var(--display); letter-spacing: .03em; margin: 0 0 4px; }
  .lede { color: var(--ink-dim); margin: 0 0 20px; max-width: 640px; }
  h3 { font: 600 12px var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); margin: 26px 0 10px; display: flex; align-items: center; gap: 10px; }
  h3 .count { font: 500 11px var(--mono); color: var(--ink-dim); letter-spacing: 0; text-transform: none; }
  h3 .count.done { color: var(--party); }
  label.f { display: block; font-size: 12px; color: var(--ink-dim); margin: 14px 0 6px; }
  input[type=text], input[type=number], textarea, select { background: var(--bg); color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; font: 14px var(--sans); }
  input[type=text], textarea { width: 100%; }
  textarea { min-height: 70px; resize: vertical; line-height: 1.45; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: var(--gold); }
  .btn { background: var(--gold); color: #1b1a15; border: 0; border-radius: 6px; padding: 8px 16px; font-weight: 600; cursor: pointer; white-space: nowrap; }
  .btn:disabled { opacity: .45; cursor: default; }
  .ghost { background: none; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; color: var(--ink); white-space: nowrap; text-decoration: none; display: inline-block; font-size: 13px; }
  .ghost:hover { background: var(--panel-2); }
  .ghost.small { padding: 2px 9px; font-size: 12px; }
  .ghost.on { border-color: var(--gold); color: var(--gold); }
  .link { background: none; border: 0; color: var(--gold); cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .muted { color: var(--ink-faint); }
  .dim { color: var(--ink-dim); }
  .mono { font-family: var(--mono); }
  .err { color: var(--enemy); }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; }
  .opt { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; cursor: pointer; text-align: left; transition: border-color .12s, background .12s; position: relative; }
  .opt:hover { border-color: #4a463b; background: var(--panel-2); }
  .opt.sel { border-color: var(--party); background: rgba(79,179,164,.08); }
  .opt .t { font-weight: 600; display: flex; gap: 8px; align-items: baseline; }
  .opt .t .x { margin-left: auto; font: 11px var(--mono); color: var(--ink-faint); font-weight: 400; }
  .opt .d { color: var(--ink-dim); font-size: 13px; margin-top: 3px; }
  .opt .d b { color: var(--ink); font-weight: 500; }
  .opt.big .t { font: 500 21px/1.15 var(--display); letter-spacing: .02em; }
  .opt .hb { color: var(--secret); font-size: 11px; }
  .list { display: flex; flex-direction: column; gap: 6px; }
  .list.scroll { max-height: 420px; overflow-y: auto; padding-right: 4px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; font-size: 13px; }
  .chip:hover { background: var(--panel-2); }
  .chip.sel { border-color: var(--party); color: var(--party); background: rgba(79,179,164,.08); }
  .chip .n { font: 11px var(--mono); margin-left: 4px; }
  .filter { margin-bottom: 8px; max-width: 320px; }

  /* DM suggestions: the gold highlight. */
  .suggested { box-shadow: 0 0 0 2px var(--gold-line), 0 0 18px rgba(216,180,90,.18); border-radius: 8px; }
  .opt.would { border-color: var(--gold); border-style: dashed; }
  .opt.would::after { content: 'DM suggests'; position: absolute; top: -9px; right: 10px; background: var(--gold); color: #1b1a15; font: 600 10px var(--sans); letter-spacing: .06em; text-transform: uppercase; padding: 1px 7px; border-radius: 999px; }
  .chip.would { border-color: var(--gold); border-style: dashed; color: var(--gold); }
  .tray { display: flex; flex-direction: column; gap: 10px; margin-bottom: 22px; }
  .sug { background: var(--gold-soft); border: 1px solid var(--gold-line); border-radius: 10px; padding: 12px 14px; }
  .sug .h { display: flex; align-items: center; gap: 10px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--gold); }
  .sug .h .spacer { flex: 1; }
  .sug .txt { margin: 6px 0 8px; white-space: pre-wrap; }
  .sug .chg { font-size: 13px; color: var(--ink-dim); display: flex; flex-direction: column; gap: 2px; margin-bottom: 8px; }
  .sug .chg b { color: var(--ink); font-weight: 500; }
  .sug .delta { font: 12px var(--mono); color: var(--gold); }
  .sug .thread { border-left: 2px solid var(--gold-line); padding-left: 10px; margin: 8px 0; display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
  .sug .thread .dm { color: var(--gold); }
  .sug .acts { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .sug .acts .accept { background: var(--gold); color: #1b1a15; border: 0; }
  .sug .talk { display: flex; gap: 8px; margin-top: 8px; }
  .sug .talk input { flex: 1; }
  .inline-sug { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; font-size: 12px; color: var(--gold); margin: 6px 0 2px; }

  .notice { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; color: var(--ink-dim); margin: 8px 0; font-size: 13px; }
  .notice.warn { border-color: rgba(207,106,76,.4); color: #e3a28d; }
  .notice.dm { border-color: rgba(169,139,214,.45); color: #c6b2e6; }
  .notice.good { border-color: rgba(79,179,164,.45); color: #8fd3c8; }
  .todo { display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; list-style: none; }
  .todo li { font-size: 13px; color: var(--ink-dim); }
  .todo li::before { content: '•'; color: var(--ink-faint); margin-right: 8px; }
  .todo li.e::before { color: var(--enemy); }
  .todo li.m::before { color: var(--secret); }
  .footer-nav { display: flex; justify-content: space-between; margin-top: 34px; padding-top: 16px; border-top: 1px solid var(--line); }

  /* abilities */
  table.ab { border-collapse: collapse; width: 100%; max-width: 640px; }
  table.ab th { font: 600 11px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); text-align: left; padding: 6px 8px; }
  table.ab td { padding: 7px 8px; border-top: 1px solid var(--line); }
  table.ab td.n { font-weight: 600; }
  table.ab td.tot { font: 500 20px var(--display); }
  table.ab td.mod { font: 13px var(--mono); color: var(--ink-dim); }
  table.ab td.plus { font: 12px var(--mono); color: var(--ink-faint); }
  .stepper { display: inline-flex; align-items: center; gap: 6px; }
  .stepper button { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
  .stepper button:disabled { opacity: .3; cursor: default; }
  .stepper span { font: 500 15px var(--mono); min-width: 24px; text-align: center; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; overflow: hidden; flex-wrap: wrap; }
  .seg button { background: none; border: 0; padding: 6px 14px; cursor: pointer; color: var(--ink-dim); font-size: 13px; }
  .seg button.on { background: var(--panel-3); color: var(--ink); }
  .rolls { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
  .roll { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; text-align: center; min-width: 64px; }
  .roll b { font: 500 22px var(--display); display: block; }
  .roll span { font: 11px var(--mono); color: var(--ink-faint); }
  .roll s { color: var(--ink-faint); }

  /* homebrew */
  .hbcard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
  .hbcard .hh { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .hbcard .hh b { font: 500 20px var(--display); }
  .eff { display: grid; grid-template-columns: minmax(180px, 1.3fr) 2fr auto; gap: 8px; align-items: start; padding: 8px 0; border-top: 1px dashed var(--line); }
  .eff .ps { display: flex; gap: 6px; flex-wrap: wrap; }
  .eff .ps > * { min-width: 0; }
  .eff select, .eff input { font-size: 13px; padding: 6px 8px; }
  .eff input[type=number] { width: 72px; }
  @media (max-width: 720px) { .eff { grid-template-columns: 1fr; } }
  .meter { margin: 14px 0 6px; }
  .meter .bar { position: relative; height: 12px; border-radius: 6px; background: var(--panel-3); overflow: hidden; }
  .meter .z { position: absolute; top: 0; bottom: 0; }
  .meter .mk { position: absolute; top: -4px; width: 3px; height: 20px; background: var(--ink); border-radius: 2px; box-shadow: 0 0 6px rgba(0,0,0,.6); }
  .meter .marks { position: relative; height: 18px; font: 10px var(--mono); color: var(--ink-faint); }
  .meter .marks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
  .verdict { font-size: 13px; }
  .verdict.under { color: var(--ink-dim); } .verdict.fair { color: var(--party); } .verdict.creep { color: var(--gold); } .verdict.over, .verdict.dm { color: var(--secret); }
  .parts { font: 12px var(--mono); color: var(--ink-dim); margin: 6px 0; }
  .parts div { display: flex; gap: 10px; } .parts .c { width: 42px; text-align: right; color: var(--ink); }

  /* sheet */
  .sheet h4 { font: 600 11px var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-faint); margin: 18px 0 8px; }
  .sheet .nm { font: 500 26px/1.1 var(--display); letter-spacing: .02em; }
  .sheet .ln { color: var(--ink-dim); margin-bottom: 12px; }
  .big3 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .big3 div { background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px; padding: 6px; text-align: center; }
  .big3 b { display: block; font: 500 22px var(--display); }
  .big3 span { font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); }
  .abil { display: grid; grid-template-columns: repeat(6, 1fr); gap: 4px; margin-top: 8px; }
  .abil div { text-align: center; background: var(--panel-2); border-radius: 6px; padding: 5px 2px; }
  .abil span { display: block; font-size: 10px; color: var(--ink-faint); letter-spacing: .08em; }
  .abil b { font: 500 18px var(--display); display: block; }
  .abil i { font: normal 11px var(--mono); color: var(--ink-dim); }
  .sk { display: grid; grid-template-columns: 1fr auto; gap: 1px 10px; font-size: 13px; }
  .sk .p { color: var(--ink); } .sk span { color: var(--ink-faint); } .sk .p + span, .sk span.v { font-family: var(--mono); font-size: 12px; text-align: right; }
  .sk .x { color: var(--gold); }
  .atk { font: 12px var(--mono); padding: 3px 0; border-bottom: 1px dashed #2c2a23; display: flex; gap: 8px; }
  .atk span:first-child { flex: 1; font-family: var(--sans); font-size: 13px; }
  .feat { font-size: 13px; padding: 5px 0; border-bottom: 1px dashed #2c2a23; }
  .feat b { font-weight: 600; } .feat .s { font-size: 11px; color: var(--ink-faint); margin-left: 6px; }
  .feat .dd { color: var(--ink-dim); display: none; margin-top: 2px; }
  .feat.open .dd { display: block; }
  .feat b { cursor: pointer; }
  .res { display: flex; flex-wrap: wrap; gap: 4px; }
  .res span { font: 11px var(--mono); background: var(--panel-2); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; color: var(--ink-dim); }
  details.raw summary { cursor: pointer; color: var(--ink-faint); font-size: 12px; margin-top: 14px; }
  details.raw pre { font: 11px/1.4 var(--mono); color: var(--ink-dim); white-space: pre-wrap; word-break: break-word; background: var(--bg); padding: 10px; border-radius: 6px; }

  .ask { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin-top: 22px; }
  .ask .req { font-size: 13px; padding: 6px 0; border-top: 1px dashed var(--line); color: var(--ink-dim); }
  .ask .req .r { color: var(--gold); margin-top: 2px; }
  .toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--panel-3); border: 1px solid var(--line); border-radius: 8px; padding: 10px 16px; box-shadow: 0 6px 24px rgba(0,0,0,.5); z-index: 10; max-width: 90vw; }
  .toast.err { border-color: var(--enemy); }
  .colors { display: flex; gap: 6px; flex-wrap: wrap; }
  .colors button { width: 28px; height: 28px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
  .colors button.on { border-color: var(--ink); }
  .gate { padding: 80px 20px; text-align: center; color: var(--ink-dim); font: 22px var(--display); }
</style>
</head>
<body>
<div class="gate" id="gate">Loading your character…</div>
<div class="app" id="app" hidden>
  <div class="top">
    <a class="back" href="/" title="Home">&larr;</a>
    <h1 id="tName"></h1>
    <span class="line" id="tLine"></span>
    <span class="spacer"></span>
    <span id="tStatus"></span>
    <span class="saved" id="tSaved"></span>
  </div>
  <nav id="nav"></nav>
  <main id="main"></main>
  <aside class="side sheet" id="sheet"></aside>
</div>
<div class="toast" id="toast" hidden></div>
<script src="/lib/power.js"></script>
<script src="/lib/rules.js"></script>
<script>
'use strict';
const P = window.Power, Rules = window.Rules;
const KEY = 'tdnd.code';
const TOKEN = (() => { try { return localStorage.getItem(KEY); } catch { return null; } })();
const qs = new URLSearchParams(location.search);
const ID = qs.get('id');
if (!TOKEN) location.href = '/?next=' + encodeURIComponent(location.pathname + location.search);
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const sign = (n) => (n >= 0 ? '+' + n : String(n));
const clone = (o) => JSON.parse(JSON.stringify(o));
const COLORS = ['#4fb3a4', '#d8b45a', '#cf6a4c', '#a98bd6', '#6a9fd8', '#8cc265', '#e08fb5', '#c9c2ae'];

let view = null, build = null, d = null, cfg = P.DEFAULTS;
let step = (location.hash || '#concept').slice(1);
let editSeq = 0, sentSeq = 0, saving = false, saveTimer = null, lastSaved = null;
let hbOpen = null, filters = {}, talkOpen = {};

// ---------- server ----------
async function api(body) {
  const r = await fetch('/api/char', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(Object.assign({ token: TOKEN, id: ID }, body)) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.error || 'Something went wrong.');
  return j;
}
function adopt(v, keepLocal) {
  view = v; cfg = v.config || P.DEFAULTS;
  if (!keepLocal) build = clone(v.build);
  else {
    // Keep what the player is typing, but take the server's own fields (rolls, approvals).
    build.abilities.rolls = v.build.abilities && v.build.abilities.rolls;
    build.hp = Object.assign({}, build.hp, { rolls: v.build.hp && v.build.hp.rolls });
    for (const h of build.homebrew || []) { const s = (v.build.homebrew || []).find((x) => x.id === h.id); if (s) { h.status = s.status; h.approvedSig = s.approvedSig; h.dmNote = s.dmNote; h.request = s.request; } }
  }
  recompute();
}
function recompute() { d = Rules.derive(build, { config: cfg }); }
function changed(full = true) {
  editSeq++;
  recompute();
  if (full) render(); else { renderTop(); renderNav(); renderSheet(); }
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 500);
  $('tSaved').textContent = 'saving…';
}
async function save() {
  if (saving) { saveTimer = setTimeout(save, 300); return; }
  saving = true;
  const seq = editSeq;
  try {
    const v = await api({ action: 'save', build });
    sentSeq = seq; lastSaved = Date.now();
    adopt(v, editSeq !== seq);
    if (editSeq === seq) render(); else { renderTop(); renderSheet(); }
    $('tSaved').textContent = 'saved';
  } catch (e) { toast(e.message, true); $('tSaved').textContent = 'not saved'; }
  saving = false;
}
async function act(body, msg) {
  try {
    if (editSeq !== sentSeq) { clearTimeout(saveTimer); await save(); }
    const v = await api(body);
    adopt(v); render();
    if (msg) toast(typeof msg === 'function' ? msg(v) : msg);
    return v;
  } catch (e) { toast(e.message, true); return null; }
}
async function load() {
  const r = await fetch(`/api/char?token=${encodeURIComponent(TOKEN)}&id=${encodeURIComponent(ID || '')}`);
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { $('gate').innerHTML = `${esc(j.error || 'Could not load that character.')}<br><a href="/" style="color:var(--gold);font-size:16px">Back home</a>`; return false; }
  adopt(j);
  return true;
}
let toastT = null;
function toast(text, bad) { const t = $('toast'); t.textContent = text; t.className = 'toast' + (bad ? ' err' : ''); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { t.hidden = true; }, bad ? 6000 : 3500); }

// ---------- suggestions ----------
const openSugs = () => (view.suggestions || []).filter((s) => s.status === 'open');
const STEP_OF_PATH = (path) => {
  const [a, b] = path.split('.');
  if (a === 'picks') { const n = d.needs.find((x) => x.key === b); return n ? n.step : 'class'; }
  return { name: 'concept', level: 'concept', species: 'species', class: 'class', subclass: 'class', background: 'background', bgBonus: 'background', abilities: 'abilities', gear: 'gear', homebrew: 'homebrew', details: 'finish', hp: 'finish' }[a] || 'concept';
};
function sugsFor(path) { return openSugs().filter((s) => Object.keys(s.patch || {}).some((k) => k === path || k.startsWith(path + '.') || path.startsWith(k + '.'))); }
function sugValue(path) { for (const s of openSugs()) if (Object.prototype.hasOwnProperty.call(s.patch || {}, path)) return s.patch[path]; return undefined; }
function labelFor(path, v) {
  const [a, b] = path.split('.');
  const name = (id) => {
    if (a === 'picks') { const n = d.needs.find((x) => x.key === b); const o = n && n.options.find((x) => x.id === id); if (o) return o.name; }
    return (Rules.FEATS[id] || Rules.SPELLS[id] || Rules.WEAPONS[id] || Rules.ARMOR[id] || {}).name || String(id).replace(/^(custom|hb):/, '');
  };
  if (v === null) return 'remove';
  if (a === 'species') return (Rules.SPECIES[v] || {}).name || v;
  if (a === 'class') return (Rules.CLASSES[v] || {}).name || v;
  if (a === 'subclass') { const c = Rules.CLASSES[build.class]; return ((c && c.subclasses[v]) || {}).name || v; }
  if (a === 'background') return (Rules.BACKGROUNDS[v] || {}).name || v;
  if (a === 'homebrew') return `homebrew "${(v && v.name) || b}"`;
  if (a === 'bgBonus' || (a === 'abilities' && b === 'base')) return Object.entries(v || {}).filter(([, x]) => x).map(([k, x]) => `${k.toUpperCase()} ${a === 'bgBonus' ? sign(x) : x}`).join(', ');
  if (Array.isArray(v)) return v.map(name).join(', ');
  if (typeof v === 'boolean') return v ? 'yes' : 'no';
  if (typeof v === 'object') return JSON.stringify(v);
  return name(v);
}
const PATH_NAME = (path) => {
  const [a, b] = path.split('.');
  if (a === 'picks') { const n = d.needs.find((x) => x.key === b); return n ? n.label : b; }
  return ({ species: 'Species', class: 'Class', subclass: 'Subclass', background: 'Background', bgBonus: 'Background bonuses', level: 'Level', name: 'Name', homebrew: 'Homebrew',
    'abilities.method': 'Ability method', 'abilities.base': 'Ability scores', 'gear.armor': 'Armor', 'gear.shield': 'Shield', 'gear.weapons': 'Weapons', 'details.persona': 'Personality', 'details.appearance': 'Appearance' })[path] || ({ abilities: 'Abilities', gear: 'Gear', details: 'Details' })[a] || path;
};
function sugCard(s) {
  const keys = Object.keys(s.patch || {});
  let delta = '';
  if (keys.length) {
    try {
      const after = Rules.derive(Rules.applyPatch(build, s.patch), { config: cfg }).sheet;
      const bits = [];
      for (const [k, n] of [['ac', 'AC'], ['hp', 'HP'], ['speed', 'Speed'], ['init', 'Init']]) if (after[k] !== d.sheet[k]) bits.push(`${n} ${d.sheet[k]} → ${after[k]}`);
      const atkB = d.sheet.attacks.map((x) => `${x.name} ${sign(x.bonus)} ${x.damage}`).join('|'), atkA = after.attacks.map((x) => `${x.name} ${sign(x.bonus)} ${x.damage}`).join('|');
      if (atkA !== atkB) bits.push('attacks change');
      delta = bits.join(' · ');
    } catch { /* patch no longer fits */ }
  }
  const go = keys.length ? STEP_OF_PATH(keys[0]) : null;
  return `<div class="sug" id="sug-${esc(s.id)}">
    <div class="h">The DM suggests<span class="spacer"></span>${go && go !== step ? `<button class="link" data-go="${go}">see it on ${esc((Rules.STEPS.find((x) => x.id === go) || {}).name || go)}</button>` : ''}</div>
    <div class="txt">${esc(s.text)}</div>
    ${keys.length ? `<div class="chg">${keys.map((k) => `<div>${esc(PATH_NAME(k))}: <b>${esc(labelFor(k, s.patch[k]))}</b></div>`).join('')}</div>` : ''}
    ${delta ? `<div class="delta">${esc(delta)}</div>` : ''}
    ${s.thread.length ? `<div class="thread">${s.thread.map((t) => `<div class="${t.who === 'dm' ? 'dm' : ''}">${t.who === 'dm' ? 'DM' : 'You'}: ${esc(t.text)}</div>`).join('')}</div>` : ''}
    <div class="acts">${keys.length ? `<button class="ghost small accept" data-sug="${esc(s.id)}" data-ans="accept">Accept</button>` : `<button class="ghost small accept" data-sug="${esc(s.id)}" data-ans="accept">Got it</button>`}
      <button class="ghost small" data-sug="${esc(s.id)}" data-ans="decline">Decline</button>
      <button class="ghost small" data-talk="${esc(s.id)}">Talk about it</button></div>
    ${talkOpen[s.id] ? `<form class="talk" data-talkform="${esc(s.id)}"><input type="text" placeholder="What do you think? The DM sees this." maxlength="600"><button class="btn" type="submit">Send</button></form>` : ''}
  </div>`;
}
function inlineSug(path) {
  const ss = sugsFor(path);
  if (!ss.length) return '';
  return ss.map((s) => `<div class="inline-sug">★ The DM suggests <b>${esc(Object.keys(s.patch).filter((k) => k === path || k.startsWith(path + '.') || path.startsWith(k + '.')).map((k) => labelFor(k, s.patch[k])).join('; '))}</b>
    <button class="ghost small accept" style="background:var(--gold);color:#1b1a15;border:0" data-sug="${esc(s.id)}" data-ans="accept">Accept</button><button class="ghost small" data-sug="${esc(s.id)}" data-ans="decline">Decline</button><button class="link" data-gosug="${esc(s.id)}">details</button></div>`).join('');
}
const wouldPick = (path, id) => { const v = sugValue(path); return v !== undefined && (Array.isArray(v) ? v.includes(id) : v === id); };

// ---------- rendering ----------
function render() {
  renderTop(); renderNav(); renderMain(); renderSheet();
}
function renderTop() {
  $('tName').textContent = build.name || 'Unnamed hero';
  $('tLine').textContent = d.sheet.line;
  document.title = (build.name || 'New character') + ' · Builder';
  const st = d.status === 'ready' ? '<span class="pill ready">Ready for the table</span>' : d.status === 'needs-dm' ? '<span class="pill needs-dm">Waiting on the DM</span>' : '<span class="pill">In progress</span>';
  const sc = openSugs().length;
  $('tStatus').innerHTML = (sc ? `<span class="pill gold" style="cursor:pointer" data-go="${STEP_OF_PATH(Object.keys(openSugs()[0].patch || {})[0] || 'name')}">★ ${sc} DM suggestion${sc > 1 ? 's' : ''}</span> ` : '') + st;
}
function stepVisible(s) { return s.id !== 'spells' || d.needs.some((n) => n.step === 'spells'); }
function renderNav() {
  const sugSteps = new Set(openSugs().flatMap((s) => Object.keys(s.patch || {}).map(STEP_OF_PATH)));
  $('nav').innerHTML = Rules.STEPS.filter(stepVisible).map((s) => {
    const st = d.steps[s.id];
    const icon = st === 'ok' ? '✓' : st === 'error' ? '!' : st === 'dm' ? '★' : '';
    const optional = s.id === 'homebrew' && !(build.homebrew || []).length;
    return `<button class="${s.id === step ? 'on' : ''}" data-go="${s.id}"><span class="st ${optional ? '' : st}">${optional ? '' : icon}</span>${esc(s.name)}${sugSteps.has(s.id) ? '<span class="star" title="The DM has a suggestion here">★</span>' : optional ? '<span class="optional">optional</span>' : ''}</button>`;
  }).join('');
}
function renderMain() {
  const m = $('main');
  const top = m.scrollTop;
  const body = (STEP_RENDER[step] || STEP_RENDER.concept)();
  const tray = openSugs().filter((s) => { const ks = Object.keys(s.patch || {}); return !ks.length ? step === 'concept' : ks.some((k) => STEP_OF_PATH(k) === step); });
  const others = openSugs().length - tray.length;
  const vis = Rules.STEPS.filter(stepVisible);
  const i = vis.findIndex((s) => s.id === step);
  m.innerHTML = (tray.length ? `<div class="tray">${tray.map(sugCard).join('')}</div>` : '')
    + (others && !tray.length ? `<div class="notice" style="border-color:var(--gold-line);color:var(--gold)">★ The DM has ${others} suggestion${others > 1 ? 's' : ''} on other steps (marked in the list).</div>` : '')
    + body
    + `<div class="footer-nav">${i > 0 ? `<button class="ghost" data-go="${vis[i - 1].id}">← ${esc(vis[i - 1].name)}</button>` : '<span></span>'}${i < vis.length - 1 ? `<button class="btn" data-go="${vis[i + 1].id}">${esc(vis[i + 1].name)} →</button>` : ''}</div>`;
  m.scrollTop = top;
  for (const el of m.querySelectorAll('[data-path]')) if (sugsFor(el.dataset.path).length) el.classList.add('suggested');
  const f = m.querySelector('[data-autofocus]');
  if (f) f.focus();
}

// Generic picks: what derive() says is left to choose.
function needsHtml(stepId, filterFn) {
  return d.needs.filter((n) => n.step === stepId && (!filterFn || filterFn(n))).map(needHtml).join('');
}
function needHtml(n) {
  const chosen = (build.picks[n.key] || []);
  const done = n.chosen.length >= n.count;
  const path = 'picks.' + n.key;
  const hasDesc = n.options.some((o) => o.desc);
  const many = n.options.length > 12;
  const q = (filters[n.key] || '').toLowerCase();
  const opts = n.options.filter((o) => !q || (o.name + ' ' + (o.desc || '')).toLowerCase().includes(q));
  const cnt = (id) => chosen.filter((x) => x === id).length;
  let inner;
  if (hasDesc) {
    const byLevel = n.options.some((o) => o.level !== undefined);
    const item = (o) => `<button class="opt ${cnt(o.id) ? 'sel' : ''} ${wouldPick(path, o.id) && !cnt(o.id) ? 'would' : ''}" data-pick="${esc(n.key)}" data-id="${esc(o.id)}">
      <div class="t">${esc(o.name)}${o.homebrew ? ' <span class="hb">homebrew</span>' : ''}${byLevel ? `<span class="x">${o.level ? 'level ' + o.level : 'cantrip'}</span>` : ''}${n.dup && cnt(o.id) > 1 ? `<span class="x">×${cnt(o.id)}</span>` : ''}</div>${o.desc ? `<div class="d">${esc(o.desc)}</div>` : ''}</button>`;
    inner = `<div class="list ${many ? 'scroll' : ''}">${opts.map(item).join('') || '<div class="muted">Nothing matches.</div>'}</div>`;
  } else {
    inner = `<div class="chips">${opts.map((o) => `<button class="chip ${cnt(o.id) ? 'sel' : ''} ${wouldPick(path, o.id) && !cnt(o.id) ? 'would' : ''}" data-pick="${esc(n.key)}" data-id="${esc(o.id)}">${esc(o.name)}${n.dup && cnt(o.id) ? `<span class="n">+${cnt(o.id)}</span>` : ''}</button>`).join('')}</div>`;
  }
  const customs = chosen.filter((x) => String(x).startsWith('custom:'));
  return `<div data-path="${esc(path)}" style="padding:2px 4px;margin:0 -4px">
    <h3>${esc(n.label)} <span class="count ${done ? 'done' : ''}">${n.chosen.length}/${n.count}${n.dup ? ' (the same one twice is fine)' : ''}</span></h3>
    ${inlineSug(path)}
    ${many ? `<input type="text" class="filter" placeholder="Filter…" data-filter="${esc(n.key)}" value="${esc(filters[n.key] || '')}">` : ''}
    ${inner}
    ${n.custom ? `<div class="row" style="margin-top:8px">${customs.map((c) => `<span class="chip sel" data-pick="${esc(n.key)}" data-id="${esc(c)}">${esc(c.slice(7))} ✕</span>`).join('')}
      <form class="row" data-custom="${esc(n.key)}"><input type="text" placeholder="Another spell, by name" style="width:220px"><button class="ghost small" type="submit">Add</button></form></div>` : ''}
  </div>`;
}
function stepIssues(stepId) {
  const e = d.errors.filter((x) => x.step === stepId), w = d.warnings.filter((x) => x.step === stepId), m = d.dm.filter((x) => x.step === stepId);
  return e.map((x) => `<div class="notice warn">${esc(x.msg)}</div>`).join('') + m.map((x) => `<div class="notice dm">${esc(x.what)}</div>`).join('') + w.map((x) => `<div class="notice">${esc(x.msg)}</div>`).join('');
}

        : '<p><button class="btn" data-act="roll">Roll 4d6, drop the lowest, six times</button></p><p class="muted" style="font-size:12px">The server rolls, once, so everyone at the table can trust the numbers.</p>') : ''}
      <table class="ab" data-path="abilities.base"><tr><th>Ability</th><th>Base</th><th>Bonus</th><th>Score</th><th>Mod</th></tr>
        ${Rules.ABIL.map((k) => { const other = sh.abilities[k].score - (a.base[k] ?? 10) - (Number(bgB[k]) || 0); return `<tr><td class="n">${Rules.ABIL_NAME[k]}</td><td>${control(k)}</td><td class="plus">${bgB[k] ? '+' + bgB[k] + ' bg' : ''}${other ? ` ${sign(other)} other` : ''}</td><td class="tot">${sh.abilities[k].score}</td><td class="mod">${sign(sh.abilities[k].mod)}</td></tr>`; }).join('')}
      </table>${stepIssues('abilities')}`;
  },
  feats() {
    const groups = [...new Set(d.needs.filter((n) => n.step === 'feats').map((n) => n.group || ''))];
    const bg = Rules.BACKGROUNDS[build.background];
    const bgFeat = bg && bg.feat && Rules.FEATS[bg.feat];
    const featList = (L) => `<p class="dim" style="margin-top:-4px">Feats you could take: general feats (most add +1 to an ability), Ability Score Improvement, or any origin feat.</p>`;
    return `<h2>Feats</h2><p class="lede">Feats come from your background${build.species === 'human' ? ', your human Versatile trait,' : ''} and from leveling up (at 4th level and every few levels after).</p>
      ${bgFeat ? `<div class="notice">From your background: <b style="color:var(--ink)">${esc(bgFeat.name)}</b>. ${esc(bgFeat.desc)}</div>` : ''}
      ${groups.length ? groups.map((g) => `${g ? `<h3 style="color:var(--ink-dim);font-size:13px;margin-top:30px">${esc(g)}</h3>` : ''}${/^Level/.test(g) ? featList() : ''}${needsHtml('feats', (n) => (n.group || '') === g)}`).join('') : '<p class="muted">No feat choices at this level' + (build.class ? '' : ' (choose a class first)') + '. Your first general feat comes at 4th level.</p>'}
      ${stepIssues('feats')}
      <p class="muted" style="margin-top:20px">Have an idea for a feat? <button class="link" data-go="homebrew">Make one</button> and it shows up here once it's approved.</p>`;
  },
  spells() {
    const s = d.sheet.spells;
    const cls = Rules.CLASSES[build.class];
    const slots = s && s.slots && s.slots.length ? s.slots.map((n, i) => `${n}×${i + 1}${['st', 'nd', 'rd'][i] || 'th'}`).join(', ') : s && s.pact ? `${s.pact.n} pact slot${s.pact.n > 1 ? 's' : ''} of level ${s.pact.level}` : '';
    return `<h2>Spells</h2><p class="lede">${cls && cls.caster ? `You cast with ${Rules.ABIL_NAME[cls.caster.abil]}: save DC <b>${s.dc}</b>, spell attack <b>${sign(s.atk)}</b>${slots ? `. Slots: ${slots}` : ''}. You can change prepared spells after a long rest.` : 'Spells from your feats and species.'}</p>
      ${s && s.always.length ? `<div class="notice">Always prepared (free): ${s.always.map((id) => esc((Rules.SPELLS[id] || { name: id }).name)).join(', ')}</div>` : ''}
      ${needsHtml('spells')}${stepIssues('spells')}
      <p class="muted" style="margin-top:16px">The list covers spells up to 3rd level. Higher-level spells can be added by name.</p>`;
  },
  gear() {
    const g = build.gear;
    const sh = d.sheet;
    const armorTr = sh.armorTraining;
    const groups = ['light', 'medium', 'heavy'];
    const prof = (w) => sh.weaponTraining.some((t) => t === w.cat || (w.cat === 'martial' && ((t.includes('light') && w.props.includes('light')) || (t.includes('finesse') && (w.props.includes('finesse') || w.props.includes('light'))))));
    const weaponChips = (cat) => Object.entries(Rules.WEAPONS).filter(([, w]) => w.cat === cat).map(([id, w]) => `<button class="chip ${g.weapons.includes(id) ? 'sel' : ''} ${wouldPick('gear.weapons', id) && !g.weapons.includes(id) ? 'would' : ''}" data-weapon="${id}" title="${esc(w.dmg + ' ' + w.type + (w.props.length ? ' · ' + w.props.join(', ') : '') + (w.range ? ` · ${w.range[0]}/${w.range[1]} ft` : ''))}">${esc(w.name)}${prof(w) ? '' : ' <span class="muted">(no prof.)</span>'}</button>`).join('');
    return `<h2>Gear</h2><p class="lede">Armor, a shield, and the weapons you carry. Attacks on the sheet are worked out from these.</p>
      ${inlineSug('gear')}
      <h3>Armor</h3>
      <div data-path="gear.armor"><select data-armor style="min-width:260px"><option value="">No armor (AC ${10 + sh.abilities.dex.mod}${build.class === 'barbarian' || build.class === 'monk' ? ', or Unarmored Defense' : ''})</option>
        ${groups.map((t) => `<optgroup label="${Rules.title(t)}${armorTr.includes(t) ? '' : ' (no training)'}">${Object.entries(Rules.ARMOR).filter(([, a]) => a.type === t).map(([id, a]) => `<option value="${id}" ${g.armor === id ? 'selected' : ''}>${a.name}: AC ${a.base}${t === 'light' ? ' + DEX' : t === 'medium' ? ' + DEX (max 2)' : ''}${a.str ? `, needs STR ${a.str}` : ''}${a.stealth ? ', noisy' : ''}</option>`).join('')}</optgroup>`).join('')}
      </select></div>
      <label class="row" style="margin-top:10px;cursor:pointer" data-path="gear.shield"><input type="checkbox" data-shield ${g.shield ? 'checked' : ''}> Shield (+2 AC)${armorTr.includes('shield') ? '' : ' <span class="muted">no training</span>'}</label>
      <h3>Weapons</h3><div data-path="gear.weapons"><div class="dim" style="font-size:12px;margin-bottom:6px">Simple</div><div class="chips">${weaponChips('simple')}</div>
      <div class="dim" style="font-size:12px;margin:12px 0 6px">Martial</div><div class="chips">${weaponChips('martial')}</div></div>
      <h3>Other things you carry</h3>
      <textarea data-field="gear.itemsText" placeholder="Rope, a lantern, a lucky coin...">${esc((g.items || []).join('\n'))}</textarea>
      ${stepIssues('gear')}`;
  },
  homebrew() {
    const hbs = build.homebrew || [];
    return `<h2>Homebrew</h2><p class="lede">Something the books don't have: a feat, a fighting style, a trait, a trinket. Describe it, list what it does, and the meter compares it with official content.
      If it's on par, or only a little stronger (the table's power-creep allowance), you can use it right away. Anything bigger goes to the DM, who'll help find a version that works.</p>
      ${hbs.map(hbHtml).join('')}
      <button class="btn" data-act="newhb">+ New homebrew</button>
      ${d.pool.used ? `<p class="muted" style="margin-top:14px">Power creep used: ${d.pool.used} of ${d.pool.pool} FP.</p>` : ''}
      ${stepIssues('homebrew')}`;
  },
  finish() {
    const items = [...d.errors.map((e) => `<li class="e">${esc(e.msg)} <button class="link" data-go="${e.step}">fix</button></li>`), ...d.todo.map((t) => `<li>${esc(t.msg)} <button class="link" data-go="${t.step}">go</button></li>`), ...d.dm.map((x) => `<li class="m">${esc(x.what)}</li>`)];

      ${d.status === 'ready' ? `<div class="notice good">${esc(build.name || 'Your character')} is ready for the table. The DM can bring them into the game whenever you're both ready.</div>` : items.length ? `<p class="lede">Almost there:</p><ul class="todo">${items.join('')}</ul>` : ''}
      ${d.warnings.length ? `<h3>Worth knowing</h3><ul class="todo">${d.warnings.map((w) => `<li>${esc(w.msg)}</li>`).join('')}</ul>` : ''}
      <h3>Hit points</h3>
      <div class="row" data-path="hp"><div class="seg"><button class="${hp.method !== 'rolled' ? 'on' : ''}" data-hp="average">Take the average</button><button class="${hp.method === 'rolled' ? 'on' : ''}" data-hp="rolled">Roll them</button></div>
        <span class="dim">${d.sheet.hp} HP (${esc(d.sheet.hpWhy)})</span></div>
      ${hp.method === 'rolled' && cls && build.level > 1 ? `<div class="rolls">${Array.from({ length: build.level - 1 }, (_, i) => i + 2).map((lv) => `<div class="roll"><b>${rolls[lv] ?? '?'}</b><span>level ${lv} · d${cls.hd}</span></div>`).join('')}</div>
        ${Array.from({ length: build.level - 1 }, (_, i) => i + 2).some((lv) => rolls[lv] === undefined) ? `<button class="btn" data-act="rollhp">Roll hit points</button>` : ''}<p class="muted" style="font-size:12px">The server rolls each level once. 1st level is always the maximum.</p>` : ''}
      <h3>Personality</h3><textarea data-field="details.persona" data-path="details.persona" placeholder="How they talk, what they want, what they won't do.">${esc(build.details.persona || '')}</textarea>
      <h3>Appearance</h3><textarea data-field="details.appearance" data-path="details.appearance" placeholder="What people notice first.">${esc(build.details.appearance || '')}</textarea>
      <h3>Token color</h3><div class="colors">${COLORS.map((c) => `<button style="background:${c}" class="${build.details.color === c ? 'on' : ''}" data-color="${c}" title="${c}"></button>`).join('')}</div>
      <details class="raw"><summary>What the engine sees</summary><pre>${esc(JSON.stringify(d.creature, null, 2))}</pre></details>`;

function cardHtml(field, id, name, desc, meta) {
  const sel = build[field] === id;
  return `<button class="opt big ${sel ? 'sel' : ''} ${wouldPick(field, id) && !sel ? 'would' : ''}" data-set="${field}" data-id="${esc(id)}"><div class="t">${esc(name)}</div>${meta ? `<div class="d" style="font-size:12px;color:var(--ink-faint)">${esc(meta)}</div>` : ''}${desc ? `<div class="d">${esc(desc)}</div>` : ''}</button>`;
}

// ---------- homebrew editor ----------
const KIND_GROUPS = [...new Set(Object.values(P.KINDS).map((k) => k.group))];
function hbHtml(h) {
  const r = (d.homebrew.find((x) => x.id === h.id) || {}).rating || P.rate(h, { level: build.level, config: cfg });
  const open = hbOpen === h.id || !h.name;
  const st = { draft: '<span class="pill">Draft</span>', auto: '<span class="pill ready">In use</span>', approved: '<span class="pill ready">DM approved</span>', pending: '<span class="pill needs-dm">With the DM</span>', declined: '<span class="pill" style="color:var(--enemy)">Not approved</span>' }[h.status] || '';
  const active = (d.homebrew.find((x) => x.id === h.id) || {}).active;
  const canUse = !r.needsDm && ['fair', 'under', 'creep'].includes(r.verdict);
  const path = 'homebrew.' + h.id;
  if (!open) {
    return `<div class="hbcard" data-path="${esc(path)}"><div class="hh"><b>${esc(h.name || 'Untitled')}</b><span class="muted">${esc(r.slotLabel)}</span>${st}<span style="flex:1"></span><button class="ghost small" data-hbedit="${esc(h.id)}">Edit</button></div>
      <div class="dim" style="margin-top:6px">${esc(h.text || '')}</div>${meterHtml(r)}${slotHint(h)}${h.dmNote ? `<div class="notice dm">DM: ${esc(h.dmNote)}</div>` : ''}${inlineSug(path)}
      ${h.status === 'auto' && !active ? '<div class="notice warn">Not in use: it no longer fits the automatic allowance.</div>' : ''}</div>`;
  }
  return `<div class="hbcard" data-path="${esc(path)}" data-hb="${esc(h.id)}">
    <div class="hh"><input type="text" data-hbf="name" value="${esc(h.name || '')}" placeholder="Name it" style="flex:1;min-width:180px;font:500 18px var(--display)" ${!h.name ? 'data-autofocus' : ''}>${st}</div>
    ${inlineSug(path)}
    <label class="f">What kind of thing is it?</label>
    <select data-hbf="slot">${Object.entries(P.SLOTS).map(([id, s]) => `<option value="${id}" ${h.slot === id ? 'selected' : ''}>${s.label}${s.budget !== null ? ` (budget ${s.budget} FP)` : ''}</option>`).join('')}</select>
    <div class="muted" style="font-size:12px;margin-top:4px">${esc((P.SLOTS[h.slot] || P.SLOTS.other).hint)}</div>
    <label class="f">What does it do, in your words?</label>
    <textarea data-hbf="text" placeholder="Describe it like a feat in the book.">${esc(h.text || '')}</textarea>
    <label class="f">What it does, in game terms</label>
    <div>${(h.effects || []).map((e, i) => effHtml(e, i)).join('')}</div>
    <button class="ghost small" data-hbadd style="margin-top:8px">+ Add an effect</button>
    <div class="meterbox">${meterHtml(r, true)}</div>
    ${h.dmNote ? `<div class="notice dm">DM: ${esc(h.dmNote)}</div>` : ''}
    <div class="row" style="margin-top:12px">
      ${canUse && h.status !== 'auto' && h.status !== 'approved' ? `<button class="btn" data-hbuse="${esc(h.id)}">Use it</button>` : ''}
      ${h.status !== 'pending' ? `<button class="${canUse ? 'ghost' : 'btn'}" data-hbsend="${esc(h.id)}">${canUse ? 'Ask the DM anyway' : 'Send to the DM'}</button>` : '<span class="dim">Waiting for the DM. You can keep editing; they see the latest version.</span>'}
      <span style="flex:1"></span><button class="ghost small" data-hbclose>Done</button><button class="ghost small" data-hbdel="${esc(h.id)}">Delete</button>
    </div>
    ${slotHint(h)}
  </div>`;
}
// A feat or fighting style only counts once it's picked somewhere: say where (or that there's no spot yet).
function slotHint(h) {
  if (!['feat', 'origin-feat', 'fighting-style'].includes(h.slot) || !['auto', 'approved'].includes(h.status)) return '';
  const where = d.needs.filter((n) => n.options.some((o) => o.id === 'hb:' + h.id));
  const picked = where.some((n) => (build.picks[n.key] || []).includes('hb:' + h.id));
  if (picked) return '<p class="muted" style="font-size:12px">Picked, and counted on your sheet.</p>';
  if (where.length) return `<p class="muted" style="font-size:12px">Now pick it: ${where.map((n) => `<button class="link" data-go="${n.step}">${esc(n.label)}</button>`).join(', ')}.</p>`;
  const how = h.slot === 'fighting-style' ? 'Fighters (1st), and paladins and rangers (2nd), choose fighting styles.'
    : h.slot === 'origin-feat' ? `Origin feats come from your background, or from being human. ${build.background && build.background !== 'custom' ? 'Your background\'s feat is fixed; a <button class="link" data-go="background">Custom background</button> lets you choose this one instead.' : ''}`
      : 'General feats are chosen at 4th level and up.';
  return `<div class="notice">There's no spot for it on this character yet. ${how}</div>`;
}
function effHtml(e, i) {
  const k = P.KINDS[e.kind] || P.KINDS.minor;
  const sel = (name, opts, v) => `<select data-eff="${i}" data-k="${name}">${opts.map(([id, n]) => `<option value="${id}" ${String(v) === String(id) ? 'selected' : ''}>${esc(n)}</option>`).join('')}</select>`;
  const ps = [];
  for (const p of k.params) {
    if (p === 'ability') ps.push(sel('ability', Rules.ABIL.map((a) => [a, Rules.ABIL_NAME[a]]), e.ability || 'str'));
    if (p === 'ability|all') ps.push(sel('ability', [['all', 'all saves'], ...Rules.ABIL.map((a) => [a, Rules.ABIL_NAME[a] + ' saves'])], e.ability || 'all'));
    if (p === 'value') ps.push(`<input type="number" data-eff="${i}" data-k="value" value="${esc(e.value ?? '')}" placeholder="${esc(k.unit || 'N')}" title="${esc(k.unit || '')}">`);
    if (p === 'skill') ps.push(sel('skill', Rules.ALL_SKILLS.map((s) => [s, Rules.skillName(s)]), e.skill || 'stealth'));
    if (p === 'type') ps.push(sel('type', P.DAMAGE_TYPES.map((t) => [t, t]), e.type || 'fire'));
    if (p === 'scope') ps.push(sel('scope', Object.entries(e.kind === 'advantage' ? P.ADV_SCOPES : P.SCOPES), e.scope || (e.kind === 'advantage' ? 'skill' : 'all')));
    if (p === 'armor') ps.push(sel('armor', [['light', 'light armor'], ['medium', 'medium armor'], ['heavy', 'heavy armor'], ['shield', 'shields']], e.armor || 'light'));
    if (p === 'dice') ps.push(`<input type="text" data-eff="${i}" data-k="dice" value="${esc(e.dice || '')}" placeholder="1d6" style="width:80px">`);
    if (p === 'text') ps.push(`<input type="text" data-eff="${i}" data-k="text" value="${esc(e.text || '')}" placeholder="${k.self ? 'what it is' : 'detail'}" style="flex:1;min-width:140px">`);
  }
  ps.push(sel('when', Object.entries({ always: 'always applies', often: 'usually applies', sometimes: 'sometimes applies', rarely: 'rarely applies' }), e.when || 'always'));
  ps.push(sel('per', [['atwill', k.spent ? 'per long rest' : 'always on'], ['short', 'per short rest'], ['long', 'per long rest']].filter(([id]) => !(k.spent && id === 'atwill')), e.per || (k.spent ? 'long' : 'atwill')));
  if (k.spent || (e.per && e.per !== 'atwill')) ps.push(`<input type="text" data-eff="${i}" data-k="uses" value="${esc(e.uses ?? '')}" placeholder="uses" title="a number, or prof" style="width:70px">`);
  const price = P.priceEffect(e, build.level);
  return `<div class="eff"><select data-eff="${i}" data-k="kind">${KIND_GROUPS.map((g) => `<optgroup label="${g}">${Object.entries(P.KINDS).filter(([, x]) => x.group === g).map(([id, x]) => `<option value="${id}" ${e.kind === id ? 'selected' : ''}>${esc(x.label)}</option>`).join('')}</optgroup>`).join('')}</select>
    <div class="ps">${ps.join('')}</div>
    <div class="row" style="gap:6px;flex-wrap:nowrap"><span class="mono muted" style="font-size:12px" title="feat points">${price.cost === null ? 'DM' : price.cost + ' FP'}</span><button class="ghost small" data-effdel="${i}" title="Remove">✕</button></div></div>`;
}
function meterHtml(r, full) {
  if (r.budget === null) return `<div class="verdict dm" style="margin-top:10px">${esc(r.summary)} ${full && r.dm.length ? '(' + esc(r.dm.join('; ')) + ')' : ''}</div>`;
  const max = Math.max(r.ceiling * 1.35, r.cost * 1.08, 0.5);
  const pct = (x) => Math.min(100, (x / max) * 100);
  const z = (a, b, c) => `<div class="z" style="left:${pct(a)}%;width:${pct(b) - pct(a)}%;background:${c}"></div>`;
  return `<div class="meter"><div class="bar">${z(0, r.budget * 0.6, '#2c2a22')}${z(r.budget * 0.6, r.budget, 'rgba(79,179,164,.45)')}${z(r.budget, r.ceiling, 'rgba(216,180,90,.5)')}${z(r.ceiling, max, 'rgba(169,139,214,.35)')}<div class="mk" style="left:calc(${pct(r.cost)}% - 1px)"></div></div>
    <div class="marks"><span style="left:${pct(r.budget)}%">budget ${r.budget}</span><span style="left:${Math.min(92, pct(r.ceiling) + 6)}%">+creep ${r.ceiling}</span></div></div>
    <div class="verdict ${r.verdict}">${esc(r.summary)}</div>
    ${full ? `<div class="parts">${r.parts.map((p) => `<div><span class="c">${p.cost === null ? '?' : p.cost}</span><span>${esc(p.label)}${p.self ? ' (self-rated)' : ''}</span></div>`).join('')}</div>` : ''}
    ${r.compare.length ? `<div class="muted" style="font-size:12px">Compare: ${r.compare.map((c) => `${esc(c.name)} ${c.cost} FP`).join(' · ')}</div>` : ''}
    ${full && r.dm.length ? `<div class="muted" style="font-size:12px;color:#c6b2e6">Needs the DM: ${esc(r.dm.join('; '))}.</div>` : ''}`;
}

// ---------- the sheet ----------
function renderSheet() {
  const s = d.sheet;
  const ab = Rules.ABIL.map((a) => `<div><span>${a.toUpperCase()}</span><b>${s.abilities[a].score}</b><i>${sign(s.abilities[a].mod)}</i></div>`).join('');
  const saves = Rules.ABIL.map((a) => `<span class="${s.abilities[a].prof ? 'p' : ''}">${Rules.ABIL_NAME[a]}</span><span class="v ${s.abilities[a].prof ? 'p' : ''}">${sign(s.abilities[a].save)}</span>`).join('');
  const skills = s.skills.filter((x) => x.prof).map((x) => `<span class="p">${esc(x.name)}${x.exp ? ' <span class="x">★</span>' : ''}</span><span class="v">${sign(x.bonus)}</span>`).join('');
  const res = Object.entries(s.resources).map(([k, v]) => `<span>${esc(k.replace(/([A-Z])/g, ' $1').toLowerCase())} ${v}</span>`).join('');
  $('sheet').innerHTML = `<div class="nm">${esc(build.name || 'Unnamed')}</div><div class="ln">${esc(s.line)}</div>
    <div class="big3"><div title="${esc(s.acWhy)}"><b>${s.ac}</b><span>AC</span></div><div title="${esc(s.hpWhy)}"><b>${s.hp}</b><span>HP</span></div><div><b>${s.speed}</b><span>Speed</span></div><div><b>${sign(s.init)}</b><span>Init</span></div></div>
    <div class="abil">${ab}</div>
    <h4>Attacks</h4>${s.attacks.length ? s.attacks.map((a) => `<div class="atk"><span>${esc(a.name)}</span><span>${sign(a.bonus)}</span><span>${esc(a.damage)} ${esc(a.type)}</span></div>`).join('') : '<div class="muted">Pick weapons on the Gear step.</div>'}
    <h4>Saving throws</h4><div class="sk">${saves}</div>
    <h4>Skills</h4><div class="sk">${skills || '<span class="muted">none yet</span><span></span>'}</div>
    <div class="muted" style="font-size:12px;margin-top:6px">Passive Perception ${s.passive} · proficiency ${sign(s.pb)}${s.darkvision ? ` · darkvision ${s.darkvision} ft` : ''}${s.resist.length ? ` · resists ${esc(s.resist.join(', '))}` : ''}</div>
    ${res ? `<h4>Resources</h4><div class="res">${res}</div>` : ''}
    <h4>Features</h4>${s.features.map((f, i) => `<div class="feat" data-feat="${i}"><b>${esc(f.name)}</b><span class="s">${esc(f.src)}</span><div class="dd">${esc(f.desc)}</div></div>`).join('') || '<div class="muted">Choose a species and class.</div>'}`;
}

// ---------- interaction ----------
function setPath(obj, path, v) { const ps = path.split('.'); let o = obj; for (let i = 0; i < ps.length - 1; i++) o = o[ps[i]] = o[ps[i]] || {}; o[ps[ps.length - 1]] = v; }
function go(s) { step = s; history.replaceState(null, '', '#' + s); render(); $('main').scrollTop = 0; window.scrollTo(0, 0); }
function hb(id) { return (build.homebrew || []).find((x) => x.id === id); }
function togglePick(key, id) {
  const n = d.needs.find((x) => x.key === key);
  let cur = (build.picks[key] || []).slice();
  if (n && n.dup) {
    if (cur.length >= n.count) { const i = cur.lastIndexOf(id); if (i >= 0) cur.splice(i, 1); else { cur.shift(); cur.push(id); } }
    else cur.push(id);
  } else if (cur.includes(id)) cur = cur.filter((x) => x !== id);
  else if (n && n.count === 1) cur = [id];
  else { cur.push(id); if (n && cur.length > n.count) cur.shift(); }
  build.picks[key] = cur;
}

document.addEventListener('click', async (e) => {
  const t = e.target.closest('button, [data-pick], [data-feat], [data-go]');
  if (!t) return;
  const ds = t.dataset;
  if (ds.go) return go(ds.go);
  if (ds.gosug) { const el = $('sug-' + ds.gosug); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
  if (ds.feat !== undefined) return t.classList.toggle('open');
  if (ds.sug) {
    let text = '';
    if (ds.ans === 'decline') { const f = document.querySelector(`[data-talkform="${ds.sug}"] input`); text = f ? f.value : ''; }
    return act({ action: 'suggestion', sid: ds.sug, answer: ds.ans }, ds.ans === 'accept' ? 'Done. The sheet is updated.' : 'Declined. The DM will see that.').then(() => { delete talkOpen[ds.sug]; });
  }
  if (ds.talk) { talkOpen[ds.talk] = !talkOpen[ds.talk]; renderMain(); const f = document.querySelector(`[data-talkform="${ds.talk}"] input`); if (f) f.focus(); return; }
  if (ds.set) {
    if (build[ds.set] === ds.id) return;
    build[ds.set] = ds.id;
    if (ds.set === 'class') { build.subclass = null; }
    if (ds.set === 'background') build.bgBonus = {};
    return changed();
  }
  if (ds.pick) { togglePick(ds.pick, ds.id); return changed(); }
  if (ds.level) { build.level = Math.max(1, Math.min(20, build.level + Number(ds.level))); return changed(); }
  if (ds.size) { build.details.size = ds.size; return changed(); }
  if (ds.bgmode) { const bg = Rules.BACKGROUNDS[build.background]; const pool = bg.custom ? Rules.ABIL : bg.abil; build.bgBonus = ds.bgmode === '111' ? Object.fromEntries(pool.slice(0, 3).map((a) => [a, 1])) : {}; return changed(); }
  if (ds.bg) { const v = Number(ds.v); const cur = Object.assign({}, build.bgBonus); for (const k of Object.keys(cur)) if (Number(cur[k]) === v || k === ds.bg) delete cur[k]; cur[ds.bg] = v; build.bgBonus = cur; return changed(); }
  if (ds.bg1) { const cur = Object.assign({}, build.bgBonus); if (cur[ds.bg1]) delete cur[ds.bg1]; else { cur[ds.bg1] = 1; const ks = Object.keys(cur); if (ks.length > 3) delete cur[ks[0]]; } build.bgBonus = cur; return changed(); }
  if (ds.method) { if (build.abilities.method === ds.method) return; build.abilities = Object.assign({}, build.abilities, { method: ds.method, base: ds.method === 'pointbuy' ? { str: 8, dex: 8, con: 8, int: 8, wis: 8, cha: 8 } : {} }); return changed(); }
  if (ds.pb) { const k = ds.pb; build.abilities.base[k] = Math.max(8, Math.min(15, (build.abilities.base[k] ?? 8) + Number(ds.d))); return changed(); }
  if (ds.weapon) { const w = build.gear.weapons; build.gear.weapons = w.includes(ds.weapon) ? w.filter((x) => x !== ds.weapon) : w.concat(ds.weapon); return changed(); }
  if (ds.color) { build.details.color = ds.color; return changed(); }
  if (ds.hp) { build.hp = Object.assign({}, build.hp, { method: ds.hp }); return changed(); }
  if (ds.act === 'recommend') return act({ action: 'recommend' }, 'Filled in. Everything is still yours to change.');
  if (ds.act === 'roll') return act({ action: 'roll-abilities' }, (v) => 'Rolled: ' + v.build.abilities.rolls.map((r) => r.total).join(', '));
  if (ds.act === 'rollhp') return act({ action: 'roll-hp' }, (v) => (v.result.rolls || []).map((r) => `level ${r.level}: ${r.roll}`).join(', ') || 'Rolled.');
  if (ds.act === 'autoabil') {
    const cls = Rules.CLASSES[build.class]; const meth = build.abilities.method;
    // The standard array spread is also exactly 27 points of point buy.
    const vals = meth === 'rolled' ? (build.abilities.rolls || []).map((r) => r.total).sort((x, y) => y - x) : Rules.STANDARD_ARRAY;
    if (vals.length === 6) { build.abilities.base = {}; cls.rec.abil.forEach((a, i) => { build.abilities.base[a] = vals[i]; }); }
    return changed();
  }
  if (ds.act === 'newhb') {
    const id = 'h' + Math.random().toString(36).slice(2, 8);
    build.homebrew = (build.homebrew || []).concat({ id, name: '', slot: 'origin-feat', text: '', effects: [{ kind: 'skill', skill: 'stealth' }], status: 'draft' });
    hbOpen = id;
    return changed();
  }
  if (ds.hbedit) { hbOpen = ds.hbedit; return renderMain(); }
  if (ds.hbclose !== undefined) { hbOpen = null; return renderMain(); }
  if (ds.hbadd !== undefined) { const h = hb(t.closest('[data-hb]').dataset.hb); h.effects = (h.effects || []).concat({ kind: 'minor', text: '' }); return changed(); }
  if (ds.effdel !== undefined) { const h = hb(t.closest('[data-hb]').dataset.hb); h.effects.splice(Number(ds.effdel), 1); return changed(); }
  if (ds.hbdel) { if (!confirm('Delete this homebrew?')) return; build.homebrew = build.homebrew.filter((x) => x.id !== ds.hbdel); for (const k of Object.keys(build.picks)) build.picks[k] = build.picks[k].filter((x) => x !== 'hb:' + ds.hbdel); if (build.species === 'hb:' + ds.hbdel) build.species = null; hbOpen = null; return changed(); }
  if (ds.hbuse) return act({ action: 'use-homebrew', hb: ds.hbuse }, 'In use. No DM needed.').then((v) => { if (v) hbOpen = null; render(); });
  if (ds.hbsend) { const note = prompt('Anything the DM should know? (optional: what you\'re going for, the character idea)') ; if (note === null) return; return act({ action: 'send-homebrew', hb: ds.hbsend, note }, 'Sent. The DM\'s answer will show up here.'); }
});
document.addEventListener('submit', async (e) => {
  e.preventDefault();
  const f = e.target;
  if (f.id === 'askForm') { const text = $('askText').value.trim(); if (!text) return; return act({ action: 'ask', text }, 'Sent to the DM.'); }
  if (f.dataset.custom) { const v = f.querySelector('input').value.trim(); if (!v) return; const key = f.dataset.custom; build.picks[key] = (build.picks[key] || []).concat('custom:' + v.slice(0, 60)); return changed(); }
  if (f.dataset.talkform) { const v = f.querySelector('input').value.trim(); if (!v) return; await act({ action: 'suggestion', sid: f.dataset.talkform, answer: 'discuss', text: v }, 'Sent. The DM will reply here.'); talkOpen[f.dataset.talkform] = true; renderMain(); }
});
document.addEventListener('input', (e) => {
  const t = e.target, ds = t.dataset;
  if (ds.field) {
    if (ds.field === 'gear.itemsText') build.gear.items = t.value.split('\n').map((x) => x.trim()).filter(Boolean).slice(0, 40);
    else setPath(build, ds.field, t.value);
    return changed(false);
  }
  if (ds.filter !== undefined) { filters[ds.filter] = t.value; const pos = t.selectionStart; renderMain(); const el = document.querySelector(`[data-filter="${ds.filter}"]`); el.focus(); el.setSelectionRange(pos, pos); return; }
  if (ds.hbf && ['name', 'text'].includes(ds.hbf)) { hb(t.closest('[data-hb]').dataset.hb)[ds.hbf] = t.value; recompute(); updateMeter(t.closest('[data-hb]')); return changed(false); }
  if (ds.eff !== undefined && t.tagName === 'INPUT') { const h = hb(t.closest('[data-hb]').dataset.hb); const e2 = h.effects[Number(ds.eff)]; e2[ds.k] = ds.k === 'uses' ? (t.value === 'prof' ? 'prof' : t.value) : t.value; recompute(); updateMeter(t.closest('[data-hb]')); return changed(false); }
  if (ds.manual) { build.abilities.base[ds.manual] = t.value === '' ? null : Math.round(Number(t.value)); return changed(false); }
});
document.addEventListener('change', (e) => {
  const t = e.target, ds = t.dataset;
  if (ds.assign) { build.abilities.base[ds.assign] = t.value === '' ? null : Number(t.value); return changed(); }
  if (ds.armor !== undefined) { build.gear.armor = t.value || null; return changed(); }
  if (ds.shield !== undefined) { build.gear.shield = t.checked; return changed(); }
  if (ds.manual) return changed();
  if (ds.hbf === 'slot') { hb(t.closest('[data-hb]').dataset.hb).slot = t.value; return changed(); }
  if (ds.eff !== undefined && t.tagName === 'SELECT') {
    const h = hb(t.closest('[data-hb]').dataset.hb); const i = Number(ds.eff);
    if (ds.k === 'kind') { h.effects[i] = { kind: t.value }; if (P.KINDS[t.value].spent) h.effects[i].per = 'long'; }
    else h.effects[i][ds.k] = t.value;
    return changed();
  }
  if (ds.eff !== undefined || ds.hbf) return changed();
});
// The meter updates while you type, without redrawing the editor (so the cursor stays put).
function updateMeter(card) {
  const box = card && card.querySelector('.meterbox');
  if (box) box.innerHTML = meterHtml(P.rate(hb(card.dataset.hb), { level: build.level, config: cfg }), true);
}

// ---------- start ----------
(async () => {
  if (!TOKEN || !ID) { if (!ID) location.href = '/'; return; }
  if (!(await load())) return;
  $('gate').hidden = true; $('app').hidden = false;
  if (qs.get('levelup') && build.level < 20) {
    build.level += 1;
    history.replaceState(null, '', location.pathname + '?id=' + encodeURIComponent(ID) + '#' + step);
    changed();
    const first = Rules.STEPS.find((s) => d.steps[s.id] !== 'ok' && s.id !== 'homebrew');
    toast(`Level ${build.level}! ${first ? 'New choices are marked in the list.' : 'Nothing new to choose: HP and features are updated.'}`);
    if (first) step = first.id;
  }
  if (!Rules.STEPS.some((s) => s.id === step)) step = 'concept';
  render();
  window.addEventListener('hashchange', () => { const s = location.hash.slice(1); if (s !== step && Rules.STEPS.some((x) => x.id === s)) go(s); });
  let t = null;
  new EventSource('/events').onmessage = () => {
    clearTimeout(t);
    t = setTimeout(async () => {
      if (editSeq !== sentSeq || saving) return;
      const r = await fetch(`/api/char?token=${encodeURIComponent(TOKEN)}&id=${encodeURIComponent(ID)}`);
      if (!r.ok) return;
      const v = await r.json();
      const before = JSON.stringify([view.suggestions, view.requests, (view.build.homebrew || []).map((h) => [h.status, h.dmNote]), view.build.abilities.approved]);
      const after = JSON.stringify([v.suggestions, v.requests, (v.build.homebrew || []).map((h) => [h.status, h.dmNote]), v.build.abilities.approved]);
      if (before === after) return;
      const fresh = (v.suggestions || []).filter((s) => s.status === 'open' && !(view.suggestions || []).some((x) => x.id === s.id)).length;
      const typing = document.activeElement && /INPUT|TEXTAREA/.test(document.activeElement.tagName);
      adopt(v, typing);
      if (typing) { renderTop(); renderNav(); renderSheet(); } else render();
      if (fresh) toast(`★ The DM has ${fresh > 1 ? fresh + ' new suggestions' : 'a new suggestion'} for you.`);
    }, 200);
  };
})();
</script>
